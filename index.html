: Basınç`,title:`Basınç: katı, sıvı ve gaz basıncı`,goal:`Katı, sıvı ve gaz basıncını hesaplamak ve yorumlamak.`,objectives:[`P = F/A bağıntısını kullanır.`,`Sıvı basıncının nelere bağlı olduğunu açıklar.`,`Açık hava basıncını yorumlar.`],minutes:35,difficulty:2,body:[`Basınç, birim yüzeye dik etki eden kuvvettir: P = F ÷ A. Birimi pascal (Pa = N/m²). Kuvvet büyükse basınç büyür, yüzey alanı büyükse basınç küçülür (bıçağın keskin yüzü basıncı artırır).`,`Sıvı basıncı derinlikle ve sıvının yoğunluğuyla artar: P = h · d · g. Sıvı basıncı kabın şekline, miktarına veya tabanın genişliğine bağlı değildir.`,`Pascal prensibi: Kapalı kaptaki sıvıya uygulanan basınç, sıvının her noktasına aynen iletilir (hidrolik fren, kriko).`,`Açık hava basıncı: Atmosferin ağırlığından doğar; yükseldikçe azalır. Deniz seviyesinde yaklaşık 1 atm (76 cmHg).`],keyTerms:[{term:`Pascal (Pa)`,def:`Basınç birimi, N/m².`},{term:`Yoğunluk`,def:`Birim hacmin kütlesi.`}],worked:[{q:`100 N’luk kuvvet 0,5 m² yüzeye dik etki ediyor. Basınç?`,steps:[`P = F ÷ A = 100 ÷ 0,5 = 200 Pa.`]}],reference:pr,questions:[tr(1,1,`100 N’luk kuvvet 0,5 m²’lik yüzeye dik etki ediyor. Basınç kaç Pa’dır?`,[`50`,`200`,`100`,`0,005`],1,`P = F ÷ A = 100 ÷ 0,5 = 200 Pa.`),tr(2,1,`Sıvı basıncı aşağıdakilerden hangisine bağlı DEĞİLDİR?`,[`Sıvının yoğunluğuna`,`Sıvının derinliğine`,`Kabın şekline`,`Yerçekimi ivmesine`],2,`Sıvı basıncı P = h·d·g’dir; kabın şekline bağlı değildir.`),tr(3,2,`Aynı kuvvet iki farklı yüzeye uygulanıyor. Yüzey alanı küçük olan yüzeyde basınç nasıl olur?`,[`Daha küçük`,`Daha büyük`,`Aynı`,`Sıfır`],1,`P = F ÷ A; alan küçüldükçe basınç büyür.`),tr(4,2,`Kapalı kaptaki bir sıvıya uygulanan basıncın sıvının her noktasına aynen iletilmesi hangi prensiptir?`,[`Arşimet`,`Pascal`,`Newton`,`Torricelli`],1,`Bu, Pascal prensibidir; hidrolik sistemlerin dayanağıdır.`),tr(5,2,`Yükseklere çıkıldıkça açık hava basıncı nasıl değişir?`,[`Artar`,`Azalır`,`Değişmez`,`Önce artar sonra azalır`],1,`Yükseldikçe üstteki hava miktarı azaldığı için açık hava basıncı azalır.`)]}),F({id:`f8-makine`,subject:`fiz`,grade:8,unit:`LGS 8. sınıf Fen: Basit Makineler`,title:`Basit makineler: kaldıraç, makara, eğik düzlem`,goal:`Basit makinelerde kuvvet kazancını ve iş korunumunu yorumlamak.`,objectives:[`Kaldıraç dengesini hesaplar.`,`Makara çeşitlerinin kuvvet kazancını bilir.`,`Eğik düzlemde kuvvet ve yol ilişkisini açıklar.`],prereq:[`f8-basinc`],minutes:35,difficulty:2,body:[`Basit makineler işi kolaylaştırır; kuvvetten kazanç sağlayabilir ama işten kazanç sağlamaz (yapılan iş değişmez). Kuvvetten kazanç yoldan kayıpla ödenir.`,`Kaldıraç denge koşulu: Kuvvet × kuvvet kolu = yük × yük kolu (F₁·d₁ = F₂·d₂). Örnek: 20 · 3 = F · 2 → F = 30.`,`Sabit makara kuvvetten kazanç sağlamaz, yalnızca kuvvetin yönünü değiştirir. Hareketli makara kuvvetten 2 kat kazanç sağlar.`,`Eğik düzlemde yol uzadıkça gerekli kuvvet azalır (boy/yükseklik oranı kuvvet kazancını verir). Dişli, çıkrık, vida ve palanga da basit makinelerdir.`],keyTerms:[{term:`Kuvvet kazancı`,def:`Daha az kuvvetle iş yapabilme.`},{term:`Kaldıraç`,def:`Bir dayanak noktası etrafında dönen çubuk.`}],worked:[{q:`Dayanak noktasına 3 m uzaklıkta 20 N, öbür tarafta 2 m uzaklıkta kaç N’lik yük dengeler?`,steps:[`20 · 3 = F · 2 → F = 30 N.`]}],reference:pr,questions:[nr(1,2,`Dayanak noktasının bir tarafında 3 m uzaklıkta 20 N’luk kuvvet var. Dengeyi sağlamak için diğer tarafta 2 m uzaklığa kaç N’lik yük asılmalıdır?`,[`10`,`30`,`40`,`60`],1,`20 · 3 = F · 2 → F = 30 N.`),nr(2,1,`Sabit makara için aşağıdakilerden hangisi doğrudur?`,[`Kuvvetten 2 kat kazanç sağlar.`,`Yalnızca kuvvetin yönünü değiştirir.`,`İşten kazanç sağlar.`,`Yoldan kazanç sağlar.`],1,`Sabit makara kuvvetten kazanç sağlamaz; yönü değiştirir.`),nr(3,2,`Eğik düzlemde yol (boy) uzatılırsa aynı yükü çıkarmak için gerekli kuvvet ne olur?`,[`Artar`,`Azalır`,`Değişmez`,`Sıfırlanır`],1,`Boy uzadıkça kuvvet azalır; ama yol uzadığı için iş (ideal durumda) değişmez.`),nr(4,3,`Basit makineler için aşağıdakilerden hangisi kesinlikle doğrudur?`,[`İşten kazanç sağlar.`,`Kuvvetten kazanç sağlanırsa yoldan kayıp olur.`,`Her zaman enerji üretir.`,`Yalnızca yön değiştirir.`],1,`Kuvvetten kazanç yoldan kayıpla ödenir; işten (enerjiden) kazanç yoktur.`),nr(5,2,`Hareketli bir makara kuvvetten kaç kat kazanç sağlar? (Ağırlığı ihmal ediniz.)`,[`1`,`2`,`3`,`4`],1,`Hareketli makara kuvvetten 2 kat kazanç sağlar.`)]}),F({id:`f8-elektrik`,subject:`fiz`,grade:8,unit:`LGS 8. sınıf Fen: Elektrik Yükleri`,title:`Elektrik yükleri ve elektriklenme`,goal:`Elektriklenme çeşitlerini ve yüklü cisimlerin etkileşimini açıklamak.`,objectives:[`Yükler arası kuvvetleri yorumlar.`,`Sürtünme, dokunma ve etki ile elektriklenmeyi ayırır.`,`İletken ve yalıtkanı ayırt eder.`],minutes:30,difficulty:2,body:[`Aynı cins yükler birbirini iter, zıt cins yükler birbirini çeker. Nötr cisimde pozitif ve negatif yük miktarı eşittir.`,`Sürtünme ile elektriklenme: İki cisim sürtülünce elektron geçer; ikisi de zıt cins yükle yüklenir. Dokunma ile elektriklenme: Yüklü cisim nötr bir iletkene dokunursa yükünün bir kısmı geçer, aynı cins yük kazanır. Etki ile elektriklenme: Dokunmadan yaklaştırınca nötr cismin yükleri ayrışır.`,`Elektroskop yük varlığını gösterir: Yüklü bir cisim yaklaştırılınca yapraklar aynı yükü taşıdığı için birbirini iter ve açılır.`,`İletkenler (metaller) yükü kolay iletir; yalıtkanlar (plastik, cam, ahşap) iletmez. Elektrik yükünün birimi coulomb’dur.`],keyTerms:[{term:`Elektroskop`,def:`Yük varlığını gösteren araç.`},{term:`İletken / yalıtkan`,def:`Yükü ileten / iletmeyen madde.`}],worked:[{q:`Pozitif yüklü iki cisim birbirine yaklaştırılırsa?`,steps:[`Aynı cins yükler iter.`]}],reference:pr,questions:[rr(1,1,`Pozitif yüklü iki cisim birbirine yaklaştırılırsa ne olur?`,[`Birbirini çeker`,`Birbirini iter`,`Etkileşmez`,`Nötrleşir`],1,`Aynı cins yükler birbirini iter.`),rr(2,1,`Aşağıdakilerden hangisi iyi bir yalıtkandır?`,[`Bakır tel`,`Plastik`,`Alüminyum`,`Demir`],1,`Plastik yükü iletmeyen bir yalıtkandır; metaller iletkendir.`),rr(3,2,`Nötr bir elektroskobun topuzuna negatif yüklü bir çubuk dokunmadan yaklaştırılırsa yapraklar nasıl davranır?`,[`Açılır`,`Kapanır`,`Değişmez`,`Pozitif olur`],0,`Etki ile elektriklenmede yapraklarda aynı cins yük toplanır; yapraklar birbirini iter ve açılır.`),rr(4,2,`İki cisim birbirine sürtüldüğünde ne olur?`,[`İkisi de aynı cins yüklenir.`,`Biri pozitif biri negatif yüklenir.`,`Hiç yük değişmez.`,`İkisi de nötr kalır.`],1,`Sürtünmede elektron bir cisimden diğerine geçer; zıt cins yüklenirler.`),rr(5,2,`Nötr bir iletkene pozitif yüklü bir cisim dokunursa iletken nasıl yüklenir?`,[`Negatif`,`Pozitif`,`Nötr kalır`,`Yüksüz`],1,`Dokunma ile elektriklenmede iletken, dokunan cisimle aynı cins yük kazanır.`)]}),F({id:`k8-madde`,subject:`kim`,grade:8,unit:`LGS 8. sınıf Fen: Madde ve Endüstri`,title:`Periyodik sistem, asit-baz ve kimyasal tepkimeler`,goal:`Periyodik sistemde element sınıflarını, asit-baz özelliklerini ve kimyasal tepkimelerde kütle korunumunu kavramak.`,objectives:[`Elementleri metal, ametal, soygaz olarak sınıflar.`,`Asit ve bazları pH ile yorumlar.`,`Kimyasal tepkimede kütlenin korunduğunu uygular.`],minutes:40,difficulty:2,body:[`Periyodik sistemde elementler artan atom numarasına göre dizilir. Metaller (Na, Fe, Cu) parlak ve iletkendir; ametaller (C, O, S) genelde yalıtkandır; soygazlar (He, Ne, Ar) kararlıdır.`,`Kimyasal tepkimelerde atomlar korunur, kütle korunur. Denkleştirme: 2H₂ + O₂ → 2H₂O. Girenlerin toplam kütlesi ürünlerin toplam kütlesine eşittir.`,`Asitler pH < 7 (ekşi, mavi turnusolu kırmızıya çevirir), bazlar pH > 7 (kayganımsı, acı), nötr maddeler pH = 7’dir. Asit + baz → tuz + su (nötrleşme).`,`Kimyasal değişim yeni madde oluşur (yanma, paslanma, çürüme); fiziksel değişimde madde cinsi değişmez (erime, çözünme).`],keyTerms:[{term:`pH`,def:`Asitlik/bazlık ölçeği (0–14).`},{term:`Nötrleşme`,def:`Asit ile bazın tepkimesiyle tuz ve su oluşması.`}],worked:[{q:`24 g magnezyum 16 g oksijenle tamamen tepkimeye girerse kaç g magnezyum oksit oluşur?`,steps:[`Kütle korunur: 24 + 16 = 40 g.`]}],reference:pr,questions:[ir(1,1,`pH değeri 3 olan bir çözelti için ne söylenebilir?`,[`Asittir`,`Bazdır`,`Nötrdür`,`Tuzdur`],0,`pH < 7 asidik çözeltiyi gösterir.`),ir(2,2,`24 g magnezyum yeterli oksijenle tepkimeye girerek 40 g magnezyum oksit oluşturuyor. Harcanan oksijen kaç g’dır?`,[`16`,`64`,`24`,`40`],0,`Kütle korunumu: 40 − 24 = 16 g oksijen harcanmıştır.`),ir(3,2,`H₂ + O₂ → H₂O tepkimesi doğru denkleştirildiğinde katsayılar hangisidir?`,[`1, 1, 1`,`2, 1, 2`,`2, 2, 1`,`1, 2, 2`],1,`2H₂ + O₂ → 2H₂O: her iki tarafta 4 H ve 2 O atomu bulunur.`),ir(4,1,`Aşağıdakilerden hangisi bir metaldir?`,[`Karbon`,`Sodyum`,`Oksijen`,`Neon`],1,`Sodyum (Na) bir metaldir; karbon ve oksijen ametal, neon soygazdır.`),ir(5,2,`Bir asit ile bir bazın tepkimesinden hangi maddeler oluşur?`,[`Yalnızca su`,`Tuz ve su`,`Yalnızca tuz`,`Hidrojen ve oksijen`],1,`Asit + baz → tuz + su (nötrleşme).`)]}),F({id:`b8-dna`,subject:`biy`,grade:8,unit:`LGS 8. sınıf Fen: DNA ve Genetik Kod`,title:`DNA, gen, kalıtım, mutasyon ve modifikasyon`,goal:`DNA, gen ve kromozom ilişkisini; kalıtım ve çevre etkisini ayırt etmek.`,objectives:[`DNA, gen ve kromozomu ilişkilendirir.`,`Baskın ve çekinik özelliği yorumlar.`,`Mutasyon ile modifikasyonu ayırt eder.`],minutes:35,difficulty:2,body:[`Kalıtım maddesi DNA’dır. DNA nükleotit denilen yapı taşlarından oluşan çift sarmal bir moleküldür. Gen, DNA üzerinde bir özelliği belirleyen bölgedir. DNA sıkıca paketlenince kromozomu oluşturur. İnsan vücut hücrelerinde 46 kromozom (23 çift) bulunur.`,`Genotip genlerin bileşimi (AA, Aa, aa), fenotip ise gözlenen özelliktir. Baskın gen (büyük harf) varsa fenotipte kendini gösterir; çekinik özellik yalnızca aa genotipinde ortaya çıkar. Aa genotipi baskın fenotip gösterir.`,`Mutasyon: DNA’daki kalıcı değişimdir; kalıtsal olabilir. Modifikasyon: Çevre koşullarının etkisiyle oluşan, kalıtsal olmayan (genleri değiştirmeyen) değişimdir (güneşte esmerleşme).`,`Adaptasyon (uyum): canlının yaşadığı çevreye uygun özellikler kazanmasıdır. Biyoteknoloji: Canlıların ve DNA’nın insanın yararına kullanımı (gen aktarımı, insülin üretimi, aşı).`],keyTerms:[{term:`Gen`,def:`DNA’nın özelliği belirleyen bölgesi.`},{term:`Mutasyon`,def:`DNA’da kalıcı değişim.`},{term:`Modifikasyon`,def:`Çevreden kaynaklı, kalıtsal olmayan değişim.`}],worked:[{q:`Aa genotipli bireyin fenotipi baskın mı çekinik mi?`,steps:[`A baskın, a çekinik.`,`Baskın gen varlığında fenotip baskındır.`]}],reference:pr,questions:[ar(1,1,`İnsanın vücut hücrelerinde kaç kromozom bulunur?`,[`23`,`44`,`46`,`92`],2,`İnsanın vücut hücrelerinde 46 kromozom (23 çift) vardır.`),ar(2,2,`Aşağıdakilerden hangisi kalıtsal OLMAYAN bir değişimdir?`,[`Mutasyon`,`Güneşte kalınca derinin esmerleşmesi`,`Göz renginin ebeveynlerden gelmesi`,`Kan grubunun belirlenmesi`],1,`Güneşte esmerleşme modifikasyondur; genleri değiştirmez ve kalıtsal değildir.`),ar(3,2,`Aa genotipli bir bireyin fenotipi için ne söylenebilir? (A: baskın, a: çekinik)`,[`Çekinik özelliği gösterir.`,`Baskın özelliği gösterir.`,`İki özelliği de karışık gösterir.`,`Hiçbir özellik göstermez.`],1,`Baskın gen (A) varsa fenotipte baskın özellik görülür.`),ar(4,1,`DNA üzerinde belirli bir özelliği belirleyen bölgeye ne ad verilir?`,[`Gen`,`Kromozom`,`Hücre`,`Doku`],0,`Özelliği belirleyen DNA bölgesine gen denir.`),ar(5,2,`DNA’daki kalıcı değişime ne ad verilir?`,[`Modifikasyon`,`Adaptasyon`,`Mutasyon`,`Fotosentez`],2,`DNA’daki kalıcı değişim mutasyondur.`)]}),F({id:`b8-enerji-cevre`,subject:`biy`,grade:8,unit:`LGS 8. sınıf Fen: Enerji Dönüşümleri ve Çevre Bilimi`,title:`Fotosentez, besin zinciri ve çevre`,goal:`Fotosentez, besin zinciri ve enerji akışını; çevre sorunlarını kavramak.`,objectives:[`Fotosentezin girdi ve ürünlerini bilir.`,`Besin zincirini ve enerji akışını yorumlar.`,`Çevre sorunlarının nedenlerini sıralar.`],prereq:[`b8-dna`],minutes:35,difficulty:2,body:[`Fotosentez: Bitkiler ışık enerjisiyle karbondioksit ve suyu kullanarak glikoz (besin) ve oksijen üretir. Işık enerjisi kimyasal enerjiye dönüşür.`,`Besin zinciri: Üretici (bitki) → birincil tüketici (otçul) → ikincil tüketici (etçil) → ayrıştırıcı. Enerji her basamakta yaklaşık %10 oranında bir üst basamağa aktarılır; geri kalan ısı olarak kaybolur.`,`Madde döngüleri: Su, karbon ve azot doğada döner. Madde döngüsel, enerji tek yönlüdür.`,`Çevre sorunları: Hava kirliliği, küresel ısınma (sera gazı olan karbondioksitin artışı), buzulların erimesi. Çözüm: geri dönüşüm, tasarruf, yenilenebilir enerji, sürdürülebilir kalkınma.`],keyTerms:[{term:`Üretici`,def:`Besinini kendisi üreten canlı.`},{term:`Ayrıştırıcı`,def:`Ölü canlıları ayrıştıran canlı.`},{term:`Sera gazı`,def:`Isı tutan gazlar (CO₂, CH₄).`}],worked:[{q:`Besin zincirinde birincil tüketiciye 100 birim enerji ulaşırsa ikincil tüketiciye yaklaşık ne kadar aktarılır?`,steps:[`%10 kuralı: 100 × 0,10 = 10 birim.`]}],reference:pr,questions:[or(1,1,`Fotosentezde bitki hangi maddeleri kullanarak glikoz üretir?`,[`Oksijen ve su`,`Karbondioksit ve su`,`Oksijen ve glikoz`,`Azot ve karbon`],1,`Karbondioksit + su + ışık enerjisi → glikoz + oksijen.`),or(2,1,`Bir besin zincirinde üretici olarak aşağıdakilerden hangisi gösterilebilir?`,[`Tavşan`,`Çimen`,`Kurt`,`Mantar (ayrıştırıcı)`],1,`Besinini fotosentezle kendisi üreten çimen üreticidir.`),or(3,2,`Besin zincirinde enerji aktarımı için hangisi doğrudur?`,[`Enerji basamak basamak artar.`,`Her basamakta yaklaşık %10’u bir üst basamağa geçer.`,`Enerji hiç kaybolmaz.`,`Enerji ayrıştırıcıdan üreticiye gider.`],1,`Enerjinin yaklaşık %10’u bir üst basamağa geçer; kalanı ısı olarak kaybolur.`),or(4,2,`100 birim enerjiye sahip bir otçuldan etçile yaklaşık kaç birim enerji aktarılır?`,[`1`,`10`,`50`,`100`],1,`%10 kuralı: 100 × 0,10 = 10 birim.`),or(5,2,`Küresel ısınmanın başlıca nedeni aşağıdakilerden hangisidir?`,[`Sera gazlarının artması`,`Ormanların çoğalması`,`Güneş’in küçülmesi`,`Ay’ın yaklaşması`],0,`Karbondioksit gibi sera gazlarının artışı atmosferde ısı tutulmasını artırır.`)]}),F({id:`c8-iklim`,subject:`cog`,grade:8,unit:`LGS 8. sınıf Fen: Mevsimler ve İklim`,title:`Mevsimler, iklim ve hava olayları`,goal:`İklim ile hava durumunu ayırt etmek; Türkiye iklimlerini ve iklim elemanlarını tanımak.`,objectives:[`Hava durumu ile iklimi ayırır.`,`İklim elemanlarını sıralar.`,`Türkiye’deki başlıca iklim tiplerini ayırt eder.`],minutes:30,difficulty:2,body:[`Hava durumu, bir yerin kısa süredeki atmosfer koşullarıdır (bugün yağmurlu). İklim, bir yerin uzun yıllara (genellikle 30 yıl) ait ortalama atmosfer koşullarıdır.`,`İklim elemanları: sıcaklık, yağış, nem, basınç, rüzgâr. Mevsimler, Dünya’nın eksen eğikliği ve Güneş etrafındaki dolanmasıyla oluşur.`,`Türkiye’de başlıca iklimler: Akdeniz iklimi (yazlar sıcak ve kurak, kışlar ılık ve yağışlı), Karadeniz iklimi (her mevsim yağışlı), karasal iklim (yazlar sıcak ve kurak, kışlar soğuk).`,`Küresel iklim değişikliği, insan kaynaklı sera gazı salınımının atmosferde ısı tutmasıyla ortalama sıcaklıkların artmasıdır.`],keyTerms:[{term:`İklim`,def:`Uzun yıllara ait ortalama atmosfer koşulları.`},{term:`Hava durumu`,def:`Kısa süreli atmosfer koşulları.`}],worked:[{q:`“Bu hafta İstanbul’da yağmur bekleniyor.” hava durumu mu iklim mi?`,steps:[`Kısa süreli tahmin → hava durumu.`]}],reference:pr,questions:[sr(1,1,`“Bugün hava yağışlı ve soğuk.” ifadesi için aşağıdakilerden hangisi doğrudur?`,[`İklimi anlatır.`,`Hava durumunu anlatır.`,`Mevsimi anlatır.`,`Basıncı anlatır.`],1,`Kısa süreli atmosfer koşulları hava durumudur.`),sr(2,1,`Aşağıdakilerden hangisi bir iklim elemanı DEĞİLDİR?`,[`Sıcaklık`,`Yağış`,`Rüzgâr`,`Bitki örtüsü`],3,`İklim elemanları sıcaklık, yağış, nem, basınç ve rüzgârdır; bitki örtüsü iklimden etkilenir ama eleman değildir.`),sr(3,2,`Yazları sıcak ve kurak, kışları ılık ve yağışlı olan iklim tipi aşağıdakilerden hangisidir?`,[`Karadeniz iklimi`,`Akdeniz iklimi`,`Karasal iklim`,`Kutup iklimi`],1,`Bu özellikler Akdeniz iklimine aittir.`),sr(4,2,`Her mevsim yağış alan Türkiye iklimi hangisidir?`,[`Akdeniz iklimi`,`Karadeniz iklimi`,`Karasal iklim`,`Çöl iklimi`],1,`Karadeniz kıyılarında yağış her mevsim görülür.`),sr(5,2,`Mevsimlerin oluşmasının nedeni aşağıdakilerden hangisidir?`,[`Dünya’nın kendi ekseni etrafında dönmesi`,`Eksen eğikliği ve Güneş etrafında dolanma`,`Ay’ın hareketi`,`Güneş’in sıcaklığının değişmesi`],1,`Mevsimler eksen eğikliği ve dolanma hareketinin birleşik sonucudur.`)]})],gr=[F({id:`h8-kahraman`,subject:`tar`,grade:8,unit:`LGS 8. sınıf İnkılap: Bir Kahraman Doğuyor`,title:`Bir Kahraman Doğuyor: Mustafa Kemal’in hayatı ve I. Dünya Savaşı`,goal:`Mustafa Kemal’in gençliğini, askerî başarılarını ve dönemin koşullarını kronolojik sıralamak.`,objectives:[`Mustafa Kemal’in doğum yerini ve eğitimini sıralar.`,`Trablusgarp ve Çanakkale’deki rolünü bilir.`],minutes:30,difficulty:1,body:[`Mustafa Kemal 1881’de Selanik’te doğdu. Babası Ali Rıza Efendi, annesi Zübeyde Hanım’dır. Askerî okullarda (Selanik, Manastır, Harbiye) okudu.`,`Trablusgarp Savaşı’nda (1911) İtalyanlara karşı savaştı. Balkan Savaşları ve I. Dünya Savaşı döneminde çeşitli görevlerde bulundu.`,`Çanakkale Cephesi’nde (1915) Conkbayırı ve Anafartalar’da başarılı oldu. Anafartalar Grup Komutanı olarak düşmanı durdurdu.`,`Osmanlı Devleti I. Dünya Savaşı’ndan yenik çıktı; bu durum Mondros Ateşkesi’ne (1918) ve millî mücadelenin başlamasına yol açtı.`],keyTerms:[{term:`Anafartalar`,def:`Mustafa Kemal’in komuta ettiği Çanakkale muharebelerinden biri (1915).`}],worked:[{q:`Mustafa Kemal nerede doğdu?`,steps:[`1881, Selanik.`]}],reference:mr,questions:[cr(1,1,`Mustafa Kemal Atatürk hangi şehirde doğmuştur?`,[`İstanbul`,`Selanik`,`Ankara`,`Manastır`],1,`Mustafa Kemal 1881’de Selanik’te doğdu.`),cr(2,1,`Mustafa Kemal’in 1915’te Çanakkale Cephesi’nde başarı gösterdiği yerlerden biri hangisidir?`,[`Sakarya`,`Conkbayırı`,`Dumlupınar`,`Kocatepe`],1,`Conkbayırı ve Anafartalar Çanakkale Savaşları’ndaki başarılarıdır.`),cr(3,2,`Aşağı asyonel ve irrasyonel sayıların tamamı.`}],worked:[{q:`√50 + √18 işleminin sonucu nedir?`,steps:[`√50 = √(25·2) = 5√2`,`√18 = √(9·2) = 3√2`,`5√2 + 3√2 = 8√2`]},{q:`(−3, 2] aralığındaki tam sayılar hangileridir?`,steps:[`−3 dahil değil, 2 dahil.`,`−2, −1, 0, 1, 2 → 5 tam sayı.`]}],reference:R,questions:[_r(1,1,`Aşağıdakilerden hangisi irrasyonel bir sayıdır?`,[`√16`,`0,25`,`√7`,`−3/4`],2,`√7 tam kare olmadığı için a/b biçiminde yazılamaz; irrasyoneldir. √16 = 4 rasyoneldir.`),_r(2,2,`√48 ifadesinin en sade biçimi hangisidir?`,[`4√3`,`3√4`,`2√12`,`16√3`],0,`48 = 16 · 3 olduğundan √48 = 4√3.`),_r(3,2,`[−1, 4) aralığında kaç tam sayı vardır?`,[`4`,`5`,`6`,`3`],1,`−1, 0, 1, 2, 3 → 5 tam sayı (4 dahil değil).`),_r(4,1,`0,666… devirli ondalık sayısının kesir biçimi hangisidir?`,[`6/10`,`2/3`,`3/5`,`66/100`],1,`0,666… = 6/9 = 2/3; devirli ondalık sayılar rasyoneldir.`),_r(5,3,`2√3 + √27 − √12 işleminin sonucu nedir?`,[`3√3`,`5√3`,`√18`,`2√3`],0,`√27 = 3√3, √12 = 2√3 → 2√3 + 3√3 − 2√3 = 3√3.`)]}),F({id:`m9-mutlak`,subject:`mat`,grade:9,unit:`Sayılar`,title:`Mutlak değer`,goal:`Mutlak değeri sayı doğrusunda uzaklık olarak yorumlamak; mutlak değerli basit denklem ve eşitsizlikleri çözmek.`,objectives:[`|a| değerini bulur.`,`|x − a| = b denklemini çözer.`,`|x − a| < b eşitsizliğinin çözümünü aralık olarak yazar.`],prereq:[`m9-gercek`],minutes:35,difficulty:2,body:[`Bir sayının mutlak değeri, sayı doğrusunda 0’a olan uzaklığıdır; uzaklık negatif olamaz. |5| = 5, |−5| = 5, |0| = 0.`,`|x − a| ifadesi x ile a arasındaki uzaklıktır. Örnek: |x − 2| = 3 → x, 2’ye 3 birim uzaktadır → x = 5 veya x = −1.`,`|x − a| = b (b > 0) denkleminin iki çözümü vardır: x = a + b ve x = a − b. Çözümlerin toplamı 2a olur. b < 0 ise çözüm yoktur.`,`|x − a| < b eşitsizliği a − b < x < a + b demektir. |x − a| > b ise x < a − b veya x > a + b.`,`İşlem sırası: önce mutlak değerin içi hesaplanır, sonra mutlak değer alınır: |3 − 8| = |−5| = 5.`],keyTerms:[{term:`Mutlak değer`,def:`Bir sayının 0’a uzaklığı.`},{term:`|x − a|`,def:`x ile a arasındaki uzaklık.`}],worked:[{q:`|x + 1| = 4 denklemini çözün.`,steps:[`|x − (−1)| = 4 → x, −1’e 4 birim uzak.`,`x = −1 + 4 = 3 veya x = −1 − 4 = −5.`]},{q:`|x − 3| ≤ 2 eşitsizliğini sağlayan tam sayılar?`,steps:[`1 ≤ x ≤ 5`,`1, 2, 3, 4, 5 → 5 tam sayı.`]}],reference:R,questions:[vr(1,1,`|−7| + |3| işleminin sonucu nedir?`,[`−4`,`4`,`10`,`−10`],2,`|−7| = 7, |3| = 3 → 7 + 3 = 10.`),vr(2,2,`|x − 4| = 6 denkleminin çözümleri hangileridir?`,[`10 ve −2`,`10 ve 2`,`6 ve −6`,`−10 ve 2`],0,`x = 4 + 6 = 10 veya x = 4 − 6 = −2.`),vr(3,2,`|x| < 3 eşitsizliğini sağlayan kaç tam sayı vardır?`,[`3`,`5`,`6`,`7`],1,`−3 < x < 3 → −2, −1, 0, 1, 2 → 5 tam sayı.`),vr(4,2,`|2 − 9| − |−4| işleminin sonucu nedir?`,[`3`,`−3`,`11`,`7`],0,`|2 − 9| = |−7| = 7; |−4| = 4 → 7 − 4 = 3.`),vr(5,3,`|x + 2| = −3 denkleminin çözüm kümesi nedir?`,[`{1}`,`{−5, 1}`,`{−5}`,`Boş küme`],3,`Mutlak değer negatif olamaz; çözüm yoktur.`)]}),F({id:`m9-denklem`,subject:`mat`,grade:9,unit:`Nicelikler ve Değişimler`,title:`Birinci dereceden denklemler ve problemler`,goal:`Birinci dereceden bir bilinmeyenli denklemleri çözmek; yaş, yüzde ve sayı problemlerini denkleme dönüştürmek.`,objectives:[`ax + b = c denklemini çözer.`,`Sözel problemi denklem olarak yazar.`,`Yüzde hesaplarını yapar.`],prereq:[`m8-denklem`],minutes:40,difficulty:2,body:[`Denklem çözme: eşitliğin iki tarafına aynı işlem yapılır. 3x − 5 = 16 → 3x = 21 → x = 7.`,`Parantezli denklem: önce parantez açılır. 2(x + 3) = x + 10 → 2x + 6 = x + 10 → x = 4.`,`Kesirli denklem: paydalar eşitlenir veya iki taraf paydaların EKOK’u ile çarpılır. x/2 + x/3 = 10 → 3x + 2x = 60 → x = 12.`,`Problem çözme adımları: bilinmeyene harf ver → verilenleri denklem olarak yaz → çöz → sonucu soruyla kontrol et.`,`Yüzde: a sayısının %p’si a · p / 100. %20 indirimli fiyat = fiyat · 80/100. Yaş problemlerinde her yıl herkesin yaşı 1 artar.`],keyTerms:[{term:`Bilinmeyen`,def:`Değeri bulunmak istenen harf (x).`},{term:`Yüzde`,def:`Yüzde birlik pay: %p = p/100.`}],worked:[{q:`Bir sayının 3 katının 7 fazlası 34 ise sayı kaçtır?`,steps:[`3x + 7 = 34`,`3x = 27`,`x = 9`]},{q:`400 TL’lik ürüne %25 indirim yapılırsa yeni fiyat?`,steps:[`İndirim: 400 · 25/100 = 100 TL`,`Yeni fiyat: 400 − 100 = 300 TL`]}],reference:R,questions:[yr(1,1,`4x + 3 = 27 denkleminde x kaçtır?`,[`5`,`6`,`7`,`24`],1,`4x = 24 → x = 6.`),yr(2,2,`3(x − 2) = x + 8 denkleminde x kaçtır?`,[`5`,`7`,`3`,`4`],1,`3x − 6 = x + 8 → 2x = 14 → x = 7.`),yr(3,2,`x/2 + x/4 = 9 denkleminde x kaçtır?`,[`12`,`18`,`6`,`36`],0,`İki tarafı 4 ile çarp: 2x + x = 36 → 3x = 36 → x = 12.`),yr(4,2,`Bir annenin yaşı kızının yaşının 4 katıdır. Yaşları toplamı 45 ise kızı kaç yaşındadır?`,[`9`,`10`,`11`,`36`],0,`Kız x, anne 4x → 5x = 45 → x = 9.`),yr(5,3,`600 TL’lik bir ürünün fiyatı önce %10 artırılıp sonra yeni fiyat üzerinden %10 indiriliyor. Son fiyat kaç TL’dir?`,[`600`,`594`,`606`,`540`],1,`600 · 1,1 = 660; 660 · 0,9 = 594 TL. Aynı oranda artış ve indirim başa döndürmez.`)]}),F({id:`m9-fonksiyon`,subject:`mat`,grade:9,unit:`Nicelikler ve Değişimler`,title:`Fonksiyon kavramı ve doğrusal fonksiyonlar`,goal:`İki nicelik arasındaki ilişkiyi fonksiyon olarak ifade etmek; f(x) değerini bulmak ve doğrusal fonksiyonun grafiğini yorumlamak.`,objectives:[`Bir ilişkinin fonksiyon olup olmadığını belirler.`,`f(a) değerini hesaplar.`,`f(x) = ax + b grafiğinde eğim ve y-kesenini yorumlar.`],prereq:[`m9-nicelik`],minutes:40,difficulty:2,body:[`Fonksiyon: tanım kümesindeki her elemanı değer kümesindeki yalnızca bir elemana eşleyen kuraldır. Bir girdinin iki farklı çıktısı olamaz.`,`f(x) = 2x + 1 ise f(3) = 2 · 3 + 1 = 7. Yani x yerine 3 yazılır.`,`Doğrusal fonksiyon: f(x) = ax + b. a eğimdir (x 1 artınca f(x) a kadar değişir), b grafiğin y eksenini kestiği noktadır (f(0) = b).`,`Grafik okuma: grafikte x = 2 için noktanın yüksekliği f(2)’dir. Artan doğruda a > 0, azalan doğruda a < 0’dır.`,`Gerçek hayat: taksi ücreti = açılış + km başı ücret · km; bu bir doğrusal fonksiyondur (b = açılış ücreti, a = km başı ücret).`],keyTerms:[{term:`Fonksiyon`,def:`Her girdiye tek çıktı veren kural.`},{term:`Eğim`,def:`x 1 arttığında f(x)’in değişim miktarı.`},{term:`Tanım kümesi`,def:`Fonksiyona girebilecek değerler.`}],worked:[{q:`f(x) = 3x − 4 için f(x) = 11 ise x kaçtır?`,steps:[`3x − 4 = 11`,`3x = 15`,`x = 5`]},{q:`Taksi: açılış 30 TL, km başı 12 TL. 8 km yol kaç TL?`,steps:[`f(x) = 12x + 30`,`f(8) = 96 + 30 = 126 TL`]}],reference:R,questions:[br(1,1,`f(x) = 5x − 2 ise f(3) kaçtır?`,[`13`,`15`,`17`,`11`],0,`f(3) = 5 · 3 − 2 = 13.`),br(2,2,`f(x) = 2x + 7 ve f(a) = 19 ise a kaçtır?`,[`5`,`6`,`13`,`45`],1,`2a + 7 = 19 → 2a = 12 → a = 6.`),br(3,2,`f(x) = −3x + 6 fonksiyonunun grafiği y eksenini hangi noktada keser?`,[`(0, −3)`,`(0, 6)`,`(2, 0)`,`(6, 0)`],1,`x = 0 için f(0) = 6 → (0, 6).`),br(4,2,`Aşağıdaki eşlemelerden hangisi bir fonksiyon DEĞİLDİR?`,[`Her öğrenciyi doğum gününe eşlemek`,`Her sayıyı karesine eşlemek`,`Bir sayıyı hem 2’ye hem 5’e eşlemek`,`Her ürünü fiyatına eşlemek`],2,`Bir girdi iki farklı çıktıya eşlenirse fonksiyon olmaz.`),br(5,3,`Bir telefon faturası aylık 80 TL sabit ücret ve dakika başı 2 TL’dir. Fatura 150 TL geldiyse kaç dakika konuşulmuştur?`,[`35`,`75`,`40`,`115`],0,`2x + 80 = 150 → 2x = 70 → x = 35 dakika.`)]}),F({id:`m9-ucgen`,subject:`mat`,grade:9,unit:`Geometrik Şekiller`,title:`Üçgende açılar ve kenar bağıntıları`,goal:`Üçgenin iç ve dış açı özelliklerini kullanmak; üçgen eşitsizliğiyle kenar uzunluklarının alabileceği değerleri bulmak.`,objectives:[`İç açılar toplamını kullanır.`,`Dış açının, kendisine komşu olmayan iki iç açının toplamına eşit olduğunu kullanır.`,`Üçgen eşitsizliğini uygular.`],prereq:[`m9-geometri`,`m8-ucgen`],minutes:40,difficulty:2,body:[`Üçgenin iç açılarının toplamı 180°, dış açılarının toplamı 360°’dir.`,`Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir. A = 50°, B = 60° ise C köşesindeki dış açı 110°’dir.`,`Üçgen eşitsizliği: bir kenar, diğer iki kenarın farkından büyük, toplamından küçüktür: |b − c| < a < b + c.`,`Büyük açı karşısında büyük kenar bulunur. Açılar A > B > C ise kenarlar a > b > c.`,`İkizkenar üçgende taban açıları eşittir; eşkenar üçgende her açı 60°’dir.`],keyTerms:[{term:`Dış açı`,def:`Bir iç açının bütünleri olan açı.`},{term:`Üçgen eşitsizliği`,def:`|b − c| < a < b + c`}],worked:[{q:`Kenarları 5 cm ve 9 cm olan üçgenin üçüncü kenarı kaç farklı tam sayı olabilir?`,steps:[`9 − 5 < a < 9 + 5 → 4 < a < 14`,`a = 5, 6, …, 13 → 9 değer.`]},{q:`İkizkenar üçgende tepe açısı 40° ise taban açıları?`,steps:[`180 − 40 = 140`,`140 ÷ 2 = 70° (her biri)`]}],reference:R,questions:[xr(1,1,`Bir üçgenin iki iç açısı 65° ve 45° ise üçüncü açı kaç derecedir?`,[`70°`,`80°`,`110°`,`60°`],0,`180 − (65 + 45) = 70°.`),xr(2,2,`ABC üçgeninde A = 55°, B = 75° ise C köşesindeki dış açı kaç derecedir?`,[`50°`,`130°`,`105°`,`125°`],1,`Dış açı, komşu olmayan iki iç açının toplamıdır: 55 + 75 = 130°.`),xr(3,2,`Kenarları 4 cm ve 7 cm olan bir üçgenin üçüncü kenarı aşağıdakilerden hangisi olabilir?`,[`3 cm`,`11 cm`,`8 cm`,`12 cm`],2,`7 − 4 < a < 7 + 4 → 3 < a < 11; yalnızca 8 cm uygundur.`),xr(4,2,`İkizkenar bir üçgenin taban açılarından biri 50° ise tepe açısı kaç derecedir?`,[`50°`,`80°`,`100°`,`130°`],1,`Taban açıları eşit: 50 + 50 = 100 → tepe açısı 180 − 100 = 80°.`),xr(5,3,`ABC üçgeninde A = 80°, B = 40° ise en uzun kenar hangisidir?`,[`AB`,`BC`,`AC`,`Hepsi eşit`],1,`C = 180 − 120 = 60°. En büyük açı A (80°) olduğundan onun karşısındaki BC en uzun kenardır.`)]}),F({id:`m9-istatistik`,subject:`mat`,grade:9,unit:`İstatistik`,title:`Veri, merkezî eğilim ve yayılım ölçüleri`,goal:`Bir veri grubunun aritmetik ortalamasını, ortancasını, tepe değerini ve açıklığını bulup yorumlamak.`,objectives:[`Aritmetik ortalama, ortanca ve tepe değeri bulur.`,`Açıklığı hesaplar.`,`Uç değerin ortalamaya etkisini yorumlar.`],prereq:[`m8-veri`],minutes:35,difficulty:2,body:[`Aritmetik ortalama = verilerin toplamı ÷ veri sayısı.`,`Ortanca (medyan): veriler küçükten büyüğe sıralanır; tek sayıda veride ortadaki, çift sayıda veride ortadaki iki verinin ortalamasıdır.`,`Tepe değer (mod): en çok tekrar eden veridir. Açıklık = en büyük veri − en küçük veri.`,`Uç değer (diğerlerinden çok farklı bir veri) ortalamayı çok etkiler, ortancayı az etkiler. Bu yüzden maaş gibi verilerde ortanca daha iyi bir temsilcidir.`,`İstatistiksel araştırma süreci: soru oluştur → veri topla → veriyi düzenle (tablo, grafik) → analiz et → sonucu yorumla.`],keyTerms:[{term:`Ortanca`,def:`Sıralı verinin ortası.`},{term:`Açıklık`,def:`En büyük − en küçük veri.`},{term:`Uç değer`,def:`Diğer verilerden çok farklı veri.`}],worked:[{q:`4, 9, 2, 7, 3 verisinin ortancası ve açıklığı?`,steps:[`Sırala: 2, 3, 4, 7, 9`,`Ortanca: 4`,`Açıklık: 9 − 2 = 7`]},{q:`5 sınavın ortalaması 70. Altıncı sınavdan kaç alınırsa ortalama 72 olur?`,steps:[`İlk toplam: 350`,`Yeni toplam: 6 · 72 = 432`,`432 − 350 = 82`]}],reference:R,questions:[Sr(1,1,`6, 8, 10, 12, 14 verisinin aritmetik ortalaması kaçtır?`,[`8`,`10`,`12`,`50`],1,`Toplam 50, veri sayısı 5 → 50 ÷ 5 = 10.`),Sr(2,2,`3, 7, 1, 9, 5, 11 verisinin ortancası kaçtır?`,[`5`,`6`,`7`,`9`],1,`Sırala: 1, 3, 5, 7, 9, 11 → ortadaki iki veri 5 ve 7 → (5 + 7) ÷ 2 = 6.`),Sr(3,1,`4, 6, 6, 8, 6, 9 verisinin tepe değeri kaçtır?`,[`4`,`6`,`8`,`9`],1,`6 en çok (3 kez) tekrar ediyor.`),Sr(4,2,`12, 25, 18, 7, 30 verisinin açıklığı kaçtır?`,[`18`,`23`,`30`,`13`],1,`30 − 7 = 23.`),Sr(5,3,`Bir veri grubuna diğerlerinden çok büyük bir veri eklenirse hangisi en çok değişir?`,[`Ortanca`,`Tepe değer`,`Aritmetik ortalama`,`Hiçbiri değişmez`],2,`Uç değer toplamı çok artırır; ortalama en çok etkilenir, ortanca az etkilenir.`)]}),F({id:`m9-olasilik`,subject:`mat`,grade:9,unit:`Veri ve Olasılık`,title:`Sayma yöntemleri ve olasılık`,goal:`Çarpma ve toplama yoluyla saymayı kullanmak; sıralama sayısını bulmak; basit ve tümleyen olayların olasılığını hesaplamak.`,objectives:[`Çarpma yoluyla saymayı uygular.`,`n farklı nesnenin sıralanma sayısını (n!) bulur.`,`Bir olayın ve tümleyeninin olasılığını hesaplar.`],prereq:[`m8-olasilik`],minutes:40,difficulty:2,body:[`Çarpma yoluyla sayma: bir iş m yolla, ikinci iş n yolla yapılabiliyorsa ikisi birlikte m · n yolla yapılır. 3 tişört ve 4 pantolonla 12 farklı kombin.`,`Toplama yoluyla sayma: iki seçenekten yalnızca biri seçilecekse yollar toplanır. 3 otobüs veya 2 trenle gidilecekse 5 yol.`,`Sıralama: n farklı nesne bir sıraya n! = n · (n − 1) · … · 1 biçimde dizilir. 4! = 24.`,`Olasılık = istenen durum sayısı ÷ tüm durum sayısı; değer 0 ile 1 arasındadır. İmkânsız olayın olasılığı 0, kesin olayın olasılığı 1’dir.`,`Tümleyen: bir olayın olmama olasılığı = 1 − olma olasılığı. P(kırmızı değil) = 1 − P(kırmızı).`],keyTerms:[{term:`n!`,def:`n faktöriyel: 1’den n’ye kadar sayıların çarpımı.`},{term:`Tümleyen olay`,def:`Olayın gerçekleşmemesi.`}],worked:[{q:`5 kitap rafa kaç farklı şekilde dizilir?`,steps:[`5! = 5 · 4 · 3 · 2 · 1 = 120`]},{q:`Torbada 3 kırmızı, 5 mavi bilye var. Çekilen bilyenin kırmızı olmama olasılığı?`,steps:[`Toplam 8`,`P(kırmızı) = 3/8`,`P(kırmızı değil) = 1 − 3/8 = 5/8`]}],reference:R,questions:[Cr(1,1,`4 tişört ve 3 şortu olan biri kaç farklı şekilde giyinebilir?`,[`7`,`12`,`9`,`16`],1,`Çarpma yoluyla sayma: 4 · 3 = 12.`),Cr(2,2,`4 farklı kitap rafa yan yana kaç farklı şekilde dizilir?`,[`16`,`12`,`24`,`8`],2,`4! = 4 · 3 · 2 · 1 = 24.`),Cr(3,2,`Bir zar atıldığında üst yüze asal sayı gelme olasılığı kaçtır?`,[`1/6`,`1/3`,`1/2`,`2/3`],2,`Asal sayılar 2, 3, 5 → 3/6 = 1/2.`),Cr(4,2,`Bir torbada 2 kırmızı, 3 sarı, 5 yeşil top var. Çekilen topun yeşil olmama olasılığı kaçtır?`,[`1/2`,`1/5`,`3/10`,`5/10`],0,`Yeşil olmayan 5 top / 10 = 1/2.`),Cr(5,3,`A şehrinden B’ye 3 yol, B’den C’ye 4 yol vardır. A’dan C’ye B’ye uğrayarak gidip aynı yoldan kullanmadan geri dönme kaç farklı şekilde olur?`,[`144`,`72`,`24`,`12`],1,`Gidiş: 3 · 4 = 12. Dönüşte kullanılan yollar seçilemez: C’den B’ye 3, B’den A’ya 2 yol → 6. Toplam 12 · 6 = 72.`)]})],Tr=P(`t9-iletisim`,`tde`),Er=P(`t9-ses`,`tde`),Dr=P(`t9-hikaye`,`tde`),Or=P(`t9-siir`,`tde`),kr=P(`t9-masal`,`tde`),Ar=P(`t9-roman`,`tde`),jr=P(`t9-tiyatro`,`tde`),Mr=P(`t9-biyografi`,`tde`),Nr=[F({id:`t9-iletisim`,subject:`tde`,grade:9,unit:`Giriş: dil, kültür ve iletişim`,title:`İletişim, dil ve kültür; edebiyatın diğer alanlarla ilişkisi`,goal:`İletişimin ögelerini tanımak; dil ile kültür arasındaki bağı ve edebiyatın sanat, tarih, felsefe ile ilişkisini kavramak.`,objectives:[`İletişimin ögelerini (gönderici, alıcı, ileti, kanal, bağlam, kod) eşleştirir.`,`Dil ile kültür ilişkisini örnekle açıklar.`,`Edebî metni öğretici metinden ayırır.`],minutes:35,difficulty:1,body:[`İletişimin ögeleri: gönderici (iletiyi gönderen), alıcı (iletiyi alan), ileti (mesaj), kanal (iletinin aktarıldığı yol: ses, yazı, ekran), bağlam (iletişimin gerçekleştiği ortam ve koşullar), kod (ortak dil veya işaret sistemi), dönüt (alıcının tepkisi).`,`Dil, bir milletin kültürünü taşıyan ve kuşaktan kuşağa aktaran en önemli araçtır. Atasözleri, deyimler ve ninniler kültürün dildeki izleridir.`,`Edebiyat, olay, düşünce, duygu ve hayallerin dil aracılığıyla estetik biçimde anlatılmasıdır. Edebî metinler (şiir, hikâye, roman) sanat amacı taşır, çok anlamlıdır; öğretici metinler (makale, haber, ders kitabı) bilgi verir, tek anlamlıdır.`,`Edebiyat; tarih (dönemin olaylarını yansıtır), psikoloji (karakterlerin iç dünyası), sosyoloji (toplum yapısı), felsefe (düşünce) ve diğer sanatlarla (resim, müzik) ilişkilidir.`,`Metinlerin sınıflandırılması: coşku ve heyecanı dile getiren (şiir), olay çevresinde oluşan (hikâye, roman, masal), göstermeye bağlı (tiyatro), öğretici metinler.`],keyTerms:[{term:`Bağlam`,def:`İletişimin gerçekleştiği ortam, zaman ve koşullar.`},{term:`Kod`,def:`Gönderici ve alıcının ortak dili/işaret sistemi.`},{term:`Dönüt`,def:`Alıcının iletiye verdiği tepki.`}],worked:[{q:`Bir öğretmen derste konu anlatırken iletişimin ögeleri nelerdir?`,steps:[`Gönderici: öğretmen; alıcı: öğrenciler`,`İleti: konu; kanal: ses (ve tahta)`,`Kod: Türkçe; bağlam: sınıf ortamı`]}],reference:R,questions:[Tr(1,1,`İletişimde iletinin aktarıldığı yola ne ad verilir?`,[`Kod`,`Kanal`,`Bağlam`,`Dönüt`],1,`İletinin aktarıldığı yol (ses, yazı, telefon) kanaldır.`),Tr(2,1,`Alıcının iletiye verdiği tepkiye ne denir?`,[`Dönüt`,`Kod`,`Gönderici`,`Kanal`],0,`Alıcının tepkisi dönüttür (geri bildirim).`),Tr(3,2,`Aşağıdakilerden hangisi öğretici bir metindir?`,[`Şiir`,`Roman`,`Makale`,`Hikâye`],2,`Makale bilgi vermek amacıyla yazılır; öğreticidir.`),Tr(4,2,`“Atasözleri ve deyimler kültürün dildeki yansımalarıdır.” cümlesi en çok hangi ilişkiyi vurgular?`,[`Dil ve kültür`,`Edebiyat ve müzik`,`Tarih ve coğrafya`,`Psikoloji ve felsefe`],0,`Atasözü ve deyimler milletin kültürünü dilde taşır.`),Tr(5,2,`Edebî metinlerin öğretici metinlerden temel farkı nedir?`,[`Bilgi vermeleri`,`Sanat amacı taşıyıp çok anlamlı olmaları`,`Kısa olmaları`,`Yalnızca nesirle yazılmaları`],1,`Edebî metinler estetik amaçlıdır ve farklı yorumlara açıktır.`)]}),F({id:`t9-ses`,subject:`tde`,grade:9,unit:`Dil bilgisi: ses bilgisi`,title:`Ses bilgisi: ünlü-ünsüz uyumları ve ses olayları`,goal:`Türkçedeki ünlü ve ünsüz uyumlarını, ses olaylarını (ünsüz benzeşmesi, yumuşaması, ünlü düşmesi, daralması) tanımak.`,objectives:[`Büyük ve küçük ünlü uyumunu denetler.`,`Ünsüz yumuşaması ve benzeşmesini ayırt eder.`,`Ünlü düşmesi, daralması ve kaynaştırmayı örnekte bulur.`],prereq:[`t9-dil`],minutes:40,difficulty:2,body:[`Türkçede 8 ünlü vardır: a, e, ı, i, o, ö, u, ü. Kalın ünlüler: a, ı, o, u; ince ünlüler: e, i, ö, ü.`,`Büyük ünlü uyumu: bir sözcükteki ünlülerin hepsi kalın ya da hepsi ince olmalıdır (kitaplık değil; çocuklar, evler uyar). Kitap, kalem, saat gibi alıntılar uymayabilir.`,`Ünsüz benzeşmesi (sertleşme): sert ünsüzle (f, s, t, k, ç, ş, h, p) biten sözcüğe c, d, g ile başlayan ek gelince bu sesler ç, t, k olur: kitap-da → kitapta, ağaç-cı → ağaççı.`,`Ünsüz yumuşaması: p, ç, t, k ile biten sözcüğe ünlüyle başlayan ek gelince b, c, d, g/ğ olur: kitap-ı → kitabı, ağaç-a → ağaca, kanat-ı → kanadı, ayak-ı → ayağı.`,`Ünlü düşmesi: iki heceli bazı sözcüklere ünlüyle başlayan ek gelince ikinci hecedeki ünlü düşer: ağız-ı → ağzı, burun-u → burnu. Ünlü daralması: a, e ile biten fiillere -yor gelince a/e → ı, i, u, ü olur: başla-yor → başlıyor. Kaynaştırma: ünlüyle biten sözcüğe ünlüyle başlayan ek gelince araya y, ş, s, n girer: kapı-y-a.`],keyTerms:[{term:`Benzeşme`,def:`c, d, g’nin sert ünsüzden sonra ç, t, k olması.`},{term:`Yumuşama`,def:`p, ç, t, k’nin ünlüden önce b, c, d, ğ olması.`},{term:`Ünlü düşmesi`,def:`Ek alınca ikinci hecedeki ünlünün düşmesi.`}],worked:[{q:`“Dolabı” sözcüğündeki ses olayı nedir?`,steps:[`dolap + ı`,`p ünlüden önce b oldu → ünsüz yumuşaması`]}],reference:R,questions:[Er(1,1,`Aşağıdaki sözcüklerden hangisi büyük ünlü uyumuna uyar?`,[`Kitap`,`Kalem`,`Çocuklar`,`Saat`],2,`Çocuklar: o, u, a → hepsi kalın; uyar. Diğerleri alıntıdır ve uymaz.`),Er(2,2,`“Sokakta” sözcüğünde hangi ses olayı vardır?`,[`Ünsüz yumuşaması`,`Ünsüz benzeşmesi`,`Ünlü düşmesi`,`Ünlü daralması`],1,`sokak + da → sokakta: d, sert k’den sonra t olmuş (benzeşme).`),Er(3,2,`“Ağzı” sözcüğünde hangi ses olayı vardır?`,[`Ünlü düşmesi`,`Ünsüz benzeşmesi`,`Kaynaştırma`,`Ünlü daralması`],0,`ağız + ı → ağzı: ikinci hecedeki ı düşmüş.`),Er(4,2,`“Bekliyor” sözcüğünde hangi ses olayı vardır?`,[`Ünlü daralması`,`Ünsüz yumuşaması`,`Ünlü düşmesi`,`Ünsüz benzeşmesi`],0,`bekle + yor → bekliyor: e, i’ye dönüşmüş (daralma).`),Er(5,3,`Aşağıdakilerin hangisinde ünsüz yumuşaması vardır?`,[`Kitapçı`,`Ağacı`,`Kapıya`,`Burnu`],1,`ağaç + ı → ağacı: ç, c olmuş. Kitapçı’da ünsüz benzeşmesi (c → ç), kapıya’da kaynaştırma, burnu’nda ünlü düşmesi vardır.`)]}),F({id:`t9-hikaye`,subject:`tde`,grade:9,unit:`Olay çevresinde oluşan metinler: hikâye`,title:`Hikâye: yapı unsurları ve anlatıcı`,goal:`Hikâyenin yapı unsurlarını (olay örgüsü, kişiler, zaman, mekân, anlatıcı, bakış açısı) belirlemek; olay ve durum hikâyesini ayırt etmek.`,objectives:[`Hikâyenin yapı unsurlarını bulur.`,`Anlatıcı ve bakış açısını belirler.`,`Olay hikâyesi ile durum hikâyesini karşılaştırır.`],minutes:35,difficulty:2,body:[`Hikâye (öykü): yaşanmış ya da yaşanabilir olayları belli bir yer ve zamana bağlı olarak anlatan kısa yazılardır.`,`Yapı unsurları: olay örgüsü (olayların sırası), kişiler (kahramanlar), zaman, mekân, anlatıcı ve bakış açısı, tema (ana duygu/düşünce), çatışma.`,`Bakış açıları: ilahi (hâkim) bakış açısı — anlatıcı her şeyi bilir, kahramanların içinden geçenleri bile; kahraman anlatıcı — 1. tekil kişiyle anlatır ("ben"); gözlemci anlatıcı — yalnızca gördüklerini kamera gibi aktarır.`,`Olay hikâyesi (Maupassant tarzı): serim-düğüm-çözüm bölümleri belirgindir, merak öğesi öndedir. Türk edebiyatında Ömer Seyfettin.`,`Durum hikâyesi (Çehov tarzı): belirgin bir olay örgüsü yoktur, bir an ya da kesit anlatılır, sonu okura bırakılır. Türk edebiyatında Sait Faik Abasıyanık, Memduh Şevket Esendal.`],keyTerms:[{term:`Olay örgüsü`,def:`Olayların neden-sonuç ilişkisi içindeki sırası.`},{term:`İlahi bakış açısı`,def:`Her şeyi bilen anlatıcı.`},{term:`Durum hikâyesi`,def:`Olaydan çok bir anı/kesiti anlatan hikâye.`}],worked:[{q:`“Sabah kalktığımda içimde bir sıkıntı vardı.” cümlesinde anlatıcı türü?`,steps:[`1. tekil kişi (ben) → kahraman anlatıcı.`]}],reference:R,questions:[Dr(1,1,`Olayların neden-sonuç ilişkisi içindeki sıralanışına ne ad verilir?`,[`Tema`,`Olay örgüsü`,`Mekân`,`Üslup`],1,`Olayların sırası olay örgüsüdür.`),Dr(2,2,`Kahramanların iç dünyasını da bilen anlatıcının bakış açısı hangisidir?`,[`Gözlemci`,`Kahraman`,`İlahi (hâkim)`,`Sınırlı`],2,`Her şeyi bilen anlatıcı ilahi (hâkim) bakış açısına sahiptir.`),Dr(3,2,`Aşağıdakilerden hangisi durum hikâyesinin özelliğidir?`,[`Serim-düğüm-çözüm belirgindir`,`Merak öğesi ön plandadır`,`Bir an ya da kesit anlatılır, son okura bırakılır`,`Olaylar mutlaka mutlu sonla biter`],2,`Durum hikâyesinde belirgin olay örgüsü yoktur; kesit anlatılır.`),Dr(4,2,`Türk edebiyatında olay hikâyesinin önemli temsilcisi kimdir?`,[`Sait Faik Abasıyanık`,`Ömer Seyfettin`,`Memduh Şevket Esendal`,`Orhan Veli`],1,`Ömer Seyfettin olay (Maupassant tarzı) hikâyesinin temsilcisidir.`),Dr(5,3,`“Kapıyı açtım, karşımda yıllardır görmediğim arkadaşım duruyordu.” cümlesinde hangi anlatıcı kullanılmıştır?`,[`Kahraman anlatıcı`,`Gözlemci anlatıcı`,`İlahi anlatıcı`,`Anlatıcı yoktur`],0,`“Açtım” 1. tekil kişidir; anlatıcı olayın kahramanıdır.`)]}),F({id:`t9-siir`,subject:`tde`,grade:9,unit:`Coşku ve heyecanı dile getiren metinler: şiir`,title:`Şiir: ahenk unsurları, nazım birimi ve ölçü`,goal:`Şiirde nazım birimi, ölçü (hece, aruz, serbest), kafiye ve redif ile söz sanatlarını tanımak.`,objectives:[`Nazım birimini belirler.`,`Hece ölçüsünü sayar.`,`Kafiye ile redifi ayırt eder.`,`Benzetme, kişileştirme ve abartmayı bulur.`],minutes:40,difficulty:2,body:[`Nazım birimi: şiirin bölümlerinden her biridir. İki dizelik birim beyit, dört dizelik birim dörtlüktür; serbest şiirde bent kullanılır.`,`Ölçü (vezin): Hece ölçüsünde dizelerdeki hece sayısı eşittir (ör. 7’li, 8’li, 11’li). Aruz ölçüsü hecelerin açık-kapalı oluşuna dayanır (Divan şiiri). Serbest şiirde ölçü yoktur.`,`Kafiye (uyak): dize sonlarındaki anlamları ve görevleri farklı ses benzerliğidir. Redif: dize sonlarında aynı görevde tekrar eden ek, sözcük veya söz öbekleridir. Önce redif ayrılır, ondan önceki benzerlik kafiyedir.`,`Kafiye türleri: yarım kafiye (tek ses benzerliği), tam kafiye (iki ses benzerliği), zengin kafiye (üç ve daha fazla ses benzerliği), cinaslı kafiye (yazılışları aynı, anlamları farklı sözcükler).`,`Söz sanatları: benzetme (teşbih: "Aslan gibi yiğit"), kişileştirme (teşhis: "Rüzgâr ağladı"), abartma (mübalağa: "Bir ah çeksem dağı taşı eritir"), konuşturma (intak).`],keyTerms:[{term:`Dörtlük`,def:`Dört dizeden oluşan nazım birimi.`},{term:`Redif`,def:`Dize sonunda aynı görevde tekrarlanan ek/sözcük.`},{term:`Hece ölçüsü`,def:`Dizelerdeki hece sayısının eşitliği.`}],worked:[{q:`“Gönlümü sen aldın / Beni yalnız saldın” dizelerinde redif ve kafiye nedir?`,steps:[`Sondaki “-dın” ekleri aynı görevde (geçmiş zaman, 2. tekil kişi) → redif.`,`Redif öncesi “al / sal” sözcüklerindeki “-al” benzerliği (iki ses) → tam kafiye.`]}],reference:R,questions:[Or(1,1,`Dört dizeden oluşan nazım birimine ne ad verilir?`,[`Beyit`,`Dörtlük`,`Bent`,`Mısra`],1,`Dört dizelik nazım birimi dörtlüktür; iki dizelik birim beyittir.`),Or(2,2,`“Dağlar dağlar kurban olam” dizesi kaç heceli hece ölçüsüyle yazılmıştır?`,[`7`,`8`,`9`,`11`],1,`Dağ-lar-dağ-lar-kur-ban-o-lam → 8 hece.`),Or(3,2,`“Rüzgâr pencereme vurup ağladı.” dizesinde hangi söz sanatı vardır?`,[`Benzetme`,`Kişileştirme`,`Abartma`,`Tezat`],1,`Rüzgâra ağlama (insana özgü davranış) verilmiş: kişileştirme.`),Or(4,2,`Dize sonlarında aynı görevde tekrarlanan ek ya da sözcüklere ne denir?`,[`Kafiye`,`Redif`,`Ölçü`,`Durak`],1,`Aynı görevde tekrarlananlar rediftir; anlamı/görevi farklı ses benzerliği kafiyedir.`),Or(5,3,`Hangi ölçü türü Divan şiirinde kullanılmış ve hecelerin açık-kapalı oluşuna dayanır?`,[`Hece ölçüsü`,`Aruz ölçüsü`,`Serbest ölçü`,`Ses ölçüsü`],1,`Aruz ölçüsü hecelerin uzunluk-kısalığına (açık-kapalı) dayanır.`)]}),F({id:`t9-masal`,subject:`tde`,grade:9,unit:`Olay çevresinde oluşan metinler: masal ve fabl`,title:`Masal ve fabl`,goal:`Masal ve fablın özelliklerini, kalıp ifadeleri ve aralarındaki farkları kavramak.`,objectives:[`Masalın yapısını (döşeme, serim, düğüm, çözüm, dilek) açıklar.`,`Fablın özelliklerini belirtir.`,`Masal ile fablı karşılaştırır.`],minutes:30,difficulty:1,body:[`Masal: olağanüstü olay ve kahramanların yer aldığı, zaman ve mekânı belirsiz, sözlü gelenekten gelen anlatılardır. Anonimdir, kalıp ifadelerle başlar ve biter.`,`Masalın yapısı: döşeme (tekerleme: "Evvel zaman içinde, kalbur saman içinde…"), serim, düğüm, çözüm ve dilek bölümü ("Onlar ermiş muradına…").`,`Masalda iyiler ödüllendirilir, kötüler cezalandırılır; üç sayısı, dev, peri, cadı gibi ögeler sık görülür. Keloğlan masalları Türk masallarının tanınmış örnekleridir.`,`Fabl: kahramanları genellikle hayvanlar olan, sonunda ders (kıssadan hisse) veren kısa anlatılardır. Manzum (şiir) ya da düzyazı olabilir.`,`Fablın ünlü temsilcileri: Ezop (Antik Yunan), La Fontaine (Fransız), Beydaba’nın Kelile ve Dimne’si (Hint). Türk edebiyatında Şinasi ve Nabizade Nazım fabl çevirileri yapmıştır.`],keyTerms:[{term:`Döşeme`,def:`Masalın başındaki tekerleme.`},{term:`Fabl`,def:`Hayvanların kahraman olduğu ders veren anlatı.`},{term:`Anonim`,def:`Söyleyeni belli olmayan.`}],worked:[{q:`Masalla fabl arasındaki temel fark nedir?`,steps:[`Masalda olağanüstülük öndedir, kahraman insan veya varlık olabilir.`,`Fablda kahramanlar hayvanlardır ve mutlaka bir ders verilir.`]}],reference:R,questions:[kr(1,1,`“Evvel zaman içinde, kalbur saman içinde…” ifadesi masalın hangi bölümüdür?`,[`Dilek`,`Döşeme`,`Düğüm`,`Çözüm`],1,`Masalın başındaki tekerleme döşemedir.`),kr(2,1,`Kahramanları genellikle hayvanlar olan ve sonunda ders veren tür hangisidir?`,[`Masal`,`Fabl`,`Destan`,`Efsane`],1,`Fabl hayvan kahramanlı, ders veren anlatıdır.`),kr(3,2,`Aşağıdakilerden hangisi masalın özelliklerinden biri DEĞİLDİR?`,[`Zaman ve mekân belirsizdir`,`Olağanüstü ögeler bulunur`,`Yazarı bellidir`,`Kalıp ifadeler kullanılır`],2,`Masallar anonimdir; yazarı belli değildir.`),kr(4,2,`Fabl türünün Fransız edebiyatındaki ünlü temsilcisi kimdir?`,[`Ezop`,`La Fontaine`,`Beydaba`,`Moliere`],1,`La Fontaine Fransız fabl yazarıdır; Ezop Antik Yunan’dandır.`),kr(5,2,`“Onlar ermiş muradına, biz çıkalım kerevetine.” ifadesi masalın hangi bölümüdür?`,[`Döşeme`,`Serim`,`Dilek`,`Düğüm`],2,`Masalın sonundaki kalıp ifade dilek bölümüdür.`)]}),F({id:`t9-roman`,subject:`tde`,grade:9,unit:`Olay çevresinde oluşan metinler: roman`,title:`Roman: türleri ve yapı unsurları`,goal:`Romanı hikâyeden ayıran özellikleri, roman türlerini ve Türk edebiyatındaki ilk örnekleri tanımak.`,objectives:[`Roman ile hikâyeyi karşılaştırır.`,`Roman türlerini (tarihî, macera, psikolojik, bilimkurgu) örnekle eşleştirir.`,`İlk Türk romanlarını sayar.`],prereq:[`t9-hikaye`],minutes:35,difficulty:2,body:[`Roman: yaşanmış ya da yaşanabilir olayları geniş bir zaman ve mekân içinde, çok sayıda kişiyle ayrıntılı biçimde anlatan uzun yazılardır.`,`Roman ile hikâye farkı: romanda olaylar ve kişiler çok, zaman ve mekân geniş, betimlemeler ayrıntılıdır; hikâyede tek olay ya da kesit, az kişi, dar zaman vardır.`,`Roman türleri: tarihî (geçmiş olayları konu alır), macera (heyecan ve serüven), psikolojik (kahramanın iç dünyası), sosyal (toplum sorunları), bilimkurgu (bilimsel gelişmelere dayalı hayal), polisiye.`,`Türk edebiyatında ilk roman çevirisi Yusuf Kâmil Paşa’nın Telemak’ıdır (1862). İlk yerli roman Şemsettin Sami’nin Taaşşuk-ı Talat ve Fitnat’ıdır (1872). İlk edebî roman Namık Kemal’in İntibah’ı, ilk realist roman Recaizade Mahmut Ekrem’in Araba Sevdası kabul edilir.`,`Romanda yapı unsurları hikâyedekilerle aynıdır: olay örgüsü, kişiler, zaman, mekân, anlatıcı, bakış açısı, tema.`],keyTerms:[{term:`Psikolojik roman`,def:`Kahramanın iç dünyasını anlatan roman.`},{term:`Tarihî roman`,def:`Geçmiş olayları kurguyla anlatan roman.`}],worked:[{q:`İlk yerli Türk romanı hangisidir?`,steps:[`Şemsettin Sami — Taaşşuk-ı Talat ve Fitnat (1872).`]}],reference:R,questions:[Ar(1,1,`Romanı hikâyeden ayıran özellik aşağıdakilerden hangisidir?`,[`Olayların hayal ürünü olması`,`Geniş zaman ve mekânda çok sayıda kişi ve olayın anlatılması`,`Anlatıcının bulunması`,`Düzyazıyla yazılması`],1,`Romanda olay, kişi, zaman ve mekân hikâyeye göre çok daha geniştir.`),Ar(2,2,`İlk yerli Türk romanı hangisidir?`,[`İntibah`,`Araba Sevdası`,`Taaşşuk-ı Talat ve Fitnat`,`Telemak`],2,`Şemsettin Sami’nin Taaşşuk-ı Talat ve Fitnat’ı (1872) ilk yerli romandır.`),Ar(3,2,`Bilimsel gelişmelere dayanarak gelecekte olabilecekleri hayal eden roman türü hangisidir?`,[`Tarihî`,`Bilimkurgu`,`Psikolojik`,`Sosyal`],1,`Bilimkurgu romanları bilimsel temelli hayallere dayanır.`),Ar(4,2,`Türk edebiyatına çevrilen ilk roman hangisidir?`,[`Telemak`,`Sefiller`,`Robinson`,`Don Kişot`],0,`Yusuf Kâmil Paşa’nın Telemak çevirisi (1862) ilk roman çevirisidir.`),Ar(5,3,`Kahramanın duygu ve düşüncelerine, iç çatışmalarına odaklanan roman türü hangisidir?`,[`Macera`,`Polisiye`,`Psikolojik`,`Tarihî`],2,`Psikolojik romanlar kahramanın iç dünyasını anlatır.`)]}),F({id:`t9-tiyatro`,subject:`tde`,grade:9,unit:`Göstermeye bağlı metinler: tiyatro`,title:`Tiyatro: geleneksel Türk tiyatrosu ve Batılı tiyatro`,goal:`Tiyatronun temel özelliklerini, trajedi-komedi-dram ayrımını ve geleneksel Türk tiyatrosunu (Karagöz, orta oyunu, meddah) tanımak.`,objectives:[`Tiyatro metninin özelliklerini belirtir.`,`Trajedi, komedi ve dramı ayırt eder.`,`Geleneksel Türk tiyatrosu türlerini tanır.`],minutes:30,difficulty:1,body:[`Tiyatro: olayların sahnede oyuncular tarafından canlandırılmak üzere diyaloglarla yazıldığı metinlerdir. Metinde parantez içinde verilen açıklamalar (yönerge) oyuncunun hareketini ve dekoru anlatır.`,`Batı tiyatrosunda türler: trajedi (acıklı olaylar, soylu kahramanlar, kötü son), komedi (güldürü, insanların ve toplumun gülünç yönleri), dram (trajedi ile komedinin karışımı, gerçek hayata yakın).`,`Geleneksel Türk tiyatrosu: Karagöz (gölge oyunu; Karagöz ile Hacivat), orta oyunu (meydanda oynanır; Kavuklu ile Pişekâr), meddah (tek kişilik anlatı; elinde mendil ve sopa).`,`Geleneksel tiyatroda yazılı metin yoktur, doğaçlamaya dayanır; amaç güldürürken eğitmektir. Karagöz oyunu bölümleri: mukaddime (giriş), muhavere (söyleşme), fasıl (asıl oyun), bitiş.`,`Türk edebiyatında Batılı anlamda ilk tiyatro eseri Şinasi’nin Şair Evlenmesi’dir (1860).`],keyTerms:[{term:`Diyalog`,def:`Kişilerin karşılıklı konuşması.`},{term:`Meddah`,def:`Tek başına hikâye anlatan halk sanatçısı.`},{term:`Trajedi`,def:`Acıklı olayları anlatan oyun türü.`}],worked:[{q:`Karagöz oyunu neden “gölge oyunu” diye anılır?`,steps:[`Deriden yapılan tasvirler perdenin arkasından ışıkla yansıtılır.`,`İzleyici tasvirlerin gölgesini görür.`]}],reference:R,questions:[jr(1,1,`Türk edebiyatında Batılı anlamda ilk tiyatro eseri hangisidir?`,[`Vatan yahut Silistre`,`Şair Evlenmesi`,`Zavallı Çocuk`,`İntibah`],1,`Şinasi’nin Şair Evlenmesi (1860) ilk tiyatro eserimizdir.`),jr(2,1,`Karagöz oyununun iki temel kahramanı kimlerdir?`,[`Kavuklu ve Pişekâr`,`Karagöz ve Hacivat`,`Nasreddin Hoca ve Timur`,`Keloğlan ve Dev`],1,`Karagöz oyunu Karagöz ve Hacivat arasında geçer; Kavuklu ve Pişekâr orta oyunundadır.`),jr(3,2,`Acıklı olayların anlatıldığı, kahramanların genellikle soylu olduğu tiyatro türü hangisidir?`,[`Komedi`,`Dram`,`Trajedi`,`Vodvil`],2,`Trajedide acıklı olaylar ve soylu kahramanlar vardır.`),jr(4,2,`Tek başına, elinde mendil ve sopayla hikâye anlatan halk sanatçısına ne ad verilir?`,[`Meddah`,`Aşık`,`Ozan`,`Hayalî`],0,`Meddah tek kişilik anlatıcıdır.`),jr(5,2,`Tiyatro metinlerinde parantez içinde verilen açıklamaların görevi nedir?`,[`Konuyu özetlemek`,`Oyuncunun hareketlerini ve sahne düzenini belirtmek`,`Yazarı tanıtmak`,`Seyirciye soru sormak`],1,`Yönergeler oyunculara ve yönetmene sahneyle ilgili bilgi verir.`)]}),F({id:`t9-biyografi`,subject:`tde`,grade:9,unit:`Öğretici metinler: biyografi ve otobiyografi`,title:`Biyografi, otobiyografi, mektup ve günlük`,goal:`Biyografi ile otobiyografiyi, mektup, e-posta ve günlük (blog) türlerinin özelliklerini ayırt etmek.`,objectives:[`Biyografi ile otobiyografiyi ayırt eder.`,`Mektup türlerini (özel, resmî, edebî) tanır.`,`Günlük ile anı arasındaki farkı açıklar.`],minutes:30,difficulty:1,body:[`Biyografi (yaşam öyküsü): bir kişinin hayatının başka biri tarafından belgelere dayanarak anlatılmasıdır; 3. kişi ağzıyla yazılır.`,`Otobiyografi (öz yaşam öyküsü): kişinin kendi hayatını kendisinin anlatmasıdır; 1. kişi ağzıyla yazılır.`,`Mektup: bir kişinin başka birine yazdığı yazılardır. Özel (aile, arkadaş), resmî (kurumlara; dilekçe biçimi), iş, edebî (sanatçıların sanat ve düşüncelerini paylaştığı) mektuplar vardır. E-posta mektubun elektronik biçimidir.`,`Günlük (günce): kişinin yaşadıklarını, duygu ve düşüncelerini günü gününe, tarih atarak yazdığı yazılardır. Blog, internette tutulan günlüktür.`,`Günlük ile anı farkı: günlük o günün olaylarını hemen yazar; anı (hatıra) yıllar sonra geçmişte yaşananları hatırlayarak yazılır.`],keyTerms:[{term:`Biyografi`,def:`Başkasının hayatını anlatan yazı.`},{term:`Otobiyografi`,def:`Kişinin kendi hayatını anlattığı yazı.`},{term:`Günlük`,def:`Tarih atılarak günü gününe yazılan yazı.`}],worked:[{q:`Bir yazarın hayatını araştıran ve anlatan bir yazı türü?`,steps:[`Başkasının hayatı anlatıldığı için biyografi.`]}],reference:R,questions:[Mr(1,1,`Bir kişinin kendi hayatını anlattığı yazı türü hangisidir?`,[`Biyografi`,`Otobiyografi`,`Makale`,`Deneme`],1,`Kendi hayatını anlatan yazı otobiyografidir.`),Mr(2,1,`Günlüğün temel özelliği aşağıdakilerden hangisidir?`,[`Yıllar sonra yazılması`,`Tarih atılarak günü gününe yazılması`,`Başkasının hayatını anlatması`,`Diyaloglarla yazılması`],1,`Günlük, tarih atılarak o günün olaylarıyla yazılır.`),Mr(3,2,`Günlük ile anı arasındaki temel fark nedir?`,[`Anı yıllar sonra hatırlanarak yazılır`,`Günlük kurgusaldır`,`Anıda tarih yoktur`,`Günlük yalnızca şiirle yazılır`],0,`Anı geçmişte yaşananların sonradan yazılmasıdır; günlük o gün yazılır.`),Mr(4,2,`Bir kuruma bir istekte bulunmak için yazılan mektup türü hangisidir?`,[`Özel mektup`,`Edebî mektup`,`Resmî mektup (dilekçe)`,`Aile mektubu`],2,`Kurumlara yazılan istek mektupları resmî mektup/dilekçedir.`),Mr(5,2,`Biyografi hangi anlatım kişisiyle yazılır?`,[`1. tekil kişi`,`2. tekil kişi`,`3. tekil kişi`,`1. çoğul kişi`],2,`Biyografide başkasının hayatı anlatıldığı için 3. kişi kullanılır.`)]})],Pr={"t9-iletisim":[Tr(6,1,`Telefonla yapılan bir konuşmada kanal nedir?`,[`Konuşan kişi`,`Telefon (ses)`,`Konuşmanın konusu`,`Dinleyen kişi`],1,`İletinin aktarıldığı yol telefon/sestir.`),Tr(7,2,`Gönderici ile alıcının ortak dili bilmemesi iletişimin hangi ögesindeki sorundur?`,[`Kanal`,`Kod`,`Bağlam`,`Dönüt`],1,`Ortak dil/ ks. Don’t talk.).`,`Can I…? ile izin ister, can/can’t ile yetenek bildirir.`],prereq:[`e9-school`],minutes:30,difficulty:1,body:[`Sınıf eşyaları: board (tahta), desk (sıra), notebook (defter), eraser (silgi), ruler (cetvel), schoolbag (okul çantası), projector (projeksiyon).`,`Emir cümleleri fiilin yalın hâliyle başlar: Open your books. Listen carefully. Olumsuz emir: Don’t + fiil: Don’t run in the corridor.`,`İzin isteme: Can I go to the toilet? Can I open the window? Cevap: Yes, you can. / Sorry, you can’t.`,`Yetenek: I can speak English. She can’t swim. Can + özne + fiil? → Can you play the guitar?`,`Sınıf ifadeleri: Could you repeat that, please? (Tekrar eder misiniz?) How do you spell it? (Nasıl yazılır?) What does “…” mean? (… ne demek?)`],keyTerms:[{term:`Imperative`,def:`Emir cümlesi: Open the door.`},{term:`Can`,def:`Yetenek ve izin: -ebilmek.`}],worked:[{q:`Öğretmenden pencereyi açmak için izin isteyin.`,steps:[`Can I + fiil?`,`→ Can I open the window, please?`]}],reference:R,questions:[Fr(1,1,`Which one is a negative imperative?`,[`Open the door.`,`Don’t talk in class.`,`Can I talk?`,`She talks a lot.`],1,`Olumsuz emir “Don’t + fiil” ile kurulur.`),Fr(2,1,`“Can I go to the toilet?” cümlesinde konuşan ne yapıyor?`,[`İzin istiyor`,`Yeteneğini söylüyor`,`Emir veriyor`,`Özür diliyor`],0,`“Can I…?” izin istemektir.`),Fr(3,2,`Choose the correct sentence.`,[`She can swims.`,`She can swim.`,`She cans swim.`,`She can to swim.`],1,`Can’den sonra fiil yalın hâlde gelir.`),Fr(4,2,`“How do you spell your name?” sorusuna uygun cevap hangisidir?`,[`I’m fine, thanks.`,`E-C-R-I-N.`,`It’s nine o’clock.`,`Yes, I can.`],1,`“Spell” harf harf söylemektir.`),Fr(5,2,`“Tahta” kelimesinin İngilizcesi hangisidir?`,[`Desk`,`Board`,`Ruler`,`Eraser`],1,`Board = tahta; desk = sıra.`)]}),F({id:`e9-house`,subject:`ing`,grade:9,unit:`Life in the House`,title:`Life in the House: odalar, eşyalar, there is / there are, yer edatları`,goal:`Evin bölümlerini ve eşyalarını tanıtmak; there is / there are ve yer edatlarıyla bir evi betimlemek.`,objectives:[`Oda ve eşya adlarını kullanır.`,`There is / there are ile var-yok bildirir.`,`in, on, under, next to, between, opposite edatlarını kullanır.`],prereq:[`e9-family`],minutes:30,difficulty:1,body:[`Odalar: living room (oturma odası), bedroom (yatak odası), kitchen (mutfak), bathroom (banyo), balcony (balkon), garden (bahçe), hall (hol).`,`Eşyalar: sofa (kanepe), armchair (koltuk), wardrobe (gardırop), bookshelf (kitaplık), fridge (buzdolabı), cooker/oven (fırın), carpet (halı), curtain (perde).`,`There is + tekil: There is a sofa in the living room. There are + çoğul: There are two bedrooms. Olumsuz: There isn’t / There aren’t. Soru: Is there a garden? Are there any chairs?`,`Yer edatları: in (içinde), on (üstünde), under (altında), next to (yanında), between (arasında), opposite (karşısında), in front of (önünde), behind (arkasında).`,`Ev tanıtma: My house is a flat on the third floor. It has three rooms. My favourite room is my bedroom because…`],keyTerms:[{term:`There is / are`,def:`… var (tekil / çoğul).`},{term:`Between`,def:`İki şeyin arasında.`},{term:`Opposite`,def:`Karşısında.`}],worked:[{q:`“Kanepenin önünde bir halı var.” cümlesini çevirin.`,steps:[`There is + a carpet`,`in front of the sofa`,`→ There is a carpet in front of the sofa.`]}],reference:R,questions:[Ir(1,1,`Choose the correct sentence.`,[`There is two chairs.`,`There are a sofa.`,`There are three bedrooms.`,`There is books.`],2,`Çoğul isimle “there are” kullanılır.`),Ir(2,1,`“Buzdolabı” kelimesinin İngilizcesi hangisidir?`,[`Oven`,`Fridge`,`Wardrobe`,`Sofa`],1,`Fridge = buzdolabı.`),Ir(3,2,`The cat is ___ the table. (masanın altında)`,[`on`,`under`,`between`,`opposite`],1,`Under = altında.`),Ir(4,2,`“Is there a garden?” sorusuna uygun olumsuz cevap hangisidir?`,[`No, there isn’t.`,`No, there aren’t.`,`No, it isn’t.`,`No, I don’t.`],0,`Tekil soruya “No, there isn’t.” cevabı verilir.`),Ir(5,2,`The lamp is ___ the bed and the wardrobe.`,[`between`,`in`,`under`,`on`],0,`İki şeyin arası “between … and …”.`)]}),F({id:`e9-city`,subject:`ing`,grade:9,unit:`Life in My City`,title:`Life in the City: yerler, yol tarifi, karşılaştırma`,goal:`Şehirdeki yerleri tanıtmak, yol tarif etmek ve sıfatların karşılaştırma biçimlerini kullanmak.`,objectives:[`Şehirdeki yerleri adlandırır.`,`Yol tarifi ister ve verir.`,`Sıfatların -er/more ve -est/most biçimlerini kullanır.`],prereq:[`e9-house`],minutes:35,difficulty:2,body:[`Yerler: hospital (hastane), museum (müze), library (kütüphane), post office (postane), pharmacy (eczane), bakery (fırın), bus stop (otobüs durağı), square (meydan).`,`Yol sorma: Excuse me, how can I get to the museum? / Where is the nearest pharmacy? Yol tarifi: Go straight. Turn left/right. Take the second turning on the right. It’s on your left. It’s opposite the bank.`,`Karşılaştırma (comparative): kısa sıfat + -er + than: Istanbul is bigger than Bursa. Uzun sıfat: more + sıfat + than: The museum is more interesting than the park.`,`En üstünlük (superlative): the + kısa sıfat + -est: the tallest building; the most + uzun sıfat: the most beautiful city. Düzensiz: good → better → the best; bad → worse → the worst.`,`Şehir ve kırsal: The city is noisier and more crowded than the village. The village is quieter.`],keyTerms:[{term:`Comparative`,def:`Karşılaştırma: bigger than.`},{term:`Superlative`,def:`En üstünlük: the biggest.`},{term:`Turn left`,def:`Sola dön.`}],worked:[{q:`“Kütüphane bankanın karşısında.” cümlesini çevirin.`,steps:[`The library is`,`opposite the bank.`]}],reference:R,questions:[Lr(1,1,`İlaç almak için hangi yere gidersiniz?`,[`Bakery`,`Pharmacy`,`Library`,`Museum`],1,`Pharmacy = eczane.`),Lr(2,2,`Choose the correct sentence.`,[`Ankara is big than Konya.`,`Ankara is bigger than Konya.`,`Ankara is more big than Konya.`,`Ankara is biggest than Konya.`],1,`Kısa sıfat: big → bigger than.`),Lr(3,2,`This is ___ building in our city.`,[`the tallest`,`taller`,`the most tall`,`tall`],0,`En üstünlük: the + tall + est.`),Lr(4,2,`“Go straight and turn right.” ne demektir?`,[`Düz git ve sağa dön.`,`Geri dön ve sola git.`,`Sağa dön ve dur.`,`Düz git ve sola dön.`],0,`Go straight = düz git; turn right = sağa dön.`),Lr(5,3,`Choose the correct form: My village is ___ than the city. (sessiz)`,[`quiet`,`quieter`,`the quietest`,`more quieter`],1,`Karşılaştırma: quiet → quieter than. “More quieter” yanlıştır.`)]}),F({id:`e9-world`,subject:`ing`,grade:9,unit:`Life in the World`,title:`Life in the World: ülkeler, milliyetler, diller, Past Simple (was/were)`,goal:`Ülke, milliyet ve dil adlarını kullanmak; geçmişteki gezileri was/were ve düzenli geçmiş zaman fiilleriyle anlatmak.`,objectives:[`Ülke-milliyet-dil eşleştirir.`,`was / were kullanır.`,`Düzenli fiillerin geçmiş zaman (-ed) biçimini kullanır.`],prereq:[`e9-city`],minutes:35,difficulty:2,body:[`Ülke → milliyet → dil: Turkey (Türkiye) → Turkish; Germany → German; France → French; Spain → Spanish; Italy → Italian; Japan → Japanese; China → Chinese; England → English.`,`Nereli olduğunu sorma: Where are you from? — I’m from Turkey. I’m Turkish. What languages do you speak?`,`was / were (geçmiş zamanda olmak): I/he/she/it was; you/we/they were. I was in London last summer. They were happy. Olumsuz: wasn’t / weren’t. Soru: Were you at home yesterday?`,`Düzenli fiiller -ed alır: visit → visited, travel → travelled, stay → stayed, watch → watched. Zaman ifadeleri: yesterday, last week, two years ago, in 2020.`,`Olumsuz ve soru: didn’t + yalın fiil: I didn’t visit Paris. Did you visit Rome? — Yes, I did. / No, I didn’t.`],keyTerms:[{term:`Nationality`,def:`Milliyet (Turkish, German).`},{term:`was / were`,def:`idi (geçmiş zaman “olmak”).`},{term:`ago`,def:`önce (two days ago).`}],worked:[{q:`“Geçen yaz İzmir’deydik.” cümlesini çevirin.`,steps:[`We → were`,`in İzmir last summer`,`→ We were in İzmir last summer.`]}],reference:R,questions:[Rr(1,1,`People from Japan speak ___.`,[`Japan`,`Japanese`,`Japanish`,`Japanian`],1,`Japonya’nın dili Japanese.`),Rr(2,1,`Choose the correct sentence.`,[`I were in Paris.`,`I was in Paris.`,`I am in Paris yesterday.`,`I be in Paris.`],1,`I ile geçmişte “was”.`),Rr(3,2,`They ___ at the museum last Sunday.`,[`was`,`were`,`is`,`are`],1,`They ile “were”.`),Rr(4,2,`Choose the past form of “travel”.`,[`travelled`,`travels`,`travelling`,`travel`],0,`Düzenli fiil: travel → travelled.`),Rr(5,3,`“Did you visit Germany?” — “No, I ___.”`,[`didn’t`,`wasn’t`,`don’t`,`weren’t`],0,`Did ile sorulan soruya “No, I didn’t.” cevabı verilir.`)]})],Br={"e9-classroom":[Fr(6,1,`“Defter” kelimesinin İngilizcesi hangisidir?`,[`Notebook`,`Ruler`,`Eraser`,`Board`],0,`Notebook = defter.`),Fr(7,2,`“Could you repeat that, please?” ne demektir?`,[`Tekrar eder misiniz, lütfen?`,`Kapıyı açar mısınız?`,`Bu ne demek?`,`Nasıl yazılır?`],0,`Repeat = tekrar etmek.`),Fr(8,2,`Teacher: “___ run in the corridor!”`,[`Don’t`,`Doesn’t`,`Not`,`No`],0,`Olumsuz emir “Don’t”.`),Fr(9,2,`“Can you play chess?” — “No, I ___.”`,[`can’t`,`don’t`,`am not`,`isn’t`],0,`Can sorusuna “can’t” ile cevap verilir.`),Fr(10,1,`Which one gives an instruction?`,[`Listen carefully.`,`I like music.`,`She is a teacher.`,`Can I come in?`],0,`Fiille başlayan cümle emirdir.`),Fr(11,2,`“What does ‘eraser’ mean?” sorusunun Türkçesi hangisidir?`,[`“Eraser” ne demek?`,`“Eraser” nasıl yazılır?`,`“Eraser” nerede?`,`“Eraser” kimin?`],0,`“What does … mean?” = … ne demek?`),Fr(12,3,`Choose the correct question.`,[`Can she speaks French?`,`Can she speak French?`,`Does she can speak French?`,`She can speak French?`],1,`Soru: Can + özne + yalın fiil?`),Fr(13,2,`“Cetvel” kelimesinin İngilizcesi hangisidir?`,[`Ruler`,`Rubber`,`Desk`,`Pencil`],0,`Ruler = cetvel.`)],"e9-house":[Ir(6,1,`“Gardırop” kelimesinin İngilizcesi hangisidir?`,[`Wardrobe`,`Bookshelf`,`Carpet`,`Curtain`],0,`Wardrobe = gardırop.`),Ir(7,2,`There ___ some books on the shelf.`,[`is`,`are`,`am`,`be`],1,`Çoğul “books” ile “there are”.`),Ir(8,2,`The bank is ___ the school. (karşısında)`,[`opposite`,`under`,`in`,`on`],0,`Opposite = karşısında.`),Ir(9,1,`Which room do we usually cook in?`,[`Kitchen`,`Bedroom`,`Bathroom`,`Balcony`],0,`Yemek mutfakta (kitchen) pişirilir.`),Ir(10,2,`“___ there any chairs in the garden?”`,[`Is`,`Are`,`Do`,`Does`],1,`Çoğul soru: Are there any…?`),Ir(11,2,`The car is ___ the house. (arkasında)`,[`behind`,`in front of`,`between`,`on`],0,`Behind = arkasında.`),Ir(12,3,`Choose the correct sentence.`,[`There isn’t any milk in the fridge.`,`There aren’t any milk in the fridge.`,`There isn’t some milk in the fridge.`,`There not milk in the fridge.`],0,`Sayılamayan isim (milk) tekil gibi kullanılır: there isn’t any.`),Ir(13,1,`“Perde” kelimesinin İngilizcesi hangisidir?`,[`Curtain`,`Carpet`,`Cushion`,`Ceiling`],0,`Curtain = perde.`)],"e9-city":[Lr(6,1,`Where can you borrow books?`,[`Library`,`Bakery`,`Pharmacy`,`Hospital`],0,`Kitaplar kütüphaneden (library) ödünç alınır.`),Lr(7,2,`Good → better → ___`,[`the goodest`,`the best`,`the better`,`the most good`],1,`Düzensiz sıfat: good, better, the best.`),Lr(8,2,`The city is ___ than the village.`,[`more crowded`,`crowdeder`,`most crowded`,`crowded`],0,`Uzun sıfat: more crowded than.`),Lr(9,2,`“Excuse me, how can I get to the post office?” cümlesinde konuşan ne yapıyor?`,[`Yol soruyor`,`Yol tarif ediyor`,`Teşekkür ediyor`,`Özür diliyor`],0,`“How can I get to…?” yol sorma kalıbıdır.`),Lr(10,1,`“Turn left” ne demektir?`,[`Sola dön`,`Sağa dön`,`Düz git`,`Geri dön`],0,`Left = sol.`),Lr(11,3,`This is ___ museum I have ever visited.`,[`the most interesting`,`more interesting`,`interestinger`,`the interestingest`],0,`Uzun sıfat en üstünlük: the most interesting.`),Lr(12,2,`Bad → worse → ___`,[`the baddest`,`the worst`,`the worse`,`the most bad`],1,`Düzensiz: bad, worse, the worst.`),Lr(13,2,`“Otobüs durağı” İngilizcede nasıl söylenir?`,[`Bus stop`,`Bus station square`,`Bus road`,`Stop bus`],0,`Bus stop = otobüs durağı.`)],"e9-world":[Rr(6,1,`People from Spain are ___.`,[`Spain`,`Spanish`,`Spanian`,`Spainese`],1,`İspanya → Spanish.`),Rr(7,2,`She ___ in Rome two years ago.`,[`were`,`was`,`is`,`are`],1,`She ile “was”.`),Rr(8,2,`We ___ Antalya last summer.`,[`visit`,`visited`,`visits`,`visiting`],1,`Last summer → geçmiş zaman: visited.`),Rr(9,1,`“Where are you from?” sorusuna uygun cevap hangisidir?`,[`I’m from Turkey.`,`I’m fifteen.`,`I’m fine.`,`I’m a student.`],0,`Nereli olduğunu sorar.`),Rr(10,2,`Choose the correct negative.`,[`I didn’t watched TV.`,`I didn’t watch TV.`,`I not watched TV.`,`I wasn’t watch TV.`],1,`Didn’t + yalın fiil.`),Rr(11,2,`___ you at home yesterday?`,[`Was`,`Were`,`Did`,`Are`],1,`You ile “Were”.`),Rr(12,3,`Which sentence is in the past?`,[`They stay at a hotel.`,`They stayed at a hotel last week.`,`They are staying at a hotel.`,`They will stay at a hotel.`],1,`“Stayed” ve “last week” geçmiş zamandır.`),Rr(13,1,`People in Germany speak ___.`,[`German`,`Germany`,`Germanish`,`Dutch`],0,`Almanya → German.`)]},Vr=P(`f9-akiskan`,`fiz`),Hr=P(`f9-isi`,`fiz`),Ur=P(`k9-kimya`,`kim`),Wr=P(`k9-hal`,`kim`),Gr=P(`b9-molekul`,`biy`),Kr=P(`b9-zar`,`biy`),qr=P(`b9-siniflandirma`,`biy`),Jr=[F({id:`f9-akiskan`,subject:`fiz`,grade:9,unit:`Akışkanlar`,title:`Akışkanlar: basınç ve kaldırma kuvveti`,goal:`Katı, sıvı ve gaz basıncını; kaldırma kuvvetini ve cisimlerin yüzme-batma koşullarını kavramak.`,objectives:[`Katı basıncını P = F / A ile hesaplar.`,`Sıvı basıncını P = h · d · g ile hesaplar.`,`Kaldırma kuvvetini Fk = V · d · g ile bulur ve yüzme-batmayı yorumlar.`],prereq:[`f8-basinc`],minutes:40,difficulty:2,body:[`Katı basıncı: P = F / A (F: dik kuvvet/ağırlık, A: yüzey alanı). Birimi pascal (Pa = N/m²). Yüzey küçülürse basınç artar (bıçağın keskin tarafı).`,`Sıvı basıncı: P = h · d · g (h: derinlik, d: sıvının özkütlesi, g ≈ 10 N/kg). Kabın şekline ve sıvı miktarına bağlı değildir; yalnızca derinlik ve sıvı cinsine bağlıdır.`,`Açık hava basıncı: Atmosferin uyguladığı basınçtır; deniz seviyesinde yaklaşık 1 atm (≈ 101 325 Pa). Yükseklere çıkıldıkça azalır. Torricelli deneyiyle ölçülmüştür (76 cm-Hg).`,`Kaldırma kuvveti (Arşimet): Sıvıya batan cisme, yer değiştirdiği sıvının ağırlığı kadar yukarı yönlü kuvvet etki eder: Fk = V(batan) · d(sıvı) · g.`,`Yüzme-batma: cismin özkütlesi sıvınınkinden küçükse yüzer, eşitse askıda kalır, büyükse batar. Gemiler içleri boş olduğu için ortalama özkütleleri sudan küçüktür.`],keyTerms:[{term:`Pascal`,def:`Basınç birimi: N/m².`},{term:`Kaldırma kuvveti`,def:`Sıvının batan cisme uyguladığı yukarı kuvvet.`},{term:`Özkütle`,def:`Birim hacmin kütlesi (d = m / V).`}],worked:[{q:`Özkütlesi 1000 kg/m³ olan suyun 3 m derinliğindeki basıncı? (g = 10)`,steps:[`P = h · d · g`,`= 3 · 1000 · 10 = 30 000 Pa`]},{q:`0,002 m³ hacimli cisim suya tamamen batıyor. Kaldırma kuvveti? (d = 1000 kg/m³, g = 10)`,steps:[`Fk = V · d · g = 0,002 · 1000 · 10 = 20 N`]}],reference:R,questions:[Vr(1,1,`Basıncın SI birimi aşağıdakilerden hangisidir?`,[`Newton`,`Pascal`,`Joule`,`Watt`],1,`Basınç birimi pascaldır (N/m²).`),Vr(2,2,`600 N ağırlığındaki bir kutu 2 m² yüzeye konuyor. Yere uyguladığı basınç kaç Pa’dır?`,[`1200`,`300`,`600`,`150`],1,`P = F / A = 600 / 2 = 300 Pa.`),Vr(3,2,`Sıvı basıncı aşağıdakilerden hangisine bağlı DEĞİLDİR?`,[`Derinlik`,`Sıvının özkütlesi`,`Kabın şekli`,`Yer çekimi ivmesi`],2,`P = h · d · g; kabın şekli ve sıvı miktarı basıncı etkilemez.`),Vr(4,2,`Özkütlesi sudan küçük olan bir cisim suya bırakılırsa ne olur?`,[`Batar`,`Yüzer`,`Askıda kalır`,`Erir`],1,`Cismin özkütlesi sıvınınkinden küçükse cisim yüzer.`),Vr(5,3,`Yükseklere çıkıldıkça açık hava basıncı nasıl değişir?`,[`Artar`,`Azalır`,`Değişmez`,`Önce artar sonra azalır`],1,`Üstteki hava sütunu kısaldığı için açık hava basıncı azalır.`)]}),F({id:`f9-isi`,subject:`fiz`,grade:9,unit:`Enerji`,title:`Isı, sıcaklık ve öz ısı`,goal:`Isı ile sıcaklık arasındaki farkı, öz ısıyı, Q = m · c · ΔT bağıntısını ve ısının yayılma yollarını kavramak.`,objectives:[`Isı ile sıcaklığı ayırt eder.`,`Q = m · c · ΔT ile ısı hesaplar.`,`İletim, konveksiyon ve ışımayı örnekle eşleştirir.`],prereq:[`f9-enerji`],minutes:35,difficulty:2,body:[`Sıcaklık, maddeyi oluşturan taneciklerin ortalama hareket enerjisinin göstergesidir; termometreyle ölçülür (°C, K). Isı, sıcaklık farkından dolayı aktarılan enerjidir; birimi joule (J) veya kaloridir.`,`Isı her zaman sıcak maddeden soğuk maddeye akar; sıcaklıklar eşitlenince (ısıl denge) akış durur.`,`Öz ısı (c): 1 g maddenin sıcaklığını 1 °C artırmak için gereken ısıdır; maddeler için ayırt edicidir. Suyun öz ısısı yüksektir (1 cal/g·°C), bu yüzden deniz kenarında sıcaklık farkı azdır.`,`Alınan/verilen ısı: Q = m · c · ΔT (m: kütle, c: öz ısı, ΔT: sıcaklık değişimi).`,`Isının yayılma yolları: iletim (katılarda, temasla: kaşığın ısınması), konveksiyon / akım (sıvı ve gazlarda madde akışıyla: kalorifer), ışıma (boşlukta da olur: Güneş’in ısıtması).`],keyTerms:[{term:`Isı`,def:`Sıcaklık farkıyla aktarılan enerji.`},{term:`Öz ısı`,def:`1 g maddeyi 1 °C ısıtan ısı miktarı.`},{term:`Isıl denge`,def:`Sıcaklıkların eşitlendiği durum.`}],worked:[{q:`200 g suyun sıcaklığını 20 °C’den 50 °C’ye çıkarmak için kaç kalori gerekir? (c = 1 cal/g·°C)`,steps:[`ΔT = 30 °C`,`Q = 200 · 1 · 30 = 6000 cal`]}],reference:R,questions:[Hr(1,1,`Sıcaklık hangi aletle ölçülür?`,[`Barometre`,`Termometre`,`Dinamometre`,`Kalorimetre`],1,`Sıcaklık termometreyle ölçülür.`),Hr(2,2,`Isı ile ilgili hangisi doğrudur?`,[`Soğuktan sıcağa akar`,`Sıcaktan soğuğa akar`,`Termometreyle ölçülür`,`Birimi °C’dir`],1,`Isı yüksek sıcaklıktan düşük sıcaklığa akar; birimi joule/kaloridir.`),Hr(3,2,`100 g suyun sıcaklığı 10 °C artırılıyor. Verilen ısı kaç kaloridir? (c = 1 cal/g·°C)`,[`10`,`100`,`1000`,`110`],2,`Q = 100 · 1 · 10 = 1000 cal.`),Hr(4,2,`Güneş’ten Dünya’ya ısının aktarılma yolu hangisidir?`,[`İletim`,`Konveksiyon`,`Işıma`,`Buharlaşma`],2,`Boşlukta yalnızca ışımayla ısı aktarılır.`),Hr(5,3,`Deniz kenarındaki şehirlerde gece-gündüz sıcaklık farkının az olmasının nedeni nedir?`,[`Suyun öz ısısının yüksek olması`,`Rüzgârın olmaması`,`Denizin tuzlu olması`,`Havanın nemsiz olması`],0,`Su geç ısınır, geç soğur (öz ısısı yüksek); bu da sıcaklık farkını azaltır.`)]}),F({id:`k9-kimya`,subject:`kim`,grade:9,unit:`Kimya bilimi`,title:`Kimya bilimi, simyadan kimyaya ve laboratuvar güvenliği`,goal:`Kimyanın uğraş alanlarını, simyadan kimyaya geçişi ve laboratuvar güvenlik işaretlerini tanımak.`,objectives:[`Kimyanın alt dallarını eşleştirir.`,`Simya ile kimya arasındaki farkı açıklar.`,`Güvenlik işaretlerini (yanıcı, aşındırıcı, zehirli) tanır.`],minutes:30,difficulty:1,body:[`Kimya, maddenin yapısını, özelliklerini ve dönüşümlerini inceleyen bilimdir. Alt dalları: organik kimya (karbon bileşikleri), anorganik kimya, analitik kimya (madde analizi), fizikokimya, biyokimya (canlılardaki kimyasal olaylar).`,`Simya: ucuz metalleri altına dönüştürme ve ölümsüzlük iksiri arayan, deneme-yanılmaya dayalı uğraştır. Bilimsel yöntem kullanmadığı için bilim değildir; ancak damıtma, süzme gibi teknikler ve deney aletleri kimyaya kalmıştır.`,`Kimyaya katkı yapan bilim insanları: Câbir bin Hayyan (deneysel çalışmalar, damıtma), Robert Boyle (simyayı bilime dönüştürdü, element kavramı), Lavoisier (kütlenin korunumu yasası).`,`Laboratuvar güvenliği: koruyucu gözlük ve önlük giyilir, kimyasallar koklanmaz ve tadına bakılmaz, kimyasallar etiketsiz kaba konmaz. Asit suya eklenir (su asite değil).`,`Güvenlik işaretleri: alev simgesi yanıcı; kuru kafa zehirli; ele dökülen sıvı simgesi aşındırıcı (korozif); patlama simgesi patlayıcı; ünlem işareti tahriş edici madde anlamına gelir.`],keyTerms:[{term:`Simya`,def:`Bilimsel yönteme dayanmayan eski madde uğraşı.`},{term:`Aşındırıcı`,def:`Deriye ve metale zarar veren madde.`},{term:`Biyokimya`,def:`Canlılardaki kimyasal olayları inceler.`}],worked:[{q:`Asit seyreltilirken neden asit suya eklenir?`,steps:[`Asit-su karışımı çok ısı açığa çıkarır.`,`Suyun aside eklenmesi sıçramaya ve yanığa yol açabilir.`]}],reference:R,questions:[Ur(1,1,`Canlılardaki kimyasal olayları inceleyen kimya dalı hangisidir?`,[`Analitik kimya`,`Biyokimya`,`Anorganik kimya`,`Fizikokimya`],1,`Biyokimya canlılardaki kimyasal olayları inceler.`),Ur(2,2,`Simyanın bilim sayılmamasının temel nedeni nedir?`,[`Deney yapılmaması`,`Bilimsel yönteme dayanmaması`,`Metallerle çalışılması`,`Eski olması`],1,`Simya deneme-yanılmaya dayanır, sistematik bilimsel yöntem kullanmaz.`),Ur(3,2,`Kütlenin korunumu yasasını ortaya koyan bilim insanı kimdir?`,[`Robert Boyle`,`Lavoisier`,`Câbir bin Hayyan`,`Dalton`],1,`Lavoisier kütlenin korunumu yasasını ortaya koydu.`),Ur(4,1,`Üzerinde kuru kafa simgesi olan madde hangi özelliktedir?`,[`Yanıcı`,`Zehirli`,`Aşındırıcı`,`Patlayıcı`],1,`Kuru kafa zehirli madde simgesidir.`),Ur(5,2,`Laboratuvarda aşağıdakilerden hangisi YAPILMAMALIDIR?`,[`Koruyucu gözlük takmak`,`Kimyasalların tadına bakmak`,`Önlük giymek`,`Etiketleri okumak`],1,`Kimyasallar asla tadılmaz ve koklanmaz.`)]}),F({id:`k9-hal`,subject:`kim`,grade:9,unit:`Maddenin halleri`,title:`Maddenin halleri ve hal değişimleri`,goal:`Katı, sıvı, gaz ve plazma hallerini tanecik modeliyle açıklamak; hal değişimlerini (erime, donma, buharlaşma, yoğuşma, süblimleşme) ve ısı alışverişini kavramak.`,objectives:[`Hallerin tanecik düzenini karşılaştırır.`,`Hal değişimlerini adlandırır.`,`Hal değişiminde sıcaklığın sabit kaldığını yorumlar.`],prereq:[`k9-madde`],minutes:35,difficulty:2,body:[`Katılarda tanecikler düzenli ve birbirine çok yakındır; belirli şekil ve hacimleri vardır. Sıvılarda tanecikler yakın ama düzensizdir, akışkandırlar; belirli hacim, belirsiz şekil. Gazlarda tanecikler çok uzak ve hızlıdır; şekil ve hacimleri belirsizdir, sıkıştırılabilirler.`,`Plazma: çok yüksek sıcaklıkta elektronların atomlardan koptuğu, iyon ve elektronlardan oluşan haldir (Güneş, şimşek, neon lamba).`,`Isı alarak olan değişimler: erime (katı → sıvı), buharlaşma (sıvı → gaz), süblimleşme (katı → gaz; naftalin, kuru buz). Isı vererek olan değişimler: donma (sıvı → katı), yoğuşma (gaz → sıvı), kırağılaşma (gaz → katı).`,`Saf maddelerde hal değişimi sırasında sıcaklık sabit kalır; alınan ısı tanecikler arasındaki çekimi yenmek için kullanılır. Suyun erime noktası 0 °C, kaynama noktası (deniz seviyesinde) 100 °C’dir.`,`Buharlaşma her sıcaklıkta yüzeyde olur; kaynama belli sıcaklıkta tüm sıvıda olur. Yükseklerde açık hava basıncı azaldığı için su daha düşük sıcaklıkta kaynar.`],keyTerms:[{term:`Süblimleşme`,def:`Katının doğrudan gaza dönüşmesi.`},{term:`Yoğuşma`,def:`Gazın sıvıya dönüşmesi.`},{term:`Plazma`,def:`İyon ve elektronlardan oluşan hal.`}],worked:[{q:`Soğuk bardağın dışında su damlacıkları neden oluşur?`,steps:[`Havadaki su buharı soğuk yüzeye çarpar.`,`Isı vererek sıvıya dönüşür → yoğuşma.`]}],reference:R,questions:[Wr(1,1,`Katının doğrudan gaz hâline geçmesine ne ad verilir?`,[`Erime`,`Buharlaşma`,`Süblimleşme`,`Yoğuşma`],2,`Katı → gaz süblimleşmedir (naftalin).`),Wr(2,2,`Aşağıdaki hal değişimlerinden hangisinde madde ısı verir?`,[`Erime`,`Buharlaşma`,`Donma`,`Süblimleşme`],2,`Donma (sıvı → katı) ısı vererek olur.`),Wr(3,2,`Belirli hacmi olan ama belirli şekli olmayan hal hangisidir?`,[`Katı`,`Sıvı`,`Gaz`,`Plazma`],1,`Sıvıların hacmi belli, şekli bulunduğu kaba göredir.`),Wr(4,2,`Saf bir madde erirken sıcaklığı nasıl değişir?`,[`Artar`,`Azalır`,`Sabit kalır`,`Önce azalır sonra artar`],2,`Hal değişimi sırasında saf maddenin sıcaklığı sabit kalır.`),Wr(5,3,`Dağın tepesinde suyun 100 °C’den düşük sıcaklıkta kaynamasının nedeni nedir?`,[`Açık hava basıncının azalması`,`Suyun saf olmaması`,`Havanın soğuk olması`,`Rüzgârın etkisi`],0,`Basınç azalınca kaynama noktası düşer.`)]}),F({id:`b9-molekul`,subject:`biy`,grade:9,unit:`Yaşam: canlıların temel bileşenleri`,title:`Canlıların yapısındaki temel bileşikler`,goal:`Su, mineraller, karbonhidratlar, yağlar, proteinler, vitaminler ve nükleik asitlerin görevlerini ve kaynaklarını öğrenmek.`,objectives:[`İnorganik ve organik bileşikleri ayırır.`,`Karbonhidrat, yağ ve proteinin görevlerini eşleştirir.`,`
