925).`}],worked:[{q:`İlk muhalefet partisi hangisidir ve neden kapatılmıştır?`,steps:[`Terakkiperver Cumhuriyet Fırkası (1924).`,`Şeyh Said İsyanı’yla ilişkilendirildiği için kapatıldı (1925).`]}],reference:I,questions:[Xr(1,1,`Türkiye Cumhuriyeti’nin ilk muhalefet partisi hangisidir?`,[`Serbest Cumhuriyet Fırkası`,`Terakkiperver Cumhuriyet Fırkası`,`Demokrat Parti`,`Cumhuriyet Halk Fırkası`],1,`Terakkiperver Cumhuriyet Fırkası 1924’te kurulan ilk muhalefet partisidir.`),Xr(2,2,`Serbest Cumhuriyet Fırkası’nı Mustafa Kemal’in isteğiyle kim kurmuştur?`,[`Kâzım Karabekir`,`Ali Fethi Okyar`,`İsmet İnönü`,`Celal Bayar`],1,`Serbest Cumhuriyet Fırkası’nı 1930’da Ali Fethi Okyar kurdu.`),Xr(3,2,`Menemen Olayı’nda şehit edilen yedek subay öğretmen kimdir?`,[`Kubilay`,`Hasan Tahsin`,`Şahin Bey`,`Sütçü İmam`],0,`1930 Menemen Olayı’nda Kubilay şehit edildi.`),Xr(4,2,`Şeyh Said İsyanı’ndan sonra çıkarılan kanun hangisidir?`,[`Teşkilat-ı Esasiye`,`Takrir-i Sükûn Kanunu`,`Soyadı Kanunu`,`Tevhid-i Tedrisat`],1,`İsyan sonrasında huzuru sağlamak için Takrir-i Sükûn Kanunu çıkarıldı (1925).`),Xr(5,3,`Türkiye’de çok partili hayata kalıcı olarak geçiş hangi yılda olmuştur?`,[`1924`,`1930`,`1946`,`1960`],2,`1946’da Demokrat Parti’nin kurulmasıyla çok partili hayata kalıcı geçildi.`)]}),F({id:`h8-sonrasi`,subject:`tar`,grade:8,unit:`Ünite 7: Atatürk’ün Ölümü ve Sonrası`,title:`Atatürk’ün ölümü, Hatay’ın katılımı ve II. Dünya Savaşı`,goal:`Atatürk’ün ölümünü, İsmet İnönü dönemini, Hatay’ın anavatana katılmasını ve II. Dünya Savaşı’nda Türkiye’nin tutumunu öğrenmek.`,objectives:[`Atatürk’ün ölümünden sonraki gelişmeleri sıralar.`,`Hatay’ın anavatana katılışını açıklar.`,`II. Dünya Savaşı’nda Türkiye’nin politikasını yorumlar.`],prereq:[`h8-dis-politika`],minutes:30,difficulty:2,body:[`Atatürk 10 Kasım 1938’de İstanbul’da Dolmabahçe Sarayı’nda vefat etti. Naaşı 1953’te Anıtkabir’e taşındı.`,`TBMM, İsmet İnönü’yü cumhurbaşkanı seçti; İnönü’ye “Millî Şef” unvanı verildi.`,`Hatay meselesi Atatürk’ün son büyük dış politika başarısıdır: 1938’de Hatay Devleti kuruldu, 1939’da Hatay Meclisi’nin kararıyla anavatana katıldı.`,`II. Dünya Savaşı (1939–1945): Türkiye savaşa girmeme (tarafsızlık) politikası izledi; ancak ekonomik sıkıntılar yaşandı (Millî Korunma Kanunu, Varlık Vergisi, karne uygulaması).`,`Türkiye, Birleşmiş Milletler’in kurucu üyesi olabilmek için Şubat 1945’te Almanya ve Japonya’ya sembolik olarak savaş ilan etti. Savaş sonrası Sovyet tehdidi nedeniyle Batı’ya yakınlaştı.`],keyTerms:[{term:`Millî Şef`,def:`İsmet İnönü’ye verilen unvan.`},{term:`Tarafsızlık`,def:`Savaşta taraf olmama politikası.`}],worked:[{q:`Türkiye 1945’te neden Almanya ve Japonya’ya savaş ilan etti?`,steps:[`Savaş bitmek üzereydi; fiilî çatışmaya girmedi.`,`Amaç: Birleşmiş Milletler’in kurucu üyesi olabilmek.`]}],reference:I,questions:[Zr(1,1,`Atatürk hangi tarihte vefat etmiştir?`,[`29 Ekim 1938`,`10 Kasım 1938`,`19 Mayıs 1938`,`30 Ağustos 1938`],1,`Atatürk 10 Kasım 1938’de vefat etti.`),Zr(2,2,`Atatürk’ten sonra cumhurbaşkanı seçilen ve “Millî Şef” olarak anılan kimdir?`,[`Celal Bayar`,`İsmet İnönü`,`Fevzi Çakmak`,`Kâzım Karabekir`],1,`İsmet İnönü ikinci cumhurbaşkanıdır.`),Zr(3,2,`Hatay hangi yıl anavatana katılmıştır?`,[`1936`,`1938`,`1939`,`1945`],2,`Hatay Meclisi 1939’da anavatana katılma kararı aldı.`),Zr(4,2,`II. Dünya Savaşı’nda Türkiye’nin izlediği temel politika hangisidir?`,[`Mihver devletleriyle birlikte savaşmak`,`Savaşa girmemek (tarafsızlık)`,`Müttefiklerle cepheye asker göndermek`,`Sovyetlerle ittifak kurmak`],1,`Türkiye savaş boyunca fiilen savaşa girmedi.`),Zr(5,3,`Türkiye’nin Şubat 1945’te Almanya ve Japonya’ya savaş ilan etmesinin temel amacı nedir?`,[`Toprak kazanmak`,`Birleşmiş Milletler’in kurucu üyesi olmak`,`Hatay’ı almak`,`Savaş tazminatı almak`],1,`Kurucu üyelik şartı bu tarihe kadar savaş ilan etmekti.`)]}),F({id:`h9-uygarlik`,subject:`tar`,grade:9,unit:`İlk çağ uygarlıkları`,title:`İlk uygarlıklar: Mezopotamya, Mısır ve Anadolu`,goal:`Yazının icadıyla başlayan tarih çağlarını ve Mezopotamya, Mısır ve Anadolu uygarlıklarının insanlığa katkılarını öğrenmek.`,objectives:[`Tarih öncesi ve tarih çağlarını ayırt eder.`,`Sümer, Mısır ve Hitit uygarlıklarının katkılarını eşleştirir.`,`Lidya, Frig ve Urartu’yu tanır.`],prereq:[`h9-kronoloji`],minutes:35,difficulty:2,body:[`Tarih öncesi çağlar yazının icadından öncesidir (Taş ve Maden çağları). Yazı MÖ 3200 civarında Sümerler tarafından bulundu (çivi yazısı); tarih çağları başladı.`,`Mezopotamya (Dicle-Fırat arası): Sümerler (çivi yazısı, ziggurat tapınakları, 12 aylık ay takvimi), Babiller (Hammurabi Kanunları), Asurlar (Ninova kütüphanesi, Anadolu’ya ticaret kolonileri — Kültepe’de yazı Anadolu’ya geldi).`,`Mısır (Nil kıyısı): hiyeroglif yazısı, piramitler, güneş yılına dayalı takvim (365 gün), mumyalama sayesinde tıpta ilerleme, geometri.`,`Anadolu: Hititler (Kadeş Antlaşması — Mısır ile MÖ 1280 civarı, bilinen ilk yazılı antlaşma; çok tanrılı, “bin tanrılı halk”), Frigler (tarım, Gordion), Lidyalılar (parayı ilk kullanan, Kral Yolu), Urartular (Doğu Anadolu, su kanalları, madencilik), İyonlar (bilim ve felsefe: Thales, Heredot).`,`Bu uygarlıkların ortak özelliği akarsu kenarlarında tarıma dayalı yerleşik hayattır; yazı, takvim ve kanunlar ihtiyaçtan doğmuştur.`],keyTerms:[{term:`Çivi yazısı`,def:`Sümerlerin kil tabletlere yazdığı yazı.`},{term:`Kadeş Antlaşması`,def:`Hititler ile Mısır arasındaki ilk yazılı antlaşma.`},{term:`Hiyeroglif`,def:`Mısır resim yazısı.`}],worked:[{q:`Yazı Anadolu’ya nasıl geldi?`,steps:[`Asurlu tüccarlar Anadolu’da ticaret kolonileri kurdu (Kültepe-Kaniş).`,`Tabletlerle birlikte çivi yazısı Anadolu’ya geldi; Anadolu’da tarih çağları başladı.`]}],reference:R,questions:[Qr(1,1,`Yazıyı ilk kullanan uygarlık hangisidir?`,[`Mısırlılar`,`Sümerler`,`Hititler`,`Lidyalılar`],1,`Sümerler MÖ 3200 civarında çivi yazısını buldu.`),Qr(2,2,`Bilinen ilk yazılı antlaşma olan Kadeş Antlaşması hangi devletler arasında yapılmıştır?`,[`Sümer–Babil`,`Hitit–Mısır`,`Lidya–Frig`,`Asur–Urartu`],1,`Kadeş Antlaşması Hititler ile Mısır arasındadır.`),Qr(3,2,`Parayı ilk kullanan uygarlık hangisidir?`,[`Frigler`,`Lidyalılar`,`Urartular`,`İyonlar`],1,`Lidyalılar parayı ilk kullanarak ticareti kolaylaştırdı.`),Qr(4,2,`Güneş yılını esas alan 365 günlük takvimi ilk kullanan uygarlık hangisidir?`,[`Mısır`,`Sümer`,`Hitit`,`Asur`],0,`Mısırlılar Nil taşkınlarını hesaplamak için güneş takvimini geliştirdi.`),Qr(5,3,`Yazının Anadolu’ya gelmesini sağlayan gelişme hangisidir?`,[`Asurlu tüccarların ticaret kolonileri kurması`,`Hititlerin Mısır’ı fethetmesi`,`Lidyalıların Kral Yolu’nu yapması`,`Frigyalıların tarıma başlaması`],0,`Asur ticaret kolonileri (Kültepe) ile çivi yazısı Anadolu’ya geldi.`)]}),F({id:`h9-ilk-turk`,subject:`tar`,grade:9,unit:`İlk Türk devletleri`,title:`İlk Türk devletleri: Asya Hun, Göktürk, Uygur`,goal:`İlk Türk devletlerinin kuruluşunu, önemli hükümdarlarını ve kültürel özelliklerini (kut, töre, kurultay, Orhun Yazıtları) öğrenmek.`,objectives:[`Asya Hun, Göktürk ve Uygur devletlerinin önemli olaylarını sıralar.`,`Kut, töre ve kurultay kavramlarını açıklar.`,`Orhun Yazıtlarının önemini kavrar.`],prereq:[`h9-tarih`],minutes:40,difficulty:2,body:[`Asya Hun Devleti: bilinen ilk Türk devletidir. Mete Han (MÖ 209) orduyu onlu sisteme göre düzenledi; bu sistem günümüz ordularında da kullanılır. Çin Seddi Hun akınlarını önlemek için yapıldı.`,`Kavimler Göçü (375): Hunların batıya ilerlemesiyle başladı; Avrupa’da Batı Roma’nın yıkılmasında etkili oldu. Avrupa Hun Devleti’nin en ünlü hükümdarı Attila’dır.`,`I. Göktürk Devleti (552, Bumin Kağan): “Türk” adını resmî devlet adı olarak kullanan ilk devlettir. II. Göktürk (Kutluk) Devleti döneminde Orhun Yazıtları dikildi (Kül Tigin, Bilge Kağan, Tonyukuk; 8. yüzyıl). Yazıtlar Türk adının geçtiği ve Türk alfabesiyle yazılmış ilk Türkçe metinlerdir.`,`Uygurlar: yerleşik hayata geçen ilk Türk devletidir; şehirler, tapınaklar kurdular, Mani dinini benimsediler, matbaa ve kâğıt kullandılar, 18 harfli Uygur alfabesini geliştirdiler.`,`Devlet yönetimi: Kut — yönetme yetkisinin Gök Tanrı tarafından verildiğine inanılması. Töre — yazısız hukuk kuralları. Kurultay — önemli konuların görüşüldüğü danışma meclisi. İkili teşkilat: devlet doğu ve batı olarak yönetildi.`],keyTerms:[{term:`Kut`,def:`Yönetme yetkisinin Tanrı tarafından verildiği inancı.`},{term:`Töre`,def:`Türklerin yazısız hukuk kuralları.`},{term:`Kurultay`,def:`Danışma meclisi.`}],worked:[{q:`Orhun Yazıtları neden önemlidir?`,steps:[`Türk adının geçtiği ilk Türkçe metinlerdir.`,`Göktürk alfabesiyle yazılmıştır; Türk tarihi, dili ve devlet anlayışı hakkında bilgi verir.`]}],reference:R,questions:[$r(1,1,`Bilinen ilk Türk devleti hangisidir?`,[`Göktürkler`,`Asya Hun Devleti`,`Uygurlar`,`Karahanlılar`],1,`Asya Hun Devleti bilinen ilk Türk devletidir.`),$r(2,2,`Orduyu onlu sisteme göre düzenleyen Türk hükümdarı kimdir?`,[`Attila`,`Bumin Kağan`,`Mete Han`,`Bilge Kağan`],2,`Mete Han onlu sistemi kurdu.`),$r(3,2,`“Türk” adını resmî devlet adı olarak ilk kullanan devlet hangisidir?`,[`Asya Hun`,`Göktürk`,`Uygur`,`Hazar`],1,`Göktürkler Türk adını resmî olarak kullanan ilk devlettir.`),$r(4,2,`Yerleşik hayata geçen ilk Türk devleti hangisidir?`,[`Uygurlar`,`Göktürkler`,`Asya Hunları`,`Avarlar`],0,`Uygurlar şehirler kurarak yerleşik hayata geçti.`),$r(5,3,`Türklerde yönetme yetkisinin Tanrı tarafından verildiği inancına ne ad verilir?`,[`Töre`,`Kurultay`,`Kut`,`Yabgu`],2,`Kut anlayışı yönetme yetkisinin Tanrı’dan geldiği inancıdır.`)]}),F({id:`h9-islamiyet`,subject:`tar`,grade:9,unit:`İslam medeniyeti ve Türk-İslam devletleri`,title:`İslamiyet’in doğuşu ve ilk Türk-İslam devletleri`,goal:`İslamiyet’in doğuşunu, Dört Halife, Emevi ve Abbasi dönemlerini; Türklerin İslamiyet’i kabulünü ve ilk Türk-İslam devletlerini öğrenmek.`,objectives:[`Hicretin önemini açıklar.`,`Talas Savaşı’nın sonuçlarını yorumlar.`,`Karahanlı, Gazneli ve Büyük Selçuklu devletlerini tanır.`],prereq:[`h9-ilk-turk`],minutes:40,difficulty:2,body:[`İslamiyet 610’da Mekke’de Hz. Muhammed’e ilk vahyin gelmesiyle doğdu. 622’de Mekke’den Medine’ye yapılan göç (hicret) İslam devletinin temelini oluşturdu ve hicri takvimin başlangıcı oldu.`,`Dört Halife Dönemi (632–661): Hz. Ebubekir, Hz. Ömer, Hz. Osman, Hz. Ali. Emeviler (661–750) Arap milliyetçiliği yaptı; Abbasiler (750–1258) Türklere ve diğer Müslüman olmayan Araplara eşit davrandı, Bağdat bilim merkezi oldu (Beytülhikme).`,`Talas Savaşı (751): Abbasiler ile Çinliler arasında yapıldı; Türklerin (Karluklar) Abbasileri desteklemesiyle Çin yenildi. Türklerin İslamiyet’e geçişi hızlandı, kâğıt yapımı İslam dünyasına geçti.`,`Karahanlılar (840–1212): ilk Müslüman Türk devletidir (Satuk Buğra Han İslamiyet’i kabul etti). Kutadgu Bilig (Yusuf Has Hacib) ve Divanü Lügati’t-Türk (Kaşgarlı Mahmud) bu dönemde yazıldı.`,`Gazneliler (Gazneli Mahmud, Hindistan seferleri) ve Büyük Selçuklular: Dandanakan Savaşı (1040) ile Gaznelileri yenerek kuruldu; Malazgirt Savaşı (1071) ile Anadolu’nun kapıları Türklere açıldı.`],keyTerms:[{term:`Hicret`,def:`622’de Mekke’den Medine’ye göç.`},{term:`Talas Savaşı`,def:`751, Abbasi–Çin savaşı.`},{term:`Malazgirt`,def:`1071, Anadolu’nun kapılarını açan savaş.`}],worked:[{q:`Malazgirt Savaşı neden önemlidir?`,steps:[`1071’de Alparslan Bizans’ı yendi.`,`Anadolu’nun kapıları Türklere açıldı; Anadolu’nun Türkleşmesi hızlandı.`]}],reference:R,questions:[ei(1,1,`Hicri takvimin başlangıcı kabul edilen olay hangisidir?`,[`İlk vahiy`,`Hicret (622)`,`Mekke’nin fethi`,`Bedir Savaşı`],1,`Mekke’den Medine’ye göç (622) hicri takvimin başlangıcıdır.`),ei(2,2,`İlk Müslüman Türk devleti hangisidir?`,[`Gazneliler`,`Karahanlılar`,`Büyük Selçuklular`,`Tolunoğulları`],1,`Karahanlılar ilk Müslüman Türk devletidir.`),ei(3,2,`Talas Savaşı’nın (751) sonuçlarından biri hangisidir?`,[`Türklerin İslamiyet’e geçişinin hızlanması`,`Bizans’ın yıkılması`,`Anadolu’nun fethi`,`Haçlı Seferlerinin başlaması`],0,`Talas’tan sonra Türklerin İslamiyet’e geçişi hızlandı.`),ei(4,2,`Anadolu’nun kapılarını Türklere açan savaş hangisidir?`,[`Dandanakan`,`Malazgirt`,`Talas`,`Miryokefalon`],1,`1071 Malazgirt Savaşı Anadolu’nun kapılarını açtı.`),ei(5,3,`“Divanü Lügati’t-Türk” adlı eseri kim yazmıştır?`,[`Yusuf Has Hacib`,`Kaşgarlı Mahmud`,`Edip Ahmet`,`Ahmet Yesevi`],1,`Divanü Lügati’t-Türk Kaşgarlı Mahmud’un eseridir; Kutadgu Bilig ise Yusuf Has Hacib’indir.`)]}),F({id:`c9-iklim`,subject:`cog`,grade:9,unit:`Doğal sistemler: atmosfer ve iklim`,title:`İklim elemanları: sıcaklık, basınç, rüzgâr, nem ve yağış`,goal:`Hava durumu ile iklimi ayırt etmek; sıcaklığı etkileyen faktörleri, basınç-rüzgâr ilişkisini ve yağış türlerini öğrenmek.`,objectives:[`Hava durumu ile iklimi ayırt eder.`,`Sıcaklığı etkileyen etmenleri (enlem, yükselti, denizellik, bakı) açıklar.`,`Yağış türlerini eşleştirir.`],prereq:[`c9-dunya`],minutes:35,difficulty:2,body:[`Hava durumu kısa süreli (gün, hafta) atmosfer olaylarıdır; iklim ise geniş bir alanda uzun yıllar boyunca görülen ortalama hava koşullarıdır.`,`Sıcaklığı etkileyen etmenler: enlem (Ekvator’dan kutuplara sıcaklık azalır), yükselti (her 200 m’de yaklaşık 1 °C azalır), denize uzaklık (denizler sıcaklık farkını azaltır), bakı (Kuzey Yarım Küre’de güneye bakan yamaçlar daha sıcaktır), okyanus akıntıları.`,`Basınç ve rüzgâr: rüzgâr yüksek basınçtan alçak basınca doğru eser. Yükseldikçe basınç azalır. Isınan hava yükselir (alçak basınç), soğuyan hava çöker (yüksek basınç).`,`Nem: havadaki su buharı miktarıdır. Bağıl nem, havanın taşıyabileceği en fazla nemin yüzde kaçını taşıdığını gösterir; bağıl nem %100 olunca yoğuşma başlar.`,`Yağış türleri: konveksiyonel (yükselici hava hareketiyle, Ekvator’da her gün öğleden sonra), orografik (yamaç yağışı; dağların denize bakan yamaçlarında, Karadeniz kıyıları), cephesel (sıcak ve soğuk hava kütlelerinin karşılaşmasıyla, Türkiye’de kış yağışları).`],keyTerms:[{term:`İklim`,def:`Uzun yıllar ortalama hava koşulları.`},{term:`Bakı`,def:`Yamacın Güneş’e göre konumu.`},{term:`Orografik yağış`,def:`Nemli havanın dağ yamacı boyunca yükselmesiyle oluşan yağış.`}],worked:[{q:`Deniz seviyesinde 20 °C iken 1000 m yükseklikteki dağın sıcaklığı yaklaşık kaç °C’dir?`,steps:[`Her 200 m’de 1 °C azalır.`,`1000 ÷ 200 = 5 → 20 − 5 = 15 °C`]}],reference:R,questions:[ti(1,1,`Uzun yıllar boyunca görülen ortalama hava koşullarına ne ad verilir?`,[`Hava durumu`,`İklim`,`Basınç`,`Nem`],1,`Uzun yılların ortalaması iklimdir.`),ti(2,2,`Rüzgârlar hangi yönde eser?`,[`Alçak basınçtan yüksek basınca`,`Yüksek basınçtan alçak basınca`,`Her zaman kuzeyden güneye`,`Denizden karaya`],1,`Rüzgâr yüksek basınç alanından alçak basınç alanına eser.`),ti(3,2,`Karadeniz kıyılarında görülen ve nemli havanın dağ yamaçlarında yükselmesiyle oluşan yağış türü hangisidir?`,[`Konveksiyonel`,`Orografik`,`Cephesel`,`Dolu`],1,`Dağ yamacı boyunca yükselen nemli hava orografik yağış bırakır.`),ti(4,2,`Deniz seviyesinde sıcaklık 18 °C ise 1200 m yükseklikte sıcaklık yaklaşık kaç °C olur?`,[`6`,`12`,`15`,`24`],1,`1200 ÷ 200 = 6 °C azalır → 18 − 6 = 12 °C.`),ti(5,3,`Kuzey Yarım Küre’de güneye bakan yamaçların daha sıcak olmasını sağlayan etmen hangisidir?`,[`Enlem`,`Bakı`,`Okyanus akıntısı`,`Rüzgâr`],1,`Yamacın Güneş’e göre konumu (bakı) sıcaklığı etkiler.`)]}),F({id:`c9-yer`,subject:`cog`,grade:9,unit:`Doğal sistemler: yer şekilleri`,title:`İç ve dış kuvvetler; yer şekillerinin oluşumu`,goal:`Yer şekillerini oluşturan iç kuvvetleri (dağ oluşumu, deprem, volkanizma) ve dış kuvvetleri (akarsu, rüzgâr, buzul, dalga, karst) öğrenmek.`,objectives:[`İç ve dış kuvvetleri ayırt eder.`,`Dış kuvvetlerin oluşturduğu şekilleri eşleştirir.`,`Türkiye’den örnek verir.`],prereq:[`c9-harita`],minutes:40,difficulty:2,body:[`İç kuvvetler enerjisini yerin derinliklerinden alır ve yer şekillerini oluşturur: orojenez (dağ oluşumu — kıvrılma ve kırılma), epirojenez (kıta oluşumu — geniş alanların yavaşça yükselip alçalması), depremler ve volkanizma.`,`Dış kuvvetler enerjisini Güneş’ten alır, yer şekille
