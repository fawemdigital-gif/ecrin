şlemini yap.`,steps:[`√(2·8) = √16 = 4.`]}],reference:I,questions:[Gt(1,1,`√50 sayısının a√b biçiminde yazılışı aşağıdakilerden hangisidir?`,[`5√2`,`2√5`,`10√5`,`25√2`],0,`√50 = √(25 · 2) = 5√2.`),Gt(2,2,`√12 + √27 işleminin sonucu aşağıdakilerden hangisidir?`,[`√39`,`5√3`,`6√3`,`13√3`],1,`√12 = 2√3 ve √27 = 3√3. Toplam 5√3.`),Gt(3,1,`√7 sayısı aşağıdaki sayı çiftlerinden hangisinin arasındadır?`,[`1 ile 2`,`2 ile 3`,`3 ile 4`,`6 ile 7`],1,`√4 = 2 < √7 < √9 = 3.`),Gt(4,2,`√2 · √8 işleminin sonucu kaçtır?`,[`2√10`,`4`,`√10`,`16`],1,`√2 · √8 = √16 = 4.`),Gt(5,2,`√18 ÷ √2 işleminin sonucu kaçtır?`,[`3`,`9`,`√16`,`2`],0,`√18 ÷ √2 = √(18/2) = √9 = 3.`)]}),F({id:`m8-veri`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Veri Analizi`,title:`Veri analizi`,goal:`Veri grubunun ortalama, ortanca, tepe değer ve açıklığını bulmak; grafik yorumlamak.`,objectives:[`Aritmetik ortalama, ortanca ve tepe değeri bulur.`,`Açıklığı hesaplar.`,`Sütun ve daire grafiklerini yorumlar.`],minutes:30,difficulty:1,body:[`Aritmetik ortalama = verilerin toplamı ÷ veri sayısı. Ortanca (medyan): veriler küçükten büyüğe dizildiğinde ortadaki değer; çift sayıda veri varsa ortadaki iki değerin ortalaması.`,`Tepe değer (mod): en çok tekrar eden değer. Açıklık: en büyük değer − en küçük değer.`,`Ortalama bir değer eklenince değişir, ortanca ise uç değerlerden daha az etkilenir.`,`Daire grafiğinde dilimin merkez açısı = (yüzde / 100) × 360°. %25 → 90°.`,`Sütun grafiğinde eksenlerin ölçeğine ve birimine dikkat et; “en çok/en az/farkı” sorularında okunan değerleri çıkar veya topla.`],keyTerms:[{term:`Ortanca`,def:`Sıralı verinin ortasındaki değer.`},{term:`Tepe değer`,def:`En çok tekrar eden değer.`},{term:`Açıklık`,def:`En büyük ile en küçük değer farkı.`}],worked:[{q:`4, 6, 6, 8, 11 için ortalama, ortanca, tepe değer ve açıklık?`,steps:[`Ortalama: 35 ÷ 5 = 7.`,`Ortanca: 6 (ortadaki).`,`Tepe değer: 6.`,`Açıklık: 11 − 4 = 7.`]}],reference:I,questions:[Kt(1,1,`4, 6, 6, 8, 11 veri grubunun aritmetik ortalaması kaçtır?`,[`6`,`7`,`8`,`35`],1,`Toplam 35, veri sayısı 5: 35 ÷ 5 = 7.`),Kt(2,2,`3, 9, 5, 7, 12, 8 veri grubunun ortancası (medyanı) kaçtır?`,[`7`,`7,5`,`8`,`6`],1,`Sırala: 3, 5, 7, 8, 9, 12. Ortadaki iki değer 7 ve 8; ortalamaları 7,5.`),Kt(3,1,`2, 5, 5, 7, 5, 9, 2 veri grubunun tepe değeri kaçtır?`,[`2`,`5`,`7`,`9`],1,`5 sayısı 3 kez tekrar ettiği için tepe değerdir.`),Kt(4,2,`5 sayının ortalaması 12’dir. Bunlardan dördü 8, 10, 14 ve 16 ise beşinci sayı kaçtır?`,[`10`,`12`,`14`,`16`],1,`Toplam 5 · 12 = 60. Dört sayının toplamı 48. Beşinci sayı 60 − 48 = 12.`),Kt(5,1,`Bir daire grafiğinde %25’i gösteren dilimin merkez açısı kaç derecedir?`,[`25°`,`60°`,`90°`,`180°`],2,`(25/100) × 360° = 90°.`)]}),F({id:`m8-olasilik`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Olasılık`,title:`Olasılık`,goal:`Basit olayların olasılığını hesaplamak; kesin ve imkânsız olayı ayırt etmek.`,objectives:[`Basit olayın olasılığını hesaplar.`,`Bağımsız olayların olasılığını çarpar.`,`Olasılığın 0 ile 1 arasında olduğunu bilir.`],minutes:25,difficulty:2,body:[`Olasılık = istenen durum sayısı ÷ tüm durum sayısı. Değeri 0 ile 1 arasındadır; 0 imkânsız, 1 kesin olay demektir.`,`Bir zar atıldığında 6 eş olasılıklı durum vardır. Çift gelme olasılığı 3/6 = 1/2; asal (2, 3, 5) gelme olasılığı 3/6 = 1/2.`,`Bağımsız (birbirini etkilemeyen) olayların birlikte olma olasılığı, olasılıklar çarpılarak bulunur. İki madeni parada ikisinin de yazı gelmesi: 1/2 · 1/2 = 1/4.`,`Bir olayın olmama olasılığı = 1 − olma olasılığı.`],keyTerms:[{term:`Eş olasılıklı`,def:`Gerçekleşme şansı eşit olan durumlar.`},{term:`Kesin olay`,def:`Olasılığı 1 olan olay.`},{term:`İmkânsız olay`,def:`Olasılığı 0 olan olay.`}],worked:[{q:`Torbada 4 kırmızı, 6 mavi top var. Mavi çekme olasılığı?`,steps:[`Toplam 10 top, mavi 6 tane.`,`6/10 = 3/5.`]}],reference:I,questions:[qt(1,1,`Bir torbada 4 kırmızı ve 6 mavi top vardır. Torbadan rastgele çekilen bir topun mavi olma olasılığı kaçtır?`,[`2/5`,`3/5`,`1/6`,`4/6`],1,`Mavi 6 tane, toplam 10: 6/10 = 3/5.`),qt(2,1,`Bir zar atılıyor. Üst yüze asal sayı gelme olasılığı kaçtır?`,[`1/3`,`1/2`,`2/3`,`1/6`],1,`Asal sayılar 2, 3, 5 → 3 durum; toplam 6. Olasılık 3/6 = 1/2.`),qt(3,2,`İki madeni para aynı anda atılıyor. İkisinin de yazı gelme olasılığı kaçtır?`,[`1/2`,`1/3`,`1/4`,`2/3`],2,`Bağımsız olaylar: 1/2 · 1/2 = 1/4.`),qt(4,1,`Aşağıdakilerden hangisi bir olayın olasılığı olamaz?`,[`0`,`1/3`,`1`,`3/2`],3,`Olasılık 0 ile 1 arasındadır; 3/2 = 1,5 > 1 olduğu için olasılık olamaz.`),qt(5,2,`Bir kutuda 1’den 10’a kadar numaralı 10 kart vardır. Çekilen kartın 3’ün katı olma olasılığı kaçtır?`,[`3/10`,`1/3`,`1/10`,`1/2`],0,`3’ün katları 3, 6, 9 → 3 durum, toplam 10: 3/10.`)]}),F({id:`m8-cebir`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Cebirsel İfadeler ve Özdeşlikler`,title:`Cebirsel ifadeler ve özdeşlikler`,goal:`Cebirsel ifadeleri çarpanlara ayırmak ve özdeşlikleri kullanmak.`,objectives:[`Özdeşlikleri açar.`,`İfadeyi ortak çarpan ve özdeşlikle çarpanlarına ayırır.`,`İfade sadeleştirir.`],minutes:35,difficulty:2,body:[`Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a + b)(a − b) = a² − b².`,`Ortak çarpan paranteze alma: 6x + 9 = 3(2x + 3). Ters yönde dağılma özelliğidir.`,`İki kare farkı: a² − b² = (a − b)(a + b). Örnek: x² − 25 = (x − 5)(x + 5).`,`Tam kare: x² + 6x + 9 = (x + 3)²; x² − 10x + 25 = (x − 5)².`,`Üç terimli ifadelerde ilk ve son terim kare ise ortadaki terimin 2ab olup olmadığına bak.`],keyTerms:[{term:`Özdeşlik`,def:`Her değer için doğru olan eşitlik.`},{term:`Çarpanlara ayırma`,def:`İfadeyi çarpım biçiminde yazma.`}],worked:[{q:`x² − 25 ifadesini çarpanlarına ayır.`,steps:[`İki kare farkı: x² − 5².`,`(x − 5)(x + 5).`]},{q:`(x + 5)² ifadesini aç.`,steps:[`x² + 2·x·5 + 25 = x² + 10x + 25.`]}],reference:I,questions:[L(1,1,`(x + 4)² ifadesinin açılımı aşağıdakilerden hangisidir?`,[`x² + 16`,`x² + 8x + 16`,`x² + 4x + 16`,`x² + 8x + 8`],1,`(a + b)² = a² + 2ab + b²: x² + 2·x·4 + 16 = x² + 8x + 16.`),L(2,1,`x² − 25 ifadesinin çarpanlarına ayrılmış hâli hangisidir?`,[`(x − 5)²`,`(x − 5)(x + 5)`,`(x + 5)²`,`x(x − 25)`],1,`İki kare farkı: a² − b² = (a − b)(a + b).`),L(3,2,`x² + 6x + 9 ifadesi aşağıdakilerden hangisine eşittir?`,[`(x + 3)²`,`(x + 9)²`,`(x − 3)²`,`x(x + 15)`],0,`x² + 2·x·3 + 3² = (x + 3)².`),L(4,2,`6x + 9 ifadesinin ortak çarpan parantezine alınmış hâli hangisidir?`,[`3(2x + 3)`,`3(2x + 9)`,`6(x + 9)`,`2(3x + 9)`],0,`Ortak çarpan 3: 6x + 9 = 3(2x + 3).`),L(5,3,`(x − 3)² − (x + 3)(x − 3) ifadesinin sadeleştirilmiş hâli hangisidir?`,[`−6x + 18`,`−6x`,`18`,`6x`],0,`(x² − 6x + 9) − (x² − 9) = −6x + 18.`)]}),F({id:`m8-denklem`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Doğrusal Denklemler`,title:`Doğrusal denklemler, eğim ve denklem sistemleri`,goal:`Doğrusal denklemleri, eğimi ve iki bilinmeyenli denklem sistemlerini çözmek.`,objectives:[`Doğrunun eğimini hesaplar.`,`y = mx + n denklemini yorumlar.`,`İki bilinmeyenli denklem sistemini çözer.`],prereq:[`m8-cebir`],minutes:40,difficulty:3,body:[`Doğrusal denklem y = mx + n biçimindedir: m eğim, n ise doğrunun y eksenini kestiği noktadır (0, n).`,`İki noktası (x₁, y₁) ve (x₂, y₂) olan doğrunun eğimi m = (y₂ − y₁) ÷ (x₂ − x₁). x bir artınca y’nin değişimini gösterir.`,`Bir nokta doğrunun üzerindeyse koordinatları denklemi sağlar: y = 3x − 2 için (2, 4): 3·2 − 2 = 4 ✓.`,`Denklem sistemi: yok etme yöntemiyle iki denklem toplanır veya çıkarılır. x + y = 7 ve x − y = 1 → toplam 2x = 8, x = 4; y = 3.`,`Yerine koyma yönteminde bir değişken diğerinin cinsinden yazılıp ikinci denkleme konur.`],keyTerms:[{term:`Eğim`,def:`x bir artınca y’nin değişimi.`},{term:`Denklem sistemi`,def:`Aynı anda sağlanması istenen iki denklem.`}],worked:[{q:`A(1, 2) ve B(3, 6) noktalarından geçen doğrunun eğimi?`,steps:[`m = (6 − 2) ÷ (3 − 1) = 4 ÷ 2 = 2.`]},{q:`x + y = 7 ve x − y = 1 sistemini çöz.`,steps:[`Topla: 2x = 8 → x = 4.`,`x + y = 7 → y = 3.`]}],reference:I,questions:[Jt(1,1,`y = 2x − 3 doğrusu y eksenini hangi noktada keser?`,[`(0, −3)`,`(−3, 0)`,`(0, 2)`,`(3, 0)`],0,`x = 0 için y = −3. Kesim noktası (0, −3).`),Jt(2,2,`A(1, 2) ve B(3, 6) noktalarından geçen doğrunun eğimi kaçtır?`,[`1`,`2`,`3`,`4`],1,`m = (6 − 2) ÷ (3 − 1) = 2.`),Jt(3,2,`x + y = 7 ve x − y = 1 denklem sisteminin çözümünde x kaçtır?`,[`3`,`4`,`5`,`6`],1,`İki denklemi topla: 2x = 8 → x = 4 (y = 3).`),Jt(4,2,`y = 3x − 2 doğrusu aşağıdaki noktalardan hangisinden geçer?`,[`(1, 2)`,`(2, 4)`,`(0, 2)`,`(3, 6)`],1,`x = 2 için y = 3·2 − 2 = 4. Nokta (2, 4).`),Jt(5,3,`Bir sayının %20 fazlası 96’dır. Bu sayı kaçtır?`,[`80`,`76`,`86`,`115`],0,`Sayı x ise 1,2x = 96 → x = 80.`)]}),F({id:`m8-esitsizlik`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Eşitsizlikler`,title:`Eşitsizlikler`,goal:`Birinci dereceden eşitsizlikleri çözmek ve sayı doğrusunda göstermek.`,objectives:[`Eşitsizliği çözer.`,`Negatif sayıyla çarpma/bölmede işaret yönünü değiştirir.`,`Çözüm kümesindeki tam sayıları sayar.`],prereq:[`m8-denklem`],minutes:25,difficulty:2,body:[`Eşitsizlik de denklem gibi çözülür: iki tarafa aynı sayıyı ekleyip çıkarabilir, pozitif sayıyla çarpıp bölebilirsin.`,`Dikkat: Eşitsizliğin iki tarafı negatif bir sayıyla çarpılır ya da bölünürse eşitsizliğin yönü değişir. −2x ≥ 6 → x ≤ −3.`,`Sayı doğrusunda < ve > için boş (içi dolmayan) daire, ≤ ve ≥ için dolu daire kullanılır.`,`Bileşik eşitsizlik: −2 < x ≤ 3 için tam sayı çözümleri −1, 0, 1, 2, 3’tür (−2 dahil değil, 3 dahil).`],keyTerms:[{term:`Çözüm kümesi`,def:`Eşitsizliği sağlayan değerlerin kümesi.`}],worked:[{q:`3x − 5 < 10 eşitsizliğini çöz.`,steps:[`3x < 15.`,`x < 5.`]},{q:`−2x ≥ 6 eşitsizliğini çöz.`,steps:[`−2’ye bölünce yön değişir.`,`x ≤ −3.`]}],reference:I,questions:[Yt(1,1,`3x − 5 < 10 eşitsizliğinin çözümü hangisidir?`,[`x < 5`,`x > 5`,`x < 3`,`x > 3`],0,`3x < 15 → x < 5.`),Yt(2,2,`−2x + 3 ≥ 9 eşitsizliğinin çözümü hangisidir?`,[`x ≥ −3`,`x ≤ −3`,`x ≥ 3`,`x ≤ 3`],1,`−2x ≥ 6. Negatif sayıya bölünce yön değişir: x ≤ −3.`),Yt(3,1,`2x + 1 > 7 eşitsizliğini sağlayan en küçük tam sayı kaçtır?`,[`3`,`4`,`5`,`6`],1,`2x > 6 → x > 3. En küçük tam sayı 4.`),Yt(4,2,`−2 < x ≤ 3 eşitsizliğini sağlayan kaç tam sayı vardır?`,[`4`,`5`,`6`,`3`],1,`x = −1, 0, 1, 2, 3 → 5 tam sayı.`),Yt(5,2,`x’in değeri için “x en az 5’tir” ifadesinin eşitsizlikle yazılışı hangisidir?`,[`x < 5`,`x > 5`,`x ≥ 5`,`x ≤ 5`],2,`“En az 5” demek 5 ve 5’ten büyük değerler: x ≥ 5.`)]}),F({id:`m8-ucgen`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Üçgenler`,title:`Üçgenler: eşitsizlik, Pisagor ve alan`,goal:`Üçgende kenar-açı ilişkilerini, Pisagor bağıntısını ve alanı kullanmak.`,objectives:[`Üçgen eşitsizliğini kullanır.`,`Pisagor bağıntısı ile kenar bulur.`,`Üçgenin alanını hesaplar.`],minutes:35,difficulty:2,body:[`Üçgenin iç açıları toplamı 180°’dir. Eşkenar üçgenin her açısı 60°, ikizkenar üçgende taban açıları eşittir.`,`Üçgen eşitsizliği: Herhangi iki kenarın farkı üçüncü kenardan küçük, toplamı büyüktür: |a − b| < c < a + b. Kenarları 8 ve 3 olan üçgenin üçüncü kenarı 5 < x < 11 aralığındadır; tam sayı değerleri 6, 7, 8, 9, 10.`,`Büyük açı karşısında büyük kenar bulunur.`,`Dik üçgende Pisagor: a² + b² = c² (c hipotenüs). Pisagor üçlüleri: 3-4-5, 5-12-13, 8-15-17 ve katları.`,`Alan: taban × yükseklik ÷ 2. Dik üçgende dik kenarlar birbirinin yüksekliğidir.`],keyTerms:[{term:`Hipotenüs`,def:`Dik açının karşısındaki en uzun kenar.`},{term:`Üçgen eşitsizliği`,def:`|a − b| < c < a + b`}],worked:[{q:`Kenarları 8 ve 3 olan üçgenin üçüncü kenarı kaç tam sayı değeri alabilir?`,steps:[`8 − 3 < x < 8 + 3 → 5 < x < 11.`,`x = 6, 7, 8, 9, 10 → 5 değer.`]},{q:`Dik kenarları 6 ve 8 olan dik üçgenin hipotenüsü?`,steps:[`6² + 8² = 100.`,`Hipotenüs 10.`]}],reference:I,questions:[Xt(1,1,`Dik kenar uzunlukları 6 cm ve 8 cm olan dik üçgenin hipotenüsü kaç cm’dir?`,[`10`,`12`,`14`,`7`],0,`6² + 8² = 36 + 64 = 100; hipotenüs 10 cm.`),Xt(2,2,`İki kenarı 8 cm ve 3 cm olan bir üçgenin üçüncü kenarı kaç farklı tam sayı değeri alabilir?`,[`4`,`5`,`6`,`7`],1,`5 < x < 11 → x = 6, 7, 8, 9, 10 → 5 değer.`),Xt(3,1,`Dik kenarları 5 cm ve 12 cm olan dik üçgenin hipotenüsü kaç cm’dir?`,[`13`,`15`,`17`,`11`],0,`5² + 12² = 169; √169 = 13.`),Xt(4,2,`Tabanı 10 cm, o tabana ait yüksekliği 6 cm olan üçgenin alanı kaç cm²’dir?`,[`60`,`30`,`16`,`32`],1,`Alan = 10 · 6 ÷ 2 = 30 cm².`),Xt(5,2,`Bir üçgenin iki açısı 40° ve 65° ise bu üçgenin en uzun kenarı hangi açının karşısındadır?`,[`40°’nin`,`65°’nin`,`Üçüncü açının (75°)`,`Üç kenar da eşittir`],2,`Üçüncü açı 180 − 105 = 75° ve en büyük açıdır; en büyük açının karşısında en uzun kenar bulunur.`)]}),F({id:`m8-esl`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Eşlik ve Benzerlik`,title:`Eşlik ve benzerlik`,goal:`Benzer şekillerde kenar, çevre ve alan oranlarını kullanmak.`,objectives:[`Eş ve benzer şekilleri ayırt eder.`,`Benzerlik oranını bulur.`,`Çevre ve alan oranını benzerlik oranından bulur.`],prereq:[`m8-ucgen`],minutes:35,difficulty:3,body:[`Eş şekiller aynı şekil ve aynı boyuttadır (karşılıklı kenarlar ve açılar eşit). Benzer şekillerde karşılıklı açılar eşit, karşılıklı kenarlar orantılıdır.`,`Benzerlik oranı k = karşılıklı kenarların oranı. Çevreler oranı da k’dır.`,`Alanlar oranı benzerlik oranının karesidir: k². Benzerlik oranı 3 ise alan oranı 9’dur.`,`İki üçgenin üç açısı da eşitse (AAA) üçgenler benzerdir. Kenarlar orantılı yazılır: AB/DE = BC/EF.`],keyTerms:[{term:`Benzerlik oranı`,def:`Karşılıklı kenarların oranı (k).`},{term:`Alan oranı`,def:`Benzerlik oranının karesi (k²).`}],worked:[{q:`ABC ~ DEF, benzerlik oranı 2. ABC’nin çevresi 12 ise DEF’nin çevresi ve alanlar oranı?`,steps:[`Çevreler oranı 2: DEF’nin çevresi 24.`,`Alanlar oranı 2² = 4.`]}],reference:I,questions:[Zt(1,1,`Karşılıklı kenarları 3 ile 6, 4 ile 8 olan iki üçgenin benzerlik oranı kaçtır?`,[`1/2`,`2`,`3`,`1/3`],1,`Kenarlar 3→6 ve 4→8: 2 katı. Benzerlik oranı 2 (ya da tersi 1/2). Büyüğün küçüğe oranı 2’dir.`),Zt(2,2,`Benzerlik oranı 3 olan iki üçgenden küçüğün alanı 5 cm² ise büyüğün alanı kaç cm²’dir?`,[`15`,`30`,`45`,`9`],2,`Alanlar oranı k² = 9: 5 · 9 = 45 cm².`),Zt(3,2,`İki benzer üçgenin benzerlik oranı 2’dir. Küçüğün çevresi 12 cm ise büyüğün çevresi kaç cm’dir?`,[`14`,`24`,`36`,`48`],1,`Çevreler benzerlik oranı kadar büyür: 12 · 2 = 24 cm.`),Zt(4,3,`ABC ve DEF benzer üçgenlerinde AB = 3, BC = 4, DE = 6 ise EF kaçtır?`,[`6`,`7`,`8`,`9`],2,`Oran DE/AB = 2. EF = 2 · BC = 8.`),Zt(5,1,`Aşağıdakilerden hangisi her zaman doğrudur?`,[`Benzer şekiller eştir.`,`Eş şekiller benzerdir.`,`Benzer şekillerin alanları eşittir.`,`Benzer şekillerin çevreleri eşittir.`],1,`Eş şekillerin benzerlik oranı 1’dir; yani eş şekiller benzerdir. Benzer şekiller ise farklı büyüklükte olabilir.`)]}),F({id:`m8-donusum`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Dönüşüm Geometrisi`,title:`Dönüşüm geometrisi`,goal:`Öteleme, yansıma ve dönme dönüşümleriyle noktaların yeni koordinatlarını bulmak.`,objectives:[`Noktayı öteler.`,`Eksenlere göre yansımasını bulur.`,`Orijin etrafında 180° dönmeyi uygular.`],minutes:25,difficulty:2,body:[`Dönüşümlerde şeklin boyutu ve biçimi korunur; yalnızca konumu (ve yönü) değişir.`,`Öteleme: Her noktayı aynı yönde ve aynı miktarda kaydırmaktır. (2, 5) noktası 3 birim sağa, 4 birim aşağı ötelenirse (5, 1) olur.`,`Yansıma: x eksenine göre yansımada (a, b) → (a, −b); y eksenine göre yansımada (a, b) → (−a, b).`,`Orijin etrafında 180° dönmede (a, b) → (−a, −b).`,`Yansıma, öteleme ve dönmede uzunluklar ve açılar korunur; alan ve çevre değişmez.`],keyTerms:[{term:`Öteleme`,def:`Her noktanın aynı miktarda kaydırılması.`},{term:`Yansıma`,def:`Bir doğruya göre ayna görüntüsü.`}],worked:[{q:`A(3, −2) noktasının x eksenine göre yansıması?`,steps:[`(a, b) → (a, −b).`,`A′(3, 2).`]}],reference:I,questions:[Qt(1,1,`A(3, −2) noktasının x eksenine göre yansıması aşağıdakilerden hangisidir?`,[`(3, 2)`,`(−3, −2)`,`(−3, 2)`,`(2, 3)`],0,`x eksenine göre yansımada y’nin işareti değişir: (3, 2).`),Qt(2,1,`B(4, 1) noktasının y eksenine göre yansıması aşağıdakilerden hangisidir?`,[`(−4, 1)`,`(4, −1)`,`(−4, −1)`,`(1, 4)`],0,`y eksenine göre yansımada x’in işareti değişir: (−4, 1).`),Qt(3,2,`C(2, 5) noktası 3 birim sağa ve 4 birim aşağı ötelenirse nereye gelir?`,[`(5, 1)`,`(−1, 9)`,`(5, 9)`,`(−1, 1)`],0,`x: 2 + 3 = 5. y: 5 − 4 = 1.`),Qt(4,2,`D(−3, 4) noktasının orijin etrafında 180° döndürülmüş görüntüsü hangisidir?`,[`(3, −4)`,`(−3, −4)`,`(3, 4)`,`(4, −3)`],0,`180° dönmede (a, b) → (−a, −b): (3, −4).`),Qt(5,2,`Bir şekle yansıma uygulanırsa aşağıdakilerden hangisi değişmez?`,[`Konumu`,`Alanı`,`Yönü`,`Koordinatları`],1,`Yansımada şeklin boyutu korunur; alan ve çevre değişmez. Konum, yön ve koordinatlar değişir.`)]}),F({id:`m8-cisim`,subject:`mat`,grade:8,unit:`LGS 8. sınıf: Geometrik Cisimler`,title:`Geometrik cisimler: prizma, silindir, koni, piramit`,goal:`Prizma, silindir, piramit ve koninin yüzey alanı ve hacmini hesaplamak.`,objectives:[`Prizma ve silindirin hacmini bulur.`,`Piramit ve koninin hacmini bulur.`,`Silindirin yanal alanını hesaplar.`],prereq:[`m8-ucgen`],minutes:35,difficulty:3,body:[`Prizma ve silindirin hacmi = taban alanı × yükseklik. Silindirde taban alanı π r², hacmi π r² h.`,`Piramit ve koninin hacmi, aynı tabanlı ve yükseklikli prizma/silindirin 1/3’üdür: V = (1/3) · taban alanı · h; koni için V = (1/3) π r² h.`,`Silindirin yanal alanı 2π r h, tüm yüzey alanı 2π r h + 2π r². (Sorularda π genellikle 3 alınır.)`,`Birimler: Uzunluk cm ise alan cm², hacim cm³ olur.`],keyTerms:[{term:`Taban alanı`,def:`Cismin tabanının alanı.`},{term:`Yanal alan`,def:`Tabanlar hariç yüzey alanı.`}],worked:[{q:`Yarıçapı 2 cm, yüksekliği 5 cm olan silindirin hacmi? (π = 3)`,steps:[`V = π r² h = 3 · 4 · 5 = 60 cm³.`]}],reference:I,questions:[$t(1,1,`Taban alanı 6 cm², yüksekliği 5 cm olan bir prizmanın hacmi kaç cm³’tür?`,[`11`,`30`,`15`,`60`],1,`V = taban alanı × yükseklik = 6 · 5 = 30 cm³.`),$t(2,2,`Yarıçapı 2 cm, yüksekliği 5 cm olan silindirin hacmi kaç cm³’tür? (π = 3 alınız.)`,[`30`,`60`,`20`,`120`],1,`V = π r² h = 3 · 4 · 5 = 60 cm³.`),$t(3,2,`Taban alanı 18 cm², yüksekliği 5 cm olan bir koninin hacmi kaç cm³’tür?`,[`90`,`30`,`15`,`45`],1,`V = (1/3) · 18 · 5 = 30 cm³.`),$t(4,2,`Yarıçapı 3 cm, yüksekliği 4 cm olan silindirin yanal alanı kaç cm²’dir? (π = 3 alınız.)`,[`72`,`36`,`108`,`24`],0,`Yanal alan = 2π r h = 2 · 3 · 3 · 4 = 72 cm².`),$t(5,3,`Aynı taban alanına ve aynı yüksekliğe sahip bir piramidin hacmi, prizmanın hacminin kaçta kaçıdır?`,[`1/2`,`1/3`,`1/4`,`2/3`],1,`Piramit hacmi aynı tabanlı ve yükseklikli prizmanın 1/3’üdür.`)]}),F({id:`m9-sayilar`,subject:`mat`,grade:9,unit:`Tema 1: Sayılar`,title:`Asal çarpanlar, EBOB-EKOK ve üslü ifadeler`,goal:`Doğal sayıların çarpan ve bölen yapısını kullanıp EBOB-EKOK problemlerini çözmek.`,objectives:[`Sayıyı asal çarpanlarına ayırır.`,`Bölünebilme kurallarını uygular.`,`EBOB ve EKOK’u bulur ve problemde kullanır.`,`Aynı tabanlı üslü ifadelerle işlem yapar.`],prereq:[`m8-carpan`],minutes:35,difficulty:2,body:[`Asal sayı, yalnızca 1’e ve kendisine bölünen 1’den büyük sayıdır (2, 3, 5, 7, 11, …). Her doğal sayı (1’den büyük) asal çarpanlarının çarpımı olarak yazılır: 60 = 2² · 3 · 5.`,`Bölünebilme kuralları: 2 ile (son rakam çift), 3 ile (rakamlar toplamı 3’ün katı), 5 ile (son rakam 0 veya 5), 9 ile (rakamlar toplamı 9’un katı), 10 ile (son rakam 0).`,`EBOB: İki sayıyı da bölen en büyük sayı. Ortak asal çarpanların en küçük üsleri çarpılır. EKOK: İkisinin de katı olan en küçük sayı. Tüm asal çarpanların en büyük üsleri çarpılır.`,`EBOB × EKOK = iki sayının çarpımı. Parçalara bölme / paylaştırma problemleri EBOB, birlikte tekrar eden olaylar EKOK ile çözülür.`,`Üslü ifadeler: aₘ × aₙ = aₘ₊ₙ ; aₘ ÷ aₙ = aₘ₋ₙ ; (aₘ)ₙ = aₘ·ₙ ; a⁰ = 1 (a ≠ 0).`],keyTerms:[{term:`Asal sayı`,def:`Tam olarak iki böleni olan sayı.`},{term:`EBOB`,def:`En büyük ortak bölen.`},{term:`EKOK`,def:`En küçük ortak kat.`},{term:`Üs`,def:`Bir sayının kendisiyle kaç kez çarpıldığını gösterir.`}],worked:[{q:`60 sayısını asal çarpanlarına ayır.`,steps:[`60 ÷ 2 = 30; 30 ÷ 2 = 15; 15 ÷ 3 = 5; 5 asal.`,`60 = 2 · 2 · 3 · 5 = 2² · 3 · 5.`]},{q:`12 ve 18’in EBOB’unu ve EKOK’unu bul.`,steps:[`12 = 2² · 3, 18 = 2 · 3².`,`EBOB: 2¹ · 3¹ = 6.`,`EKOK: 2² · 3² = 36.`]},{q:`İki otobüs aynı anda kalkıyor; biri 12, diğeri 18 dakikada bir sefer yapıyor. Tekrar aynı anda ne zaman kalkarlar?`,steps:[`“Birlikte tekrar” EKOK ister.`,`EKOK(12, 18) = 36.`,`36 dakika sonra.`]}],reference:Ht(`Matematik`,`Sayılar`),questions:[en(1,1,`84 sayısının asal çarpanlarına ayrılmış hâli aşağıdakilerden hangisidir?`,[`2 · 3 · 14`,`2² · 3 · 7`,`2 · 42`,`3 · 4 · 7`],1,`84 = 2 · 42 = 2 · 2 · 21 = 2² · 3 · 7. Diğer seçeneklerde 14, 42 ve 4 asal değildir.`),en(2,2,`345 sayısı aşağıdakilerden hangisine kalansız bölünür?`,[`Yalnızca 3’e`,`Yalnızca 5’e`,`Hem 3’e hem 5’e`,`9’a`],2,`Son rakam 5 → 5’e bölünür. Rakamlar toplamı 3 + 4 + 5 = 12, 3’ün katı → 3’e bölünür. 12, 9’un katı değil → 9’a bölünmez.`),en(3,2,`8 ve 12 sayılarının en küçük ortak katı (EKOK) kaçtır?`,[`4`,`24`,`48`,`96`],1,`8 = 2³, 12 = 2² · 3. EKOK = 2³ · 3 = 24.`),en(4,2,`18 ve 30 sayılarının en büyük ortak böleni (EBOB) kaçtır?`,[`3`,`6`,`9`,`90`],1,`18 = 2 · 3², 30 = 2 · 3 · 5. Ortak çarpanlar 2 ve 3: EBOB = 6.`),en(5,2,`2³ × 2⁴ işleminin sonucu aşağıdakilerden hangisine eşittir?`,[`2¹²`,`2⁷`,`4⁷`,`2`],1,`Aynı tabanlı çarpmada üsler toplanır: 2³⁺⁴ = 2⁷ = 128.`)]}),F({id:`m9-nicelik`,subject:`mat`,grade:9,unit:`Tema 2: Nicelikler ve Değişimler`,title:`Doğrusal ilişkiler ve eşitsizlikler`,goal:`Tablo, denklem ve grafik arasında geçiş yaparak doğrusal ilişkileri yorumlamak.`,objectives:[`İki nicelik arasındaki ilişkiyi tablodan denkleme çevirir.`,`y = ax + b biçimindeki ilişkiyi yorumlar.`,`Birinci dereceden eşitsizlik çözer.`],prereq:[`m8-cebir`],minutes:35,difficulty:2,body:[`İki nicelik birlikte değişiyorsa aralarındaki ilişki tabloyla, denklemle veya grafikle gösterilebilir.`,`Doğrusal ilişki: x birer birer artarken y her seferinde aynı miktarda değişir. Denklemi y = ax + b biçimindedir; a değişim miktarı (eğim), b başlangıç değeridir (x = 0 iken y).`,`Örnek: Taksi açılış ücreti 10 TL, kilometre başı 4 TL ise ücret y = 4x + 10’dur.`,`Eşitsizlikte < ve > işaretleri kullanılır. Denklemdeki gibi çözülür; negatif sayıyla çarparken ya da bölerken işaret yön değiştirir.`,`Çözüm kümesi sayı doğrusunda gösterilir: x > 4 için 4 boş (içi dolu olmayan) daire ve sağa doğru ok.`],keyTerms:[{term:`Değişken`,def:`Değer alabilen nicelik (x, y).`},{term:`Eğim (a)`,def:`x bir artınca y’nin değişimi.`},{term:`Başlangıç değeri (b)`,def:`x = 0 iken y değeri.`}],worked:[{q:`x: 1, 2, 3 iken y: 5, 7, 9 ise ilişkiyi yaz.`,steps:[`x bir artınca y 2 artıyor: a = 2.`,`x = 1 iken y = 5: 2·1 + b = 5 → b = 3.`,`y = 2x + 3.`]},{q:`Taksi ücreti y = 4x + 10 ise 5 km için ücret?`,steps:[`x = 5 yazılır: 4·5 + 10 = 30 TL.`]},{q:`2x + 3 > 11 eşitsizliğini çöz.`,steps:[`3’ü karşıya at: 2x > 8.`,`2’ye böl: x > 4.`]}],reference:Ht(`Matematik`,`Nicelikler ve Değişimler`),questions:[tn(1,2,`x = 1, 2, 3, 4 iken y = 5, 8, 11, 14 olarak veriliyor. x ile y arasındaki bağıntı aşağıdakilerden hangisidir?`,[`y = 3x + 2`,`y = x + 4`,`y = 5x`,`y = 2x + 3`],0,`x bir artınca y 3 artıyor: a = 3. x = 1 için 3 + b = 5 → b = 2. Kontrol: x = 2 için 8 ✓.`),tn(2,1,`y = 4x + 10 bağıntısında x = 6 için y kaçtır?`,[`24`,`34`,`40`,`64`],1,`4·6 + 10 = 24 + 10 = 34.`),tn(3,2,`2x + 3 > 11 eşitsizliğinin çözümü hangisidir?`,[`x > 4`,`x < 4`,`x > 7`,`x < 7`],0,`3’ü karşıya at: 2x > 8; 2’ye böl: x > 4.`),tn(4,1,`Bir internet paketinde 20 TL sabit ücrete ek olarak her GB için 5 TL ödeniyor. 3 GB kullanan biri kaç TL öder?`,[`35`,`23`,`75`,`60`],0,`Ücret = 20 + 5·3 = 35 TL.`),tn(5,3,`Doğrusal bir ilişkide x bir artınca y 3 artıyor ve x = 0 iken y = 4’tür. x = 5 iken y kaçtır?`,[`19`,`15`,`24`,`22`],0,`y = 3x + 4. x = 5 için 3·5 + 4 = 19.`)]}),F({id:`m9-geometri`,subject:`mat`,grade:9,unit:`Tema 3: Geometrik Şekiller`,title:`Açılar ve paralel doğrular`,goal:`Doğru ve açı ilişkilerini kullanarak bilinmeyen açıları bulmak.`,objectives:[`Tümler, bütünler ve ters açıları kullanır.`,`Paralel doğruların kesenleriyle oluşan açıları tanır.`,`Üçgende iç ve dış açı ilişkisini kullanır.`],prereq:[`m8-ucgen`],minutes:30,difficulty:2,body:[`Tümler açılar toplamı 90°, bütünler açılar toplamı 180°’dir. Bir açının tümleri 90° − x, bütünleri 180° − x’tir.`,`İki doğru kesişince oluşan ters açılar birbirine eşittir; komşu açılar bütünlerdir (toplamları 180°).`,`Paralel iki doğruyu bir kesen kesince: yöndeş açılar eşit, iç ters açılar eşit, dış ters açılar eşit; yöndeş olmayan iç açılar (karşı durumlu) bütünlerdir.`,`Üçgende iç açılar toplamı 180°’dir. Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir.`],keyTerms:[{term:`Tümler açı`,def:`Toplamı 90° olan iki açı.`},{term:`Bütünler açı`,def:`Toplamı 180° olan iki açı.`},{term:`Ters açı`,def:`İki doğru kesişince karşılıklı oluşan eşit açılar.`},{term:`İç ters açı`,def:`Paralel doğrular arasında, kesenin zıt yanlarında oluşan eşit açılar.`}],worked:[{q:`35° nin tümleri kaç derecedir?`,steps:[`90 − 35 = 55°.`]},{q:`Paralel doğruları bir kesen kesiyor; bir iç ters açı 70° ise diğer iç ters açı?`,steps:[`İç ters açılar eşittir.`,`Diğeri de 70°.`]},{q:`Üçgenin iki iç açısı 50° ve 60°. Üçüncü köşedeki dış açı?`,steps:[`Üçüncü iç açı 180 − 110 = 70°.`,`Dış açı = 180 − 70 = 110° (ya da 50 + 60 = 110°).`]}],reference:Ht(`Matematik`,`Geometrik Şekiller`),questions:[nn(1,1,`35° lik açının tümleri kaç derecedir?`,[`145°`,`55°`,`65°`,`35°`],1,`Tümler açılar toplamı 90°: 90 − 35 = 55°.`),nn(2,1,`110° lik açının bütünleri kaç derecedir?`,[`70°`,`80°`,`250°`,`20°`],0,`Bütünler açılar toplamı 180°: 180 − 110 = 70°.`),nn(3,1,`İki doğru kesişiyor ve oluşan açılardan biri 50° dir. Bu açının karşısındaki (ters) açı kaç derecedir?`,[`130°`,`50°`,`40°`,`100°`],1,`Ters açılar eşittir.`),nn(4,2,`Paralel iki doğruyu bir kesen kesiyor. Bir iç ters açı 65° ise diğer iç ters açı kaç derecedir?`,[`25°`,`115°`,`65°`,`130°`],2,`İç ters açılar eşit olduğundan diğeri de 65°’dir.`),nn(5,3,`Bir üçgenin iki iç açısı 50° ve 60° dir. Üçüncü köşedeki dış açı kaç derecedir?`,[`70°`,`110°`,`130°`,`120°`],1,`Dış açı, kendisine komşu olmayan iki iç açının toplamıdır: 50 + 60 = 110°.`)]})],an=P(`t8-paragraf`,`tde`),on=P(`t8-cikarim`,`tde`),sn=P(`t8-anlam`,`tde`),cn=P(`t8-yazim`,`tde`),ln=P(`t9-dil`,`tde`),un=P(`t8-fiilimsi`,`tde`),dn=P(`t8-ogeler`,`tde`),fn=P(`t8-cati`,`tde`),pn=P(`t8-anlatim`,`tde`),mn=`Su, yeryüzündeki yaşamın temelidir. Bitkiler suyla büyür, hayvanlar suyla yaşar, insan vücudunun büyük bölümü sudan oluşur. Bu nedenle suyu israf etmemek hepimizin görevidir.`,hn=`Kuşlar göç ederken yönlerini bulmak için güneşten, yıldızlardan ve Dünya’nın manyetik alanından yararlanır. Bilim insanları bu yeteneğin nasıl çalıştığını hâlâ tam olarak çözebilmiş değildir.`,gn=`Selin, bütün gece yağan yağmurdan sonra sabah camdan baktığında bahçedeki fidanın yan yattığını gördü. Hemen montunu giyip dışarı koştu.`,_n=[F({id:`t8-paragraf`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Paragrafta Anlam`,title:`Paragrafta konu, ana düşünce ve yardımcı düşünce`,goal:`Bir paragrafın konusunu, ana düşüncesini ve yardımcı düşüncelerini ayırt etmek.`,objectives:[`Konu ile ana düşünceyi ayırır.`,`Yardımcı düşünceleri bulur.`,`Paragrafa uygun başlık seçer.`],minutes:30,difficulty:1,body:[`Konu, paragrafın “ne hakkında” olduğunu söyler (kısa bir ad: “Suyun önemi”). Ana düşünce ise yazarın o konuda vermek istediği asıl mesajdır (“Suyu israf etmemeliyiz.”).`,`Yardımcı düşünceler ana düşünceyi destekleyen gerekçeler, örnekler ve açıklamalardır. Ana düşünce bu yardımcı düşüncelerin vardığı sonuçtur.`,`Ana düşünceyi bulmak için: 1) paragrafı baştan sona oku, 2) “Yazar bana ne söylemek istiyor?” diye sor, 3) “bu nedenle”, “bu yüzden”, “sonuç olarak” gibi sonuç bildiren ifadelere bak. Çoğu zaman ana düşünce son cümlede yer alır; ama her zaman değil.`,`Dikkat: “yalnızca”, “tek”, “her zaman” gibi kesin ifadeler içeren seçenekler, paragraf bunu açıkça söylemiyorsa genellikle yanlıştır.`,`Başlık, paragrafın tamamını kapsayan kısa bir ad olmalıdır; paragrafın yalnızca bir kısmını anlatmamalıdır.`],keyTerms:[{term:`Konu`,def:`Paragrafın üzerinde durduğu şey.`},{term:`Ana düşünce`,def:`Yazarın asıl vermek istediği mesaj.`},{term:`Yardımcı düşünce`,def:`Ana düşünceyi destekleyen cümlelerin fikri.`}],worked:[{q:`“Su, yaşamın temelidir. Bitkiler suyla büyür, hayvanlar suyla yaşar. Bu nedenle suyu israf etmemeliyiz.” Ana düşünce nedir?`,steps:[`“Bu nedenle” ifadesi sonucu gösterir.`,`Sonuç: Suyu israf etmemeliyiz. Ana düşünce budur.`,`Bitki ve hayvanların suya bağlı olması yardımcı düşüncedir.`]}],reference:I,questions:[an(1,1,`Bu parçanın ana düşüncesi aşağıdakilerden hangisidir?`,[`Suyu israf etmemek hepimizin görevidir.`,`Bitkiler yalnızca suyla büyür.`,`İnsan vücudunun yarısı sudur.`,`Hayvanlar bitkilerden daha çok suya ihtiyaç duyar.`],0,`“Bu nedenle” ifadesiyle varılan sonuç ana düşüncedir. Diğerleri yardımcı düşünce ya da parçada olmayan yargılardır.`,{passage:mn}),an(2,2,`Aşağıdakilerden hangisi bu parçadaki yardımcı düşüncelerden biridir?`,[`Suyu israf etmemeliyiz.`,`İnsan vücudunun büyük bölümü sudan oluşur.`,`Su kıt bir kaynaktır.`,`Su tasarrufu zordur.`],1,`Yardımcı düşünce, ana düşünceyi destekleyen gerekçedir. İnsan vücudunun sudan oluşması suyun önemini gösteren bir gerekçedir.`,{passage:mn}),an(3,1,`Bu parça için aşağıdaki başlıklardan hangisi en uygundur?`,[`Bitkilerin Büyümesi`,`Suyun Önemi`,`İnsan Vücudu`,`Hayvanların Yaşamı`],1,`Başlık parçanın tamamını kapsamalıdır. Parça, suyun yaşam için önemini anlatır.`,{passage:mn}),an(4,2,`Bu parçaya göre aşağıdakilerden hangisi söylenebilir?`,[`Kuşlar yalnızca güneşe bakarak yön bulur.`,`Kuşların yön bulma yeteneği henüz tam olarak açıklanamamıştır.`,`Dünya’nın manyetik alanı kuşları rahatsız eder.`,`Bilim insanları göçü durdurmak istemektedir.`],1,`Son cümle, yeteneğin nasıl çalıştığının hâlâ tam çözülemediğini söyler. “Yalnızca” kesin ifadesi parçada yoktur.`,{passage:hn}),an(5,2,`Aşağıdakilerden hangisi bir paragrafın ana düşüncesini bulmak için en doğru yoldur?`,[`Yalnızca ilk cümleyi okumak`,`Paragrafın bütününde verilmek istenen asıl mesajı belirlemek`,`En uzun cümleyi seçmek`,`Sık geçen sözcüğü bulmak`],1,`Ana düşünce bütünden çıkar; yalnızca ilk cümleye ya da sık geçen sözcüğe bakmak yanıltabilir.`)]}),F({id:`t8-cikarim`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Paragrafta Anlam (çıkarım)`,title:`Çıkarım ve metin yorumlama`,goal:`Metinde açıkça yazanla, metinden çıkarılabilecek yargıyı ayırmak.`,objectives:[`Metinden mantıklı çıkarım yapar.`,`Kesin olarak çıkarılamayan yargıyı fark eder.`,`Tablo ve konuşma metnini yorumlar.`],prereq:[`t8-paragraf`],minutes:30,difficulty:2,body:[`Çıkarım, metinde doğrudan söylenmeyen ama verilenlerden mantıkla ulaşılan sonuçtur.`,`Soruyu doğru çözmek için seçeneği metinle karşılaştır: Metinde bunun kanıtı var mı? Yoksa bu bir tahmin mi?`,`Kesin çıkarım: metindeki bilgilerden doğrudan anlaşılır. Tahmin: gelecekte ne olacağına dair yargı; metin bunu söylemiyorsa kesin sayılmaz.`,`“Kesin olarak çıkarılamaz” diye sorulan sorularda metinde kanıtı olmayan seçeneği ara.`,`Tablo ve grafik yorumlarında sayıları dikkatle karşılaştır; “en çok”, “en az”, “yarısından fazla” gibi ifadeleri sayılarla doğrula.`],keyTerms:[{term:`Çıkarım`,def:`Verilenlerden mantıkla ulaşılan sonuç.`},{term:`Tahmin`,def:`Metinde kanıtı bulunmayan olası sonuç.`}],worked:[{q:`Selin sabah bahçedeki fidanın yan yattığını görüp hemen dışarı koştu. Selin hakkında ne çıkarılabilir?`,steps:[`Hemen koşması, fidanın durumunu önemsediğini gösterir.`,`Fidanın kurtulup kurtulmayacağı metinde yok; bu bir tahmin olur.`]}],reference:I,questions:[on(1,1,`Bu parçadan Selin hakkında aşağıdakilerden hangisi çıkarılabilir?`,[`Fidanın zarar görmesinden endişelenmiştir.`,`Yağmuru sevmemektedir.`,`Fidanı kendisi dikmiştir.`,`Bahçeyi satmak istemektedir.`],0,`Fidanın yan yattığını görünce hemen dışarı koşması, onun için endişelendiğini gösterir. Diğerleri metinde yoktur.`,{passage:gn}),on(2,2,`Bu parçadan aşağıdaki yargılardan hangisi kesin olarak çıkarılamaz?`,[`Gece yağmur yağmıştır.`,`Selin sabah bahçeye bakmıştır.`,`Fidan kurumuştur.`,`Selin dışarı çıkmıştır.`],2,`Fidanın yan yattığı yazılıdır; kuruduğu yazılı değildir.`,{passage:gn}),on(3,2,`Kütüphane görevlisi kitabı rafa koyarken “Bu kitabı son bir yıldır kimse almadı.” dedi. Bu sözden aşağıdakilerden hangisi çıkarılabilir?`,[`Kitap çok pahalıdır.`,`Kitap az ilgi görmüştür.`,`Kitap kaybolmuştur.`,`Kitap yeni basılmıştır.`],1,`Bir yıldır kimsenin almaması, kitabın az ilgi gördüğünü gösterir. Diğerleri için kanıt yoktur.`),on(4,2,`Mert: “Bu hafta sonu ders çalışmaktan başka planım yok.” Bu sözden aşağıdakilerden hangisi anlaşılır?`,[`Mert hafta sonu arkadaşlarıyla buluşacaktır.`,`Mert hafta sonu ders çalışmayı düşünmektedir.`,`Mert dersleri sevmemektedir.`,`Mert hafta sonu hiçbir şey yapmayacaktır.`],1,`“Ders çalışmaktan başka planım yok” sözü, ders çalışacağını gösterir.`),on(5,1,`Bu bilgiye göre aşağıdakilerden hangisi doğrudur?`,[`En çok seçilen spor basketboldur.`,`En çok seçilen spor futboldur.`,`Voleybolu seçenlerin sayısı basketboldan fazladır.`,`Öğrencilerin yarısı voleybolu seçmiştir.`],1,`12 öğrenci futbolu seçmiştir ve diğerlerinden fazladır (12 > 5 > 3).`,{passage:`Sınıftaki 20 öğrencinin 12’si en sevdiği spor olarak futbolu, 5’i basketbolu, 3’ü voleybolu seçti.`})]}),F({id:`t8-anlam`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Sözcükte ve Cümlede Anlam`,title:`Sözcükte ve cümlede anlam`,goal:`Gerçek, mecaz ve terim anlamı; deyim ve atasözü; cümleler arası anlam ilişkilerini ayırt etmek.`,objectives:[`Gerçek ve mecaz anlamı ayırır.`,`Deyim ve atasözlerinin anlamını bulur.`,`Neden-sonuç, amaç-sonuç ve koşul cümlelerini ayırt eder.`],prereq:[`t8-paragraf`],minutes:30,difficulty:2,body:[`Gerçek anlam: sözcüğün ilk akla gelen, temel anlamı (“taşı kırdı”). Mecaz anlam: asıl anlamından uzaklaşarak başka bir anlamda kullanılması (“kalbini kırdı”).`,`Terim anlam: bir bilim, sanat veya meslek dalına özgü anlam (“kök” matematikte, “çarpan”).`,`Deyim, birkaç sözcüğün birleşerek kazandığı kalıplaşmış anlamdır (“gözden düşmek” = itibarını kaybetmek). Atasözü ise öğüt veren kalıplaşmış cümledir (“Damlaya damlaya göl olur.”).`,`Neden-sonuç: “…-dığı için”, “…-diği için”, “çünkü”, “bu yüzden”. Amaç-sonuç: “…-mek için”, “…-sin diye”. Koşul: “…-sa / …-se”, “…-ırsan”. Karşılaştırma: “daha”, “…-den çok”.`,`Zıt anlamlı sözcükler birbirinin karşıtıdır (cömert ↔ cimri); eş anlamlılar aynı anlamdadır (çabuk ≈ hızlı).`],keyTerms:[{term:`Mecaz anlam`,def:`Sözcüğün asıl anlamından uzaklaşarak kazandığı anlam.`},{term:`Deyim`,def:`Kalıplaşmış, genellikle gerçek anlamından uzak söz öbeği.`},{term:`Atasözü`,def:`Öğüt veren, kalıplaşmış sözler.`}],worked:[{q:`“Bu valiz çok ağır.” ile “Sözleri kalbine ağır geldi.” cümlelerindeki “ağır”ı karşılaştır.`,steps:[`Birincide gerçek: ağırlığı fazla.`,`İkincide mecaz: üzücü, zor geldi.`]},{q:`“Hava soğuk olduğu için montunu giydi.” cümlesi hangi ilişkiyi kurar?`,steps:[`“…-dığı için” nedeni belirtir.`,`Neden: hava soğuk; sonuç: montunu giydi.`]}],reference:I,questions:[sn(1,1,`Aşağıdaki cümlelerin hangisinde “ağır” sözcüğü mecaz anlamda kullanılmıştır?`,[`Bu valiz çok ağır.`,`Çocuğun sözleri babasının kalbine ağır geldi.`,`Ağır bir demir kapı açıldı.`,`Sırtında ağır bir çanta taşıyordu.`],1,`“Söz ağır gelmek” üzmek, incitmek anlamındadır: mecazdır. Diğerlerinde ağırlığı fazla anlamında gerçek anlamdadır.`),sn(2,1,`“Cömert” sözcüğünün zıt anlamlısı aşağıdakilerden hangisidir?`,[`Dürüst`,`Cimri`,`Çalışkan`,`Kibar`],1,`Cömert, vermekten çekinmeyen; cimri ise vermekten kaçınandır.`),sn(3,2,`“Damlaya damlaya göl olur.” atasözünün anlamı aşağıdakilerden hangisidir?`,[`Küçük birikimler zamanla büyür.`,`Göller yağmurla dolar.`,`Su israf edilmemelidir.`,`Suyun miktarı hızla artar.`],0,`Atasözü, küçük birikimlerin zamanla büyük sonuçlar verdiğini söyler.`),sn(4,2,`Aşağıdaki cümlelerin hangisinde koşul-sonuç ilişkisi vardır?`,[`Sınavı kazanmak için çok çalıştı.`,`Çok çalışırsan başarılı olursun.`,`Yorgun olduğu için erken uyudu.`,`Bu çanta öbüründen daha hafif.`],1,`“-sa/-se/-ırsan” kalıbı koşulu belirtir: çok çalışırsan (koşul) → başarılı olursun (sonuç).`),sn(5,2,`Aşağıdaki cümlelerin hangisinde amaç-sonuç ilişkisi vardır?`,[`Sağlıklı kalmak için her gün yürüyüş yapıyor.`,`Yağmur yağdığı için maç ertelendi.`,`Erken kalkarsan otobüse yetişirsin.`,`Ayşe, Ali’den daha uzundur.`],0,`“…-mek için” amacı gösterir: sağlıklı kalmak (amaç) → her gün yürüyüş (sonuç/eylem).`)]}),F({id:`t8-yazim`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Yazım Kuralları ve Noktalama`,title:`Yazım kuralları ve noktalama`,goal:`Sık yapılan yazım ve noktalama hatalarını tanıyıp düzeltmek.`,objectives:[`“de/da”, “mi” ve “her şey / bugün” gibi yazımları bilir.`,`Büyük harf kuralını uygular.`,`Noktalama işaretlerini yerinde kullanır.`],minutes:25,difficulty:1,body:[`“de/da” bağlacı ayrı yazılır: “Ben de geleceğim.” Bulunma hâli eki bitişik yazılır: “Evde kaldım.”`,`Soru eki “mi” ayrı yazılır: “Geliyor musun?”, “Bu kitabı okudun mu?”`,`“Her şey”, “her gün” ayrı; “bugün”, “herkes” bitişik yazılır. “Yalnız” (yanlız değil), “yanlış” (yalnış değil).`,`Büyük harf: cümle başında, özel adlarda (Ali, Ankara, Atatürk Barajı). Cins adlar (park, okul) küçük yazılır: “Dün parka gittik.”`,`Soru cümlesi soru işaretiyle (?), heyecan ve seslenme ünlem ile (!) biter. İki nokta, açıklama veya sıralama öncesinde kullanılır: “Çantama şunları koydum: kitap, defter, kalem.”`,`Virgül: eş görevli sözcükleri ayırır (Ali, Ayşe ve Can), sıralı cümleleri ve seslenmeleri ayırır.`],keyTerms:[{term:`Özel ad`,def:`Tek bir varlığı gösteren ad; büyük harfle başlar.`},{term:`Cins ad`,def:`Aynı türdeki varlıkların ortak adı (kitap, şehir).`}],worked:[{q:`“Sende bizimle gel.” cümlesindeki yazım hatasını bul.`,steps:[`“Sen de bizimle gel” anlamı vardır; “de” bağlaçtır, ayrı yazılır.`,`Doğrusu: “Sen de bizimle gel.”`]}],reference:I,questions:[cn(1,1,`Aşağıdaki cümlelerin hangisinde yazım yanlışı yoktur?`,[`Herşey yolunda gitti.`,`Bu gün hava çok güzel.`,`Her gün kitap okurum.`,`Sende bizimle gel.`],2,`“Her şey” ve “her gün” ayrı, “bugün” bitişik yazılır. “Sen de” bağlaç olduğu için ayrı yazılır.`),cn(2,2,`Aşağıdaki cümlelerin hangisinde noktalama yanlışı vardır?`,[`Dün, arkadaşımla sinemaya gittim.`,`Ali, Ayşe ve Can geldi.`,`Kaç yaşındasın.`,`Ne kadar güzel bir gün!`],2,`Soru cümlesi soru işaretiyle bitmelidir: “Kaç yaşındasın?”`),cn(3,1,`Hangi cümlede soru eki “mi” yanlış yazılmıştır?`,[`Bugün okula gidecek misin?`,`Bu kitabı okudun mu?`,`Geliyormusun?`,`Hava soğuk mu?`],2,`Soru eki ayrı yazılır: “Geliyor musun?”`),cn(4,2,`Aşağıdaki cümlelerin hangisinde büyük harf kullanımı yanlıştır?`,[`Ali, Ankara’da yaşıyor.`,`Dün Arkadaşımla sinemaya gittim.`,`Atatürk Barajı çok büyüktür.`,`Ece, İzmir’e taşındı.`],1,`“Arkadaşımla” cins addır ve cümle ortasında büyük yazılmaz.`),cn(5,1,`Aşağıdaki sözcüklerden hangisi doğru yazılmıştır?`,[`Yanlız`,`Yalnız`,`Yalnis`,`Yanlis`],1,`Doğru yazım “yalnız”dır.`)]}),F({id:`t8-fiilimsi`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Fiilimsiler`,title:`Fiilimsiler: isim-fiil, sıfat-fiil, zarf-fiil`,goal:`Fiilimsileri türlerine göre ayırt etmek.`,objectives:[`İsim-fiil, sıfat-fiil ve zarf-fiili ayırt eder.`,`Fiilimsi eklerini tanır.`,`Fiilimsinin cümledeki görevini bulur.`],minutes:30,difficulty:2,body:[`Fiilimsi, fiil kökünden türeyen ama cümlede yüklem olmayan (isim, sıfat, zarf görevi taşıyan) sözcüktür.`,`İsim-fiil (-ma/-me, -mak/-mek, -ış/-iş): fiili isim gibi kullanır. “Yüzmek sağlığa yararlıdır.” “Okuma alışkanlığı kazandı.”`,`Sıfat-fiil (-an/-en, -dık/-dik, -ecek/-acak, -mış/-miş, -mez/-maz, -ası/-esi): bir ismi niteler. “Koşan çocuk yoruldu.” “Okuduğum kitap güzeldi.”`,`Zarf-fiil (-ıp/-ip, -arak/-erek, -ken, -ınca/-ince, -dıkça/-dikçe, -madan/-meden): fiili zarf gibi niteler. “Gülerek geldi.” “Eve gelince seni arayacağım.”`,`Ayırt etme ipucu: Fiilimsi cümlenin yüklemi değildir; cümlede ayrıca bir yüklem bulunur. Sıfat-fiilde sorulan “nasıl/hangi?”, zarf-fiilde “nasıl/ne zaman?”, isim-fiilde “ne?” gibi sorular kullanılır.`],keyTerms:[{term:`İsim-fiil`,def:`Fiilden türeyen isim görevli fiilimsi.`},{term:`Sıfat-fiil`,def:`İsmi niteleyen fiilimsi.`},{term:`Zarf-fiil`,def:`Fiili niteleyen fiilimsi.`}],worked:[{q:`“Gülerek içeri girdi.” cümlesindeki fiilimsiyi bul.`,steps:[`“-erek” eki var.`,`“Nasıl girdi?” → gülerek: zarf-fiil.`]}],reference:I,questions:[un(1,1,`“Yüzmek sağlığa yararlıdır.” cümlesindeki fiilimsi hangi türdendir?`,[`İsim-fiil`,`Sıfat-fiil`,`Zarf-fiil`,`Fiilimsi yoktur`],0,`“Yüzmek” fiili isim gibi kullanır (özne olmuş): isim-fiil.`),un(2,1,`“Koşan çocuk yoruldu.” cümlesindeki “koşan” sözcüğü hangi türdendir?`,[`İsim-fiil`,`Sıfat-fiil`,`Zarf-fiil`,`Yüklem`],1,`“Koşan” çocuğu niteler: sıfat-fiil.`),un(3,2,`“Gülerek içeri girdi.” cümlesindeki fiilimsi hangisidir?`,[`Gülerek (zarf-fiil)`,`İçeri (isim-fiil)`,`Girdi (sıfat-fiil)`,`Gülerek (sıfat-fiil)`],0,`“Nasıl girdi?” sorusunun cevabı “gülerek”: zarf-fiil. “Girdi” yüklemdir.`),un(4,2,`Aşağıdaki cümlelerin hangisinde sıfat-fiil vardır?`,[`Okuduğum kitap çok güzeldi.`,`Eve gelince seni arayacağım.`,`Koşmak bana iyi gelir.`,`Gülerek bana baktı.`],0,`“Okuduğum” kitabı niteler: sıfat-fiil (-dık). “Gelince” ve “gülerek” zarf-fiil, “koşmak” isim-fiildir.`),un(5,2,`“Eve gelince seni arayacağım.” cümlesindeki fiilimsi hangisidir?`,[`Gelince (zarf-fiil)`,`Arayacağım (isim-fiil)`,`Eve (sıfat-fiil)`,`Seni (zarf-fiil)`],0,`“Ne zaman arayacağım?” → gelince: zarf-fiil (-ınca). “Arayacağım” yüklemdir.`)]}),F({id:`t8-ogeler`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Cümlenin Ögeleri`,title:`Cümlenin ögeleri`,goal:`Cümlede yüklem, özne, nesne, dolaylı tümleç ve zarf tümlecini bulmak.`,objectives:[`Yüklemi bulur.`,`Özne ve nesneyi ayırt eder.`,`Dolaylı tümleç ile zarf tümlecini ayırt eder.`],minutes:30,difficulty:2,body:[`Yüklem: cümlenin eylemini veya durumunu bildiren öğe, genellikle sonda yer alır (“okudu”, “güzeldir”).`,`Özne: yüklemin bildirdiği işi yapan öğe; “Kim?/Ne?” sorusuyla bulunur. Nesne: yüklemin bildirdiği işten etkilenen öğe; “Neyi/Kimi?” (belirtili) veya “Ne?” (belirtisiz) sorularıyla bulunur.`,`Dolaylı tümleç: yönelme (-e/-a), bulunma (-de/-da) veya ayrılma (-den/-dan) hâli eki alan ve “Kime/Nereye/Nerede/Neden?” sorularına cevap veren öğe.`,`Zarf tümleci: yüklemi zaman, durum, yer, miktar bakımından niteler; “Ne zaman?”, “Nasıl?”, “Ne kadar?” sorularının cevabıdır.`,`Örnek: “Ali dün kütüphanede kitap okudu.” Yüklem: okudu. Özne: Ali. Nesne: kitap. Zarf tümleci: dün. Dolaylı tümleç: kütüphanede (bulunma hâli).`],keyTerms:[{term:`Yüklem`,def:`Cümlenin eylem/durum bildiren öğesi.`},{term:`Özne`,def:`Eylemi yapan.`},{term:`Nesne`,def:`Eylemden etkilenen.`}],worked:[{q:`“Çocuk annesine çiçek verdi.” cümlesindeki dolaylı tümleç?`,steps:[`“Kime verdi?” → annesine (yönelme hâli).`]}],reference:I,questions:[dn(1,1,`“Ali dün kütüphanede kitap okudu.” cümlesinin yüklemi hangisidir?`,[`Ali`,`Kitap`,`Okudu`,`Dün`],2,`Cümlenin eylemini bildiren sözcük “okudu”dur.`),dn(2,1,`“Çocuk annesine çiçek verdi.” cümlesindeki dolaylı tümleç hangisidir?`,[`Çocuk`,`Annesine`,`Çiçek`,`Verdi`],1,`“Kime verdi?” → annesine; yönelme hâli eki aldığı için dolaylı tümleçtir.`),dn(3,2,`“Öğrenciler sınıfa sessizce girdi.” cümlesindeki zarf tümleci hangisidir?`,[`Öğrenciler`,`Sınıfa`,`Sessizce`,`Girdi`],2,`“Nasıl girdi?” → sessizce: zarf tümleci. “Sınıfa” yönelme hâlindeki dolaylı tümleçtir.`),dn(4,2,`“Annem akşam yemeğini hazırladı.” cümlesindeki belirtili nesne hangisidir?`,[`Annem`,`Akşam`,`Yemeğini`,`Hazırladı`],2,`“Neyi hazırladı?” → yemeğini (belirtme hâli eki -ni).`),dn(5,1,`“Kitabı masaya bıraktı.” cümlesinde özne için ne söylenebilir?`,[`Kitabı`,`Masaya`,`Cümlede gizli özne vardır (O).`,`Bıraktı`],2,`Cümlede açıkça yazılı özne yok; “bıraktı” fiilinin öznesi gizlidir (o).`)]}),F({id:`t8-cati`,subject:`tde`,grade:8,unit:`LGS 8. sınıf: Cümle Çeşitleri ve Fiilde Çatı`,title:`Cümle çeşitleri ve fiilde çatı`,goal:`Cümleleri yüklemine, anlamına, yapısına ve dizilişine göre sınıflandırmak; fiillerin çatısını bulmak.`,objectives:[`Fiil ve isim cümlesini ayırt eder.`,`Kurallı ve devrik cümleyi ayırt eder.`,`Etken, edilgen, dönüşlü ve işteş fiili tanır.`],prereq:[`t8-ogeler`],minutes:35,difficulty:2,body:[`Yüklemine göre: Fiil cümlesi (yüklem fiil: “Çocuk koştu.”), isim cümlesi (yüklem isim: “Hava çok güzel.”).`,`Anlamına göre: olumlu, olumsuz, soru, ünlem cümlesi. Yapısına göre: basit, birleşik, sıralı, bağlı cümle. Dizilişine göre: kurallı (yüklem sonda) ve devrik (yüklem sonda değil: “Geldi sonunda yaz.”).`,`Fiilde çatı: Özneye göre etken (özne işi yapar: “Kapıyı açtı.”), edilgen (özne belli değil: “Kapı açıldı.” -ıl/-il eki), dönüşlü (özne işi kendisine yapar: “Ali yıkandı.” -ın/-in), işteş (birlikte yapılır: “Çocuklar yarıştı.” -ış/-iş).`,`Nesneye göre: geçişli fiil nesne alır (“kitabı okudu”), geçişsiz fiil nesne almaz (“koştu”).`],keyTerms:[{term:`Edilgen`,def:`Öznesi işi yapan değil, işten etkilenen çatı.`},{term:`Devrik cümle`,def:`Yüklemi sonda olmayan cümle.`}],worked:[{q:`“Pencere açıldı.” fiilinin çatısı?`,steps:[`-ıl eki var; işi yapan belli değil.`,`Edilgen çatı.`]}],reference:I,questions:[fn(1,1,`“Kapı açıldı.” cümlesindeki fiilin çatısı aşağıdakilerden hangisidir?`,[`Etken`,`Edilgen`,`Dönüşlü`,`İşteş`],1,`-ıl eki edilgenlik yapar; işi yapan belli değildir.`),fn(2,2,`“Çocuklar bahçede yarıştı.” cümlesindeki fiilin çatısı aşağıdakilerden hangisidir?`,[`Etken`,`Edilgen`,`Dönüşlü`,`İşteş`],3,`“Yarıştı” birden fazla kişinin birlikte yaptığı bir iş bildirir (-ış eki): işteş.`),fn(3,2,`Aşağıdaki cümlelerin hangisi devrik cümledir?`,[`Çocuklar parkta oynadı.`,`Geldi sonunda yaz.`,`Ali kitabını aldı.`,`Bugün hava güzel.`],1,`Yüklem (geldi) cümlenin başında; yüklemi sonda olmayan cümle devriktir.`),fn(4,1,`“Dün gelen misafirler çok yorgundu.” cümlesinin yüklemi nedir ve cümle hangi türdendir?`,[`Gelen; fiil cümlesi`,`Yorgundu; isim cümlesi`,`Misafirler; isim cümlesi`,`Dün; fiil cümlesi`],1,`Yüklem “yorgundu” bir isim soylu sözcüktür (ek fiil aldı): isim cümlesi.`),fn(5,2,`“Ali yıkan ,`I have to ____ the table before dinner.`,[`do`,`set`,`make`,`put on`],1,`“Set the table” sofrayı hazırlamak demektir.`),An(4,2,`How often do you visit your grandparents?`,[`Twice a month.`,`At eight o’clock.`,`By bus.`,`Because I like them.`],0,`“How often” sıklık sorar: twice a month (ayda iki kez).`),An(5,2,`Which sentence is correct?`,[`My father cooks dinner on Sundays.`,`My father cook dinner on Sundays.`,`My father cooking dinner on Sundays.`,`My father is cooks dinner on Sundays.`],0,`Geniş zaman, he/she/it → cooks.`)]})],Pn=P(`f9-bilim`,`fiz`),Fn=P(`f9-hareket`,`fiz`),In=P(`f9-kuvvet`,`fiz`),Ln=P(`f9-enerji`,`fiz`),Rn=[F({id:`f9-bilim`,subject:`fiz`,grade:9,unit:`Ünite 1: Fizik Bilimi ve Kariyer Keşfi`,title:`Fizik bilimi, büyüklükler ve birimler`,goal:`Fiziksel büyüklükleri sınıflandırmak, SI birimlerini bilmek ve birim dönüşümü yapmak.`,objectives:[`Temel ve türetilmiş büyüklükleri ayırır.`,`Skaler ve vektörel büyüklükleri ayırt eder.`,`Birim dönüşümü yapar.`],minutes:30,difficulty:1,body:[`Fizik, madde ve enerjiyi ve aralarındaki etkileşimleri inceleyen temel bilim dalıdır. Gözlem, ölçme ve deneyle bilgi üretir.`,`Temel büyüklükler (SI): uzunluk (metre, m), kütle (kilogram, kg), zaman (saniye, s), sıcaklık (kelvin, K). Diğer büyüklükler bunlardan türetilir: hız (m/s), alan (m²), hacim (m³), kuvvet (N).`,`Skaler büyüklük yalnızca sayı + birimle belirtilir (kütle, zaman, sürat). Vektörel büyüklük ayrıca yön ister (yer değiştirme, hız, kuvvet).`,`Birim dönüşümü: 1 km = 1000 m; 1 saat = 3600 s. km/h → m/s için 3,6’ya bölünür: 36 km/h = 10 m/s.`,`Ölçme, bir büyüklüğü birimiyle karşılaştırmaktır; her ölçümde bir miktar belirsizlik vardır.`],keyTerms:[{term:`SI`,def:`Uluslararası Birim Sistemi.`},{term:`Skaler`,def:`Yalnızca büyüklüğü olan nicelik.`},{term:`Vektörel`,def:`Büyüklük ve yönü olan nicelik.`}],worked:[{q:`72 km/h kaç m/s’dir?`,steps:[`km/h → m/s için 3,6’ya bölünür.`,`72 ÷ 3,6 = 20 m/s.`]}],reference:Ht(`Fizik`,`Fizik Bilimi ve Kariyer Keşfi`),ques k enerji = kinetik + potansiyel enerji. Sürtünmesiz ortamda mekanik enerji korunur: serbest düşen cismin potansiyel enerjisi azalırken kinetik enerjisi artar.`,`Güç: birim zamanda yapılan iş. P = W ÷ t (birim watt, W). Güç büyükse aynı iş daha kısa sürede yapılır.`],keyTerms:[{term:`Joule (J)`,def:`İş ve enerji birimi.`},{term:`Kinetik enerji`,def:`Hareketten gelen enerji.`},{term:`Potansiyel enerji`,def:`Konumdan (yükseklikten) gelen enerji.`},{term:`Watt (W)`,def:`Güç birimi: J/s.`}],worked:[{q:`2 kg kütleli cisim 3 m/s hızla gidiyor. Kinetik enerjisi?`,steps:[`Ek = ½ · 2 · 3² = ½ · 2 · 9 = 9 J.`]},{q:`600 J’lük iş 20 saniyede yapılıyorsa güç?`,steps:[`P = W ÷ t = 600 ÷ 20 = 30 W.`]}],reference:Ht(`Fizik`,`Enerji`),questions:[Ln(1,1,`10 N’luk kuvvet bir cismi kuvvet yönünde 5 m götürüyor. Yapılan iş kaç J’dür?`,[`2`,`15`,`50`,`5`],2,`W = F · d = 10 · 5 = 50 J.`),Ln(2,2,`Kütlesi 2 kg olan bir cisim 3 m/s hızla hareket ediyor. Kinetik enerjisi kaç J’dür?`,[`6`,`9`,`18`,`3`],1,`Ek = ½ · m · v² = ½ · 2 · 9 = 9 J.`),Ln(3,2,`Kütlesi 3 kg olan cisim 4 m yükseğe çıkarılıyor. Potansiyel enerjisi kaç J’dür? (g = 10 m/s²)`,[`12`,`30`,`120`,`7`],2,`Ep = m · g · h = 3 · 10 · 4 = 120 J.`),Ln(4,1,`600 J’lük iş 20 saniyede yapılıyorsa gücü kaç W’tır?`,[`30`,`12000`,`20`,`600`],0,`P = W ÷ t = 600 ÷ 20 = 30 W.`),Ln(5,2,`Sürtünmesiz ortamda serbest düşen bir cisimde enerji dönüşümü nasıldır?`,[`Kinetik enerji potansiyel enerjiye dönüşür.`,`Potansiyel enerji azalır, kinetik enerji artar.`,`Her iki enerji de artar.`,`Her iki enerji de sıfır olur.`],1,`Cisim aşağı indikçe yüksekliği azalır (Ep azalır) ve hızı artar (Ek artar); toplam mekanik enerji korunur.`)]})],zn=P(`k9-madde`,`kim`),Bn=P(`k9-atom`,`kim`),Vn=P(`k9-etkilesim`,`kim`),Hn=Ht(`Kimya`,`Etkileşim / Çeşitlilik / Sürdürülebilirlik`),Un=[F({id:`k9-madde`,subject:`kim`,grade:9,unit:`Madde ve sınıflandırılması`,title:`Maddenin sınıflandırılması ve ayırma yöntemleri`,goal:`Saf madde ve karışımları ayırt etmek, fiziksel ve kimyasal değişimi tanımak, ayırma yöntemi seçmek.`,objectives:[`Element, bileşik ve karışımı ayırt eder.`,`Homojen ve heterojen karışımı tanır.`,`Fiziksel ve kimyasal değişimi ayırt eder.`,`Uygun ayırma yöntemini seçer.`],minutes:30,difficulty:1,body:[`Madde saf madde ve karışım olarak ikiye ayrılır. Saf madde: element (tek tür atom: oksijen, demir) ve bileşik (farklı atomların belirli oranda birleşmesi: su, tuz, karbondioksit).`,`Karışım: birden çok maddenin kendi özelliklerini koruyarak bir araya gelmesidir. Homojen karışımda her yer aynıdır (tuzlu su, hava). Heterojen karışımda bileşenler ayırt edilir (çamurlu su, zeytinyağı-su).`,`Fiziksel değişimde madde türü değişmez (erime, buharlaşma, çözünme). Kimyasal değişimde yeni madde oluşur (paslanma, yanma, süt ekşimesi).`,`Ayırma yöntemleri: süzme (katı-sıvı), mıknatısla ayırma (demir içeren karışım), buharlaştırma (çözünmüş katı), damıtma (kaynama noktası farkı), eleme (tane boyutu farkı).`],keyTerms:[{term:`Element`,def:`Tek tür atomdan oluşan saf madde.`},{term:`Bileşik`,def:`Farklı atomların sabit oranla birleşmesiyle oluşan saf madde.`},{term:`Homojen karışım`,def:`Her yerinde aynı özellikte karışım.`}],worked:[{q:`Demir tozu-kum karışımı nasıl ayrılır?`,steps:[`Demir mıknatıs tarafından çekilir, kum çekilmez.`,`Yöntem: mıknatısla ayırma.`]}],reference:Hn,questions:[zn(1,1,`Aşağıdakilerden hangisi saf maddedir?`,[`Hava`,`Deniz suyu`,`Saf su`,`Çorba`],2,`Saf su yalnızca H₂O’dan oluşan bir bileşiktir. Diğerleri karışımdır.`),zn(2,1,`Aşağıdakilerden hangisi homojen karışımdır?`,[`Çamurlu su`,`Tuzlu su`,`Zeytinyağı-su`,`Kum-su`],1,`Tuz suda tamamen çözünür; her yerinde aynı görünür.`),zn(3,1,`Aşağıdakilerden hangisi kimyasal değişimdir?`,[`Demirin paslanması`,`Buzun erimesi`,`Suyun buharlaşması`,`Tuzun suda çözünmesi`],0,`Paslanmada yeni bir madde (demir oksit) oluşur. Diğerleri fiziksel değişimdir.`),zn(4,2,`Demir tozu ve kum karışımını ayırmak için hangi yöntem uygundur?`,[`Süzme`,`Mıknatıs kullanma`,`Buharlaştırma`,`Damıtma`],1,`Demir mıknatıs tarafından çekilir; kum çekilmez.`),zn(5,1,`Aşağıdakilerden hangisi elementtir?`,[`Su`,`Karbondioksit`,`Oksijen`,`Yemek tuzu`],2,`Oksijen tek tür atomdan oluşur. Diğerleri bileşiktir.`)]}),F({id:`k9-atom`,subject:`kim`,grade:9,unit:`Atom ve periyodik sistem`,title:`Atomun yapısı ve periyodik tablo`,goal:`Atomun yapı taşlarını, atom ve kütle numarasını ve periyodik tabloda grup mantığını kavramak.`,objectives:[`Proton, nötron, elektron sayısını bulur.`,`İzotopu tanımlar.`,`Aynı grup elementlerin benzerliğini yorumlar.`],prereq:[`k9-madde`],minutes:30,difficulty:2,body:[`Atom çekirdek ve elektronlardan oluşur. Çekirdekte pozitif yüklü proton ve yüksüz nötron bulunur; elektronlar negatif yüklüdür ve çekirdeğin çevresinde dolaşır.`,`Atom numarası = proton sayısı. Nötr atomda elektron sayısı proton sayısına eşittir. Kütle numarası = proton + nötron sayısı. Nötron sayısı = kütle numarası − atom numarası.`,`İzotop: Proton sayıları aynı (aynı element), nötron sayıları farklı atomlardır.`,`Periyodik tabloda elementler artan atom numarasına göre dizilir. Dikey sütunlar (grup) benzer kimyasal özellik gösterir; yatay sıralar periyotlardır.`],keyTerms:[{term:`Atom numarası`,def:`Proton sayısı.`},{term:`Kütle numarası`,def:`Proton + nötron sayısı.`},{term:`İzotop`,def:`Proton sayısı aynı, nötron sayısı farklı atomlar.`}],worked:[{q:`Atom numarası 11, kütle numarası 23 olan atomda nötron sayısı?`,steps:[`Nötron = 23 − 11 = 12.`]}],reference:Hn,questions:[Bn(1,1,`Atom numarası 17 olan nötr bir atomun elektron sayısı kaçtır?`,[`17`,`34`,`0`,`18`],0,`Nötr atomda elektron sayısı proton (atom numarası) sayısına eşittir.`),Bn(2,2,`Atom numarası 11, kütle numarası 23 olan atomun nötron sayısı kaçtır?`,[`11`,`12`,`23`,`34`],1,`Nötron = kütle numarası − atom numarası = 23 − 11 = 12.`),Bn(3,1,`Aşağıdaki taneciklerden hangisi pozitif yüklüdür?`,[`Elektron`,`Nötron`,`Proton`,`Hiçbiri`],2,`Proton + yüklü, elektron − yüklü, nötron yüksüzdür.`),Bn(4,2,`İzotop atomlar için aşağıdakilerden hangisi doğrudur?`,[`Proton sayıları farklı, nötron sayıları aynıdır.`,`Proton sayıları aynı, nötron sayıları farklıdır.`,`Elektron sayıları farklı, proton sayıları aynıdır.`,`Kütle numaraları aynıdır.`],1,`İzotoplar aynı elementin atomlarıdır (proton sayısı aynı) ve nötron sayıları farklıdır.`),Bn(5,2,`Periyodik tabloda aynı grupta (dikey sütunda) bulunan elementler için ne söylenebilir?`,[`Benzer kimyasal özellik gösterirler.`,`Atom numaraları aynıdır.`,`Hepsi katıdır.`,`Hepsi gazdır.`],0,`Aynı gruptaki elementlerin benzer kimyasal özellikleri vardır.`)]}),F({id:`k9-etkilesim`,subject:`kim`,grade:9,unit:`Kimyasal türler arası etkileşimler`,title:`Kimyasal bağlar: iyonik ve kovalent`,goal:`Atomların bağ yapma eğilimini ve iyonik ile kovalent bağı ayırt etmek.`,objectives:[`Oktet kuralını açıklar.`,`İyonik ve kovalent bağı ayırt eder.`,`Basit iyon oluşumunu yorumlar.`],prereq:[`k9-atom`],minutes:30,difficulty:2,body:[`Atomlar son yörüngelerini kararlı hâle (genellikle 8 elektron, helyumda 2) getirmek için bağ yapar. Soygazlar (He, Ne, Ar) bu yapıdadır ve çok kararlıdır.`,`İyonik bağ: elektron veren (metal) ile elektron alan (ametal) arasında oluşur. Örnek: NaCl. Na bir elektron verip Na⁺, Cl bir elektron alıp Cl⁻ olur.`,`Kovalent bağ: elektronların ametal atomlarca ortaklaşa kullanılmasıdır. Örnek: H₂O, CO₂, H₂.`,`İyon: elektron alıp vererek yüklü hâle gelmiş atomdur. Elektron veren pozitif (katyon), elektron alan negatif (anyon) olur.`],keyTerms:[{term:`Oktet`,def:`Son yörüngede 8 elektron.`},{term:`İyonik bağ`,def:`Elektron alışverişiyle oluşan bağ.`},{term:`Kovalent bağ`,def:`Elektron ortaklaşmasıyla oluşan bağ.`}],worked:[{q:`NaCl’deki bağ türü nedir?`,steps:[`Na metal, Cl ametaldir.`,`Elektron alışverişi olur: iyonik bağ.`]}],reference:Hn,questions:[Vn(1,1,`Sodyum klorür (NaCl, yemek tuzu) bileşiğinde hangi bağ türü vardır?`,[`İyonik bağ`,`Kovalent bağ`,`Hidrojen bağı`,`Metalik bağ`],0,`Metal (Na) ile ametal (Cl) arasında elektron alışverişi eyle yaklaşık sabit tutulması.`],keyTerms:[{term:`Hipotez`,def:`Sınanabilir tahmin.`},{term:`Homeostasi`,def:`İç dengenin korunması.`},{term:`Ototrof`,def:`Kendi besinini üreten canlı.`}],worked:[{q:`Bitkiler neden ototrofdur?`,steps:[`Fotosentezle ışık enerjisini kullanıp besin üretirler.`]}],reference:Ht(`Biyoloji`,`Yaşam`),questions:[Wn(1,1,`Aşağıdakilerden hangisi tüm canlıların ortak özelliğidir?`,[`Fotosentez yapma`,`Hareket etme`,`Hücresel yapıdan oluşma`,`Sinir sistemine sahip olma`],2,`Bütün canlılar hücrelerden oluşur. Fotosentez yalnızca bazı canlılarda, sinir sistemi yalnızca hayvanlarda vardır; bitkiler hareket etmeyebilir.`),Wn(2,1,`Kendi besinini üretebilen canlılara ne ad verilir?`,[`Heterotrof`,`Ototrof`,`Parazit`,`Çürükçül`],1,`Kendi besinini üreten canlılar ototroftur (bitkiler gibi).`),Wn(3,1,`Bitkileri inceleyen biyoloji dalı aşağıdakilerden hangisidir?`,[`Zooloji`,`Botanik`,`Ekoloji`,`Mikrobiyoloji`],1,`Botanik bitkileri, zooloji hayvanları inceler.`),Wn(4,2,`Bilimsel yöntemde “hipotez” ne demektir?`,[`Deney sonucunda elde edilen kesin bilgi`,`Sınanabilir bir tahmin`,`Gözlem yapma`,`Rapor yazma`],1,`Hipotez, deneyle sınanabilecek geçici bir açıklama/tahmindir.`),Wn(5,2,`Vücut sıcaklığının terleme ve titremeyle yaklaşık sabit tutulması canlıların hangi özelliğine örnektir?`,[`Üreme`,`Homeostasi`,`Büyüme`,`Boşaltım`],1,`İç dengeyi koruma homeostasidir.`)]}),F({id:`b9-hucre`,subject:`biy`,grade:9,unit:`Tema 2: Organizasyon`,title:`Hücre ve organeller`,goal:`Hücrenin temel kısımlarını ve organellerin görevlerini tanımak.`,objectives:[`Organellerin görevlerini eşleştirir.`,`Bitki ve hayvan hücresini ayırt eder.`,`Prokaryot ve ökaryot hücreyi ayırır.`],prereq:[`b9-yasam`],minutes:35,difficulty:2,body:[`Hücre, canlıların yapı ve görev birimidir. Hücre zarı madde alışverişini kontrol eder (seçici geçirgendir).`,`Çekirdek hücrenin yönetim merkezidir; kalıtım maddesini (DNA) taşır. Mitokondri hücresel solunumla enerji (ATP) üretir. Ribozom protein sentezler. Kloroplast fotosentez yapar (bitki hücresinde). Koful madde depolar. Lizozom sindirim yapar.`,`Hücre duvarı yalnızca bitki hücresinde (ve bakteri, mantar gibi bazı canlılarda) bulunur; hayvan hücresinde yoktur. Bitki hücresinde kloroplast ve büyük koful vardır.`,`Prokaryot hücrede (bakteriler) zarla çevrili çekirdek ve zarlı organeller yoktur; ökaryot hücrede (bitki, hayvan, mantar) çekirdek bulunur.`],keyTerms:[{term:`Organel`,def:`Hücre içinde özel görevi olan yapı.`},{term:`Prokaryot`,def:`Çekirdeksiz (zarla çevrili çekirdek yok) hücre.`},{term:`ATP`,def:`Hücrenin enerji molekülü.`}],worked:[{q:`Hayvan hücresinde bulunmayan yapı hangisi?`,steps:[`Hücre duvarı ve kloroplast bitki hücresine özgüdür.`]}],reference:Ht(`Biyoloji`,`Organizasyon`),questions:[Gn(1,1,`Hücresel solunumla enerji (ATP) üretilen organel aşağıdakilerden hangisidir?`,[`Ribozom`,`Mitokondri`,`Koful`,`Lizozom`],1,`Mitokondri hücrenin enerji santralidir.`),Gn(2,1,`Aşağıdakilerden hangisi hayvan hücresinde bulunmaz?`,[`Çekirdek`,`Mitokondri`,`Hücre duvarı`,`Ribozom`],2,`Hücre duvarı bitki hücresine özgüdür.`),Gn(3,2,`Prokaryot hücrelerin ayırt edici özelliği nedir?`,[`Zarla çevrili çekirdeklerinin olmaması`,`Mitokondrileri olması`,`Yalnızca bitkilerde bulunmaları`,`Hücre zarının olmaması`],0,`Bakteriler gibi prokaryotlarda zarla çevrili çekirdek yoktur.`),Gn(4,1,`Protein sentezinin yapıldığı hücre bileşeni hangisidir?`,[`Ribozom`,`Kloroplast`,`Çekirdek`,`Hücre zarı`],0,`Proteinler ribozomlarda sentezlenir.`),Gn(5,2,`Hücre zarının temel görevi aşağıdakilerden hangisidir?`,[`Enerji üretmek`,`Madde alışverişini kontrol etmek`,`Protein üretmek`,`Fotosentez yapmak`],1,`Hücre zarı seçici geçirgendir ve madde giriş-çıkışını düzenler.`)]})],qn=P(`h9-tarih`,`tar`),Jn=P(`h9-kronoloji`,`tar`),Yn=`Resmî sitede 9. sınıfa ait bir Tarih programı doğrulanamadı (yalnızca seçmeli Çağdaş Türk ve Dünya Tarihi bulundu). Bu içerik genel bir giriş niteliğindedir; okulda işlenen kapsamla karşılaştır, işlenmediyse atla.`,Xn=[F({id:`h9-tarih`,subject:`tar`,grade:9,unit:`Tarih bilimine giriş`,title:`Tarih bilimi, kaynaklar ve yardımcı bilimler`,goal:`Tarihin ne olduğunu, kaynak türlerini ve yardımcı bilimleri ayırt etmek.`,objectives:[`Tarihî kaynakları sınıflandırır.`,`Yardımcı bilimleri eşleştirir.`,`Olay ve olguyu ayırt eder.`],minutes:25,difficulty:1,body:[`Tarih, geçmişte yaşanmış olayları zaman ve yer belirterek, belgelere dayanarak inceleyen bilimdir.`,`Kaynaklar: Birincil kaynaklar olayı yaşayanların bıraktığı belgelerdir (kitabe, ferman, anı, fotoğraf). İkincil kaynaklar sonradan, birincil kaynaklara dayanarak yazılmış eserlerdir (ders kitabı, makale).`,`Yardımcı bilimler: Arkeoloji (kazı ve buluntular), Nümizmatik (sikkeler), Epigrafi (yazıtlar), Paleografya (eski yazılar), Coğrafya, Kronoloji (zaman sıralaması), Etnografya (kültür).`,`Olay belli bir yer ve zamanda gerçekleşen tek seferlik durumdur (Malazgirt Savaşı, 1071). Olgu ise uzun süre devam eden, genel durumdur (göç, ticaret).`,`Tarihçi kaynakları eleştirel okur: kim yazmış, ne zaman yazmış, hangi amaçla yazmış?`],keyTerms:[{term:`Birincil kaynak`,def:`Olayı yaşayanların bıraktığı belge.`},{term:`Arkeoloji`,def:`Kazı ve buluntuları inceler.`},{term:`Nümizmatik`,def:`Sikkeleri inceler.`}],worked:[{q:`Bir kitabedeki yazıyı inceleyen bilim?`,steps:[`Yazıtları inceleyen bilim epigrafidir.`]}],reference:Yn,questions:[qn(1,1,`Aşağıdakilerden hangisi birincil kaynaktır?`,[`Bir ders kitabı`,`Bir savaşa katılan askerin yazdığı anı`,`Bir ansiklopedi maddesi`,`Bir tarih makalesi`],1,`Olayı yaşayanın anısı birincil kaynaktır; diğerleri sonradan yazılmış ikincil kaynaklardır.`),qn(2,1,`Kazılarda çıkan buluntuları inceleyen bilim dalı hangisidir?`,[`Arkeoloji`,`Nümizmatik`,`Epigrafi`,`Kronoloji`],0,`Arkeoloji kazı ve buluntuları inceler.`),qn(3,1,`Sikkeleri inceleyen bilim dalı hangisidir?`,[`Paleografya`,`Nümizmatik`,`Etnografya`,`Coğrafya`],1,`Sikke bilimi nümizmatiktir.`),qn(4,2,`Aşağıdakilerden hangisi tarihî olaya örnektir?`,[`Göç`,`Malazgirt Savaşı`,`Ticaret`,`Tarım`],1,`Malazgirt Savaşı belli bir yer ve zamanda gerçekleşen bir olaydır; diğerleri uzun süre devam eden olgulardır.`),qn(5,2,`Bir ferman aşağıdakilerden hangisi türünde bir kaynaktır?`,[`Sözlü kaynak`,`Yazılı kaynak`,`Görsel kaynak`,`Arkeolojik buluntu`],1,`Ferman yazılı bir belgedir.`)]}),F({id:`h9-kronoloji`,subject:`tar`,grade:9,unit:`Zaman ve kronoloji`,title:`Zaman, takvim ve yüzyıl hesabı`,goal:`Yıl ve yüzyılları sıralamak, takvim sistemlerini ayırt etmek.`,objectives:[`Bir yılın yüzyılını bulur.`,`M.Ö. yılları sıralar.`,`Takvim türlerini bilir.`],prereq:[`h9-tarih`],minutes:20,difficulty:1,body:[`Kronoloji, olayları zamana göre sıralayan bilimdir. Bir yüzyıl 100 yıldır.`,`Yüzyıl hesabı: Yılı 100’e böl; kalan varsa bölüme 1 ekle. 1453 → 14,53 → 15. yüzyıl. 1923 → 20. yüzyıl. Tam yüzyıl yıllarında (ör. 1900) kalan yoksa bölüm yüzyılı verir: 19. yüzyılın son yılı.`,`M.Ö. yıllarda sayı büyüdükçe olay daha eskidir: M.Ö. 500, M.Ö. 300’den eskidir.`,`Miladi takvim Hz. İsa’nın doğumu esas alınan takvimdir. Hicrî takvim, Hz. Muhammed’in Mekke’den Medine’ye hicretini (miladi 622) başlangıç alır.`],keyTerms:[{term:`Kronoloji`,def:`Zaman sıralaması bilimi.`},{term:`M.Ö.`,def:`Milattan önce.`},{term:`Hicrî takvim`,def:`Hicretle (622) başlayan takvim.`}],worked:[{q:`1071 hangi yüzyıldadır?`,steps:[`1071 ÷ 100 = 10,71 → kalan var → 11. yüzyıl.`]}],reference:Yn,questions:[Jn(1,1,`1453 yılı kaçıncı yüzyıldadır?`,[`14. yüzyıl`,`15. yüzyıl`,`16. yüzyıl`,`13. yüzyıl`],1,`1453 ÷ 100 = 14,53 → kalan var → 15. yüzyıl.`),Jn(2,1,`Aşağıdakilerden hangisi daha eski bir tarihtir?`,[`M.Ö. 300`,`M.Ö. 500`,`M.S. 100`,`M.S. 500`],1,`M.Ö. yıllarda sayı büyüdükçe olay eskidir: M.Ö. 500, M.Ö. 300’den eskidir.`),Jn(3,1,`1923 yılı kaçıncı yüzyıldadır?`,[`19. yüzyıl`,`20. yüzyıl`,`21. yüzyıl`,`18. yüzyıl`],1,`1923 ÷ 100 = 19,23 → 20. yüzyıl.`),Jn(4,1,`Bir yüzyıl kaç yıldır?`,[`10`,`50`,`100`,`1000`],2,`Bir yüzyıl 100 yıldır.`),Jn(5,2,`Hicrî takvimin b 0 m = 3 km.`),Zn(2,1,`Ekvator’un enlem değeri kaçtır?`,[`0°`,`23°27′`,`66°33′`,`90°`],0,`Ekvator 0° enlem çizgisidir.`),Zn(3,2,`Aşağıdaki ölçeklerden hangisi en büyük ölçektir?`,[`1/1.000.000`,`1/100.000`,`1/10.000`,`1/1.000`],3,`Paydası en küçük olan ölçek en büyüktür; en ayrıntılı gösterimi verir.`),Zn(4,1,`Meridyenler için aşağıdakilerden hangisi doğrudur?`,[`Ekvator’a paraleldir.`,`Kutupları birleştiren yarım dairelerdir.`,`Hepsi aynı uzunluktadır ve daireseldir.`,`Enlemi gösterir.`],1,`Meridyenler kutupları birleştirir ve boylamı gösterir; Ekvator’a paralel olanlar paralellerdir.`),Zn(5,2,`Başlangıç meridyeni olarak kabul edilen boylam kaçtır?`,[`0°`,`45°`,`90°`,`180°`],0,`Greenwich meridyeni 0° boylamdır.`)]}),F({id:`c9-dunya`,subject:`cog`,grade:9,unit:`Dünya’nın şekli ve hareketleri`,title:`Dünya’nın hareketleri ve sonuçları`,goal:`Dönme ve dolanma hareketlerinin gece-gündüz ve mevsimlerle ilişkisini açıklamak.`,objectives:[`Dönme ve dolanma hareketini ayırt eder.`,`Gece-gündüz ve mevsim oluşumunu açıklar.`],prereq:[`c9-harita`],minutes:25,difficulty:2,body:[`Dünya kendi ekseni etrafında batıdan doğuya doğru döner (dönme); bir tur yaklaşık 24 saattir. Sonucu gece-gündüzün oluşması ve yerel saat farkıdır.`,`Dünya Güneş etrafında dolanır (dolanma); bir tur yaklaşık 365 gün 6 saattir. Dönme ekseni yörünge düzlemine 23°27′ eğiktir. Eksen eğikliği ve dolanma birlikte mevsimleri oluşturur.`,`21 Haziran’da Güneş ışınları Yengeç Dönencesi’ne dik gelir; Kuzey Yarımküre’de en uzun gün ve yaz başlangıcı olur. 22 Aralık’ta Oğlak Dönencesi’ne dik gelir; Kuzey Yarımküre’de en kısa gün olur.`,`Ekvator’da gece ve gündüz süreleri yıl boyunca yaklaşık eşittir (12 saat civarı).`],keyTerms:[{term:`Dönme`,def:`Dünya’nın kendi ekseni etrafında dönmesi.`},{term:`Dolanma`,def:`Dünya’nın Güneş etrafındaki turu.`},{term:`Eksen eğikliği`,def:`Eksenin yörünge düzlemiyle 23°27′ açı yapması.`}],worked:[{q:`Mevsimler neden oluşur?`,steps:[`Dünya eksen eğikliğini koruyarak Güneş etrafında
